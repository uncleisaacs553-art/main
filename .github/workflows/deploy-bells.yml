name: Deploy Bells Private School (GitHub Pages)

on:
  push:
    branches: ["claude/immersive-website-redesign-zuwryp"]
    paths:
      - "bells-private-school/**"
      - ".github/workflows/deploy-bells.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bells-private-school

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
