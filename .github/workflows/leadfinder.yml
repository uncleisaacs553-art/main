name: B Digital — Lead Finder

# NOTE: scheduled runs only fire once this workflow is on the repo's DEFAULT branch.
# Until then, use "Run workflow" (workflow_dispatch) to test it on this branch.
on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC (08:00 in Namibia)
  workflow_dispatch:

permissions:
  contents: write          # allows committing the refreshed feedback cache

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: b-digital-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: b-digital-system/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run lead finder
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LEADS_DB: ${{ secrets.NOTION_LEADS_DB }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        run: python -m leadfinder.main

      - name: Commit refreshed feedback (default branch only)
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feedback.json || true
          git diff --cached --quiet || git commit -m "chore: update lead feedback"
          git push || true
