name: B Digital — Marketing Autopilot

# NOTE: scheduled runs only fire once this workflow is on the repo's DEFAULT branch.
# Until then, use "Run workflow" (workflow_dispatch) to test it on this branch.
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC (09:00 in Namibia)
  workflow_dispatch:

permissions:
  contents: write          # to commit the generated images

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: b-digital-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: b-digital-system/requirements.txt

      - run: pip install -r requirements.txt

      - name: Generate weekly content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CONTENT_DB: ${{ secrets.NOTION_CONTENT_DB }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m marketing.main

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/generated/*.png || true
          git diff --cached --quiet || git commit -m "chore: weekly marketing images"
          git push || true
