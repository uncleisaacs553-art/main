<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06070b" />
  <title>Not found — B Digital</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@300;400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .e404 { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .e404__inner { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .e404__num {
      font-family: var(--font-display); font-weight: 700; line-height: 1; margin-top: 0.6rem;
      font-size: clamp(4rem, 18vw, 9rem); letter-spacing: -0.03em;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .e404 p { color: var(--ink-soft); margin: 0.8rem 0 2rem; }
  </style>
</head>
<body>
  <main class="e404">
    <div class="e404__inner">
      <span class="loader__mark">B</span>
      <div class="e404__num">404</div>
      <p>That page drifted off the grid.</p>
      <a class="btn btn--solid" href="index.html">Back to B Digital</a>
    </div>
  </main>
</body>
</html>
