<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<title>NSSCO Economics 6145</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--card2:#1f2630;--line:#30363d;--ink:#e6edf3;--mut:#9da7b3;
  --acc:#58a6ff;--accbg:#10233d;--ok:#3fb950;--okbg:#0f2a19;--bad:#ff7b72;--badbg:#341a1c;--warn:#e3b341;--warnbg:#2e2510;
  --pur:#bc8cff;--purbg:#241b3a;--dem:#58a6ff;--sup:#f0883e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:break-word}
h1,h2,h3,h4{line-height:1.25;margin:0 0 8px}
h2{font-size:20px}h3{font-size:17px}h4{font-size:16px}
p{margin:8px 0}
ul,ol{margin:8px 0;padding-left:22px}li{margin:4px 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mut{color:var(--mut)}.small{font-size:14px}.center{text-align:center}
b,strong{font-weight:700}

/* ---------- top: HUD + tabs ---------- */
.top{position:sticky;top:0;z-index:20;background:#0d1117;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hud{display:flex;align-items:center;gap:10px;width:100%;max-width:760px;margin:0 auto;padding:8px 16px 6px;background:none;border:0;text-align:left;min-height:56px}
.lv{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--purbg);border:2px solid var(--pur);color:var(--pur);font-weight:800;font-size:17px}
.hudmid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.hudttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hudsub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--pur);border-radius:99px;transition:width .4s}
.stat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:44px;line-height:1.15}
.stat b{font-size:16px}.stat small{font-size:11px;color:var(--mut)}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;max-width:760px;margin:0 auto;padding:2px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;font-size:15px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#0d1117}
main{max-width:760px;margin:0 auto;padding:14px 16px 96px}

/* ---------- building blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.hero{background:linear-gradient(160deg,#16233a,#161b22 70%)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:#0d1117;font-weight:700;text-align:center;line-height:1.2}
.btn.ghost{background:transparent;color:var(--acc);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn.mid{background:var(--warn);border-color:var(--warn)}
.btn.big{width:100%;min-height:54px;font-size:17px}
.btn.sm{min-height:44px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,summary:focus-visible,.chip:focus-visible,.tabs button:focus-visible,.hud:focus-visible,.opt:focus-visible,.rule4 button:focus-visible,.yr:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row>.btn{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip small{color:var(--mut);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.chip[aria-pressed="true"] small{color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--card2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.acc{background:var(--accbg);color:var(--acc);border-color:transparent}
.tag.pur{background:var(--purbg);color:var(--pur);border-color:transparent}
.mk{display:inline-block;min-width:20px;padding:0 6px;margin:0 2px;border-radius:99px;background:var(--okbg);color:var(--ok);font-size:12px;font-weight:800;text-align:center;line-height:19px;vertical-align:1px}
.flag{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:#f2d58a;border-left:4px solid var(--warn);font-size:15px}
.flag b{color:var(--warn)}
.note{margin:6px 0 0;color:var(--mut);font-size:14px}
.ans{margin:10px 0 0;padding:12px;border-radius:10px;background:#0f1722;border:1px solid var(--line)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .3s}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:13px;letter-spacing:.03em}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin:10px 0 0}
input[type=text],input[type=number],input[type=search],select,textarea{display:block;width:100%;margin-top:4px;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0d1117;color:var(--ink);font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 10px}
summary{list-style:none;cursor:pointer;padding:12px 42px 12px 14px;min-height:50px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-weight:700;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;right:17px;top:50%;width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
details[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
details>.body{padding:0 14px 14px}
details details{background:var(--card2)}
.grow{flex:1 1 auto;min-width:0}

/* ---------- predicted ---------- */
.years{display:flex;flex-wrap:wrap;gap:6px}
.yr{min-width:56px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-weight:700;font-size:14px}
.yr[aria-pressed="true"]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.qa{border-top:1px solid var(--line);padding:10px 0 2px}
.qa:first-of-type{border-top:0}
.qa .q{font-weight:600}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 0 8px}
.sech h2{margin:0}

/* ---------- quiz ---------- */
.seg{display:flex;gap:8px}
.seg .chip{flex:1 1 0;justify-content:center}
.qhud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;font-weight:700;font-size:14px;margin:0 0 6px}
.hearts{color:var(--bad);letter-spacing:2px;font-size:18px}.hearts i{color:var(--line);font-style:normal}
.combo{color:var(--warn)}
.qtext{font-size:18px;line-height:1.45;margin:6px 0 14px;white-space:pre-line}
.markrow{display:flex;gap:8px;margin-top:12px}
.markrow .btn{flex:1 1 0;padding:10px 6px;min-height:56px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:8px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--ok)) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-size:40px}.ring span{font-size:14px;color:var(--mut)}
.trow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.trow:first-of-type{border-top:0}
.trow .bar{grid-column:1/-1;margin:2px 0 0;height:8px}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;min-height:44px;padding:8px 4px;font-size:14px}

/* ---------- traps ---------- */
.trap-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.trap-h h3{margin:4px 0 0}
.num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--badbg);color:var(--bad);font-weight:800}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.vs>div{border-radius:10px;padding:10px;font-size:15px;min-width:0}
.vs .w{background:var(--badbg);border:1px solid #5a2a2c}
.vs .c{background:var(--okbg);border:1px solid #1f5a31}
.vs .lbl{margin:0 0 4px}.vs .w .lbl{color:var(--bad)}.vs .c .lbl{color:var(--ok)}
.rule{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--accbg);border-left:4px solid var(--acc);font-size:15px}
.stmt{font-size:19px;line-height:1.4;font-weight:600;margin:10px 0 14px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .btn{min-height:64px;font-size:18px}
.fb{margin:12px 0 0;padding:12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid #1f5a31}.fb.bad{background:var(--badbg);border:1px solid #5a2a2c}
.fb h4{margin:0 0 4px}

/* ---------- diagrams ---------- */
.svgbox{background:#0f1722;border:1px solid var(--line);border-radius:12px;padding:6px;margin:8px 0}
.svgbox svg{display:block;width:100%;height:auto;max-width:460px;margin:0 auto}
.rule4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.rule4 button{min-height:76px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:8px;text-align:center;line-height:1.3}
.rule4 button b{display:block;font-size:15px}
.rule4 button span{display:block;font-size:15px;font-weight:800;margin-top:2px}
.rule4 button[data-c="D"] b{color:var(--dem)}.rule4 button[data-c="S"] b{color:var(--sup)}
.rule4 button[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.rule4 em{font-style:normal}
.wide{display:none}
th.rh{white-space:nowrap}
.up{color:var(--ok)}.down{color:var(--bad)}
.opts{display:grid;gap:8px;margin:8px 0}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:50px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;text-align:left;line-height:1.3}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);min-height:48px;margin:0;color:var(--ink);font-size:16px;font-weight:400;cursor:pointer}
.check:first-of-type{border-top:0}
.check input{flex:0 0 auto;width:24px;height:24px;margin:1px 0 0;accent-color:var(--ok)}
.check input:checked+span{color:var(--mut);text-decoration:line-through}

/* ---------- notes ---------- */
.def{padding:10px 0;border-top:1px solid var(--line)}
.def:first-child{border-top:0}
.def .k{font-weight:700;color:var(--acc)}
.selftest .def .dd{filter:blur(7px);cursor:pointer;user-select:none}
.selftest .def.shown .dd{filter:none;user-select:auto}
.toggle{display:flex;align-items:center;gap:10px;min-height:48px;margin:8px 0 0;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:var(--acc)}

/* ---------- long answers ---------- */
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-top:1px solid var(--line);margin:0}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accbg);color:var(--acc);font-weight:800;font-size:14px}
.tpl{border-radius:10px;padding:10px 12px;margin:8px 0;border-left:4px solid var(--line);background:var(--card2)}
.tpl.for{border-color:var(--ok)}.tpl.against{border-color:var(--bad)}.tpl.overall{border-color:var(--pur)}
.tpl h4{margin:0 0 4px;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.tpl.for h4{color:var(--ok)}.tpl.against h4{color:var(--bad)}.tpl.overall h4{color:var(--pur)}
.student{margin:8px 0;padding:12px;border-radius:10px;background:#0f1722;border:1px dashed var(--line);font-style:italic;white-space:pre-line}
.part{border-top:1px solid var(--line);padding:10px 0 4px}
.part:first-of-type{border-top:0}
.part .q{font-weight:600}

/* ---------- toast + sheet ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:#2b3442;border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.toast.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.toast.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.toast.lvl{background:var(--purbg);border-color:var(--pur);color:var(--pur)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(1,4,9,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:760px;max-height:92vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheethead h2{margin:0}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;color:var(--mut);background:var(--card)}
.badge b{display:block;color:var(--mut);font-size:15px}
.badge.on{border-color:var(--pur);background:var(--purbg);color:var(--ink)}
.badge.on b{color:var(--pur)}
.mission{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.mission:first-of-type{border-top:0}
@media (min-width:620px){.wide{display:inline}.vs>div{padding:12px}.rule4 button{min-height:84px}.badges{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top">
  <button class="hud" id="hud" data-act="sheet-open" aria-label="Open my progress">
    <span class="lv" id="hud-lv">1</span>
    <span class="hudmid">
      <span class="hudttl">NSSCO Economics<span class="wide"> 6145</span></span>
      <span class="xpbar"><i id="hud-xp"></i></span>
      <span class="hudsub" id="hud-sub">Street vendor · 0 XP</span>
    </span>
    <span class="stat"><b id="hud-streak">0</b><small>day streak</small></span>
    <span class="stat" id="hud-gradebox"><b id="hud-grade">–</b><small>quiz grade</small></span>
  </button>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</div>
<main>
  <noscript><div class="card">This study app needs JavaScript. Turn it on in your browser settings and reload the page.</div></noscript>
  <section class="tab" id="tab-pred" role="tabpanel" hidden></section>
  <section class="tab" id="tab-quiz" role="tabpanel" hidden></section>
  <section class="tab" id="tab-traps" role="tabpanel" hidden></section>
  <section class="tab" id="tab-diag" role="tabpanel" hidden></section>
  <section class="tab" id="tab-notes" role="tabpanel" hidden></section>
  <section class="tab" id="tab-long" role="tabpanel" hidden></section>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="My progress" hidden><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============================ DATA ============================ -->
<script id="data">
/* Content notes
   - Every question and mark scheme below is EXAM-STYLE: written to the NSSCO 6145 format. They are not copied from
     the official papers. Real past-paper questions are added by the learner inside the app (Quiz tab).
   - (1) in an answer = where one mark falls.  r = marker's restriction (amber flag).  e = example / extra.
   - p = key of a topic on the Predicted tab.  nq = notes only, not a quiz question. */
window.EconData = (function () {
var THEMES = [
  {id:"bep", n:"Basic economic problem", s:"Basic problem"},
  {id:"sys", n:"Economic systems and market failure", s:"Systems & failure"},
  {id:"dse", n:"Demand, supply and elasticity", s:"Demand & supply"},
  {id:"mon", n:"Money and banking", s:"Money & banks"},
  {id:"lab", n:"Labour, wages and trade unions", s:"Labour"},
  {id:"frm", n:"Firms, costs and market structure", s:"Firms"},
  {id:"gov", n:"Government and policy", s:"Government"},
  {id:"ind", n:"Indicators and development", s:"Indicators"},
  {id:"int", n:"International trade", s:"Trade"}
];

var DEFS = [
// ---------- 1. Basic economic problem ----------
{t:"bep",k:"The economic problem",d:"Wants are unlimited (1) but the resources to satisfy them are limited / scarce (1).",p:"oc",q:"What is meant by the basic economic problem?"},
{t:"bep",k:"Scarcity",d:"Resources are limited / there are not enough of them (1) to satisfy all of people's unlimited wants (1).",p:"oc"},
{t:"bep",k:"Opportunity cost",d:"The next best alternative (1) given up / forgone when a choice is made (1).",r:"Must say NEXT BEST. “Something you give up” on its own scores 1.",p:"oc"},
{t:"bep",k:"Factors of production",d:"Scarce resources (1) used to make goods and services (1).",e:"Land, labour, capital, enterprise.",p:"oc"},
{t:"bep",k:"Land",d:"All natural resources / gifts of nature (1) used in production, e.g. fish, diamonds, uranium, farmland (1).",e:"Reward: rent.",q:"Define land as a factor of production."},
{t:"bep",k:"Labour",d:"Human effort, physical and mental (1), used in production (1).",e:"Reward: wages.",q:"Define labour as a factor of production."},
{t:"bep",k:"Capital",d:"Man-made resources (1) used to produce other goods and services, e.g. machinery, tools, factories (1).",r:"Capital here is NOT money. Do not write “money”.",e:"Reward: interest.",q:"Define capital as a factor of production."},
{t:"bep",k:"Enterprise",d:"The factor that organises / combines the other factors of production (1) and takes the risks of the business (1).",e:"Reward: profit. The person is the entrepreneur.",q:"Define enterprise as a factor of production."},
{t:"bep",k:"Production possibility curve (PPC)",d:"A curve showing the maximum combinations of two goods (1) that an economy can produce with its existing resources and technology (1).",p:"ppc",q:"Define a production possibility curve (PPC)."},
{t:"bep",k:"Economic good",d:"A good that is scarce / takes scarce resources to produce (1), so it has an opportunity cost / a price (1).",q:"Define an economic good."},
{t:"bep",k:"Free good",d:"A good that is not scarce / is available without limit (1), so it has no opportunity cost, e.g. air, sunshine (1).",r:"A free good is NOT a public good, and NOT something the government gives away free of charge.",q:"Define a free good."},
{t:"bep",k:"Needs and wants",d:"Needs: goods essential for survival, e.g. food, water, shelter (1). Wants: goods people would like to have but can live without (1).",q:"Distinguish between needs and wants."},
{t:"bep",k:"Consumer goods and capital goods",d:"Consumer goods: bought by households for their own satisfaction, e.g. bread, a cellphone (1). Capital goods: used by firms to produce other goods, e.g. a fishing trawler (1).",q:"Distinguish between consumer goods and capital goods."},
{t:"bep",k:"Choice",d:"Because resources are scarce, people, firms and governments cannot have everything they want (1), so they must decide which wants to satisfy and which to go without (1).",q:"Explain why scarcity leads to choice.",p:"oc"},

// ---------- 2. Economic systems and market failure ----------
{t:"sys",k:"Market economy",d:"Resources are allocated by the price mechanism / demand and supply (1); resources are privately owned with little or no government intervention (1).",q:"Define a market economy."},
{t:"sys",k:"Planned economy",d:"The government decides what, how and for whom to produce (1); resources are owned by the state (1).",e:"Also called a command economy.",q:"Define a planned (command) economy."},
{t:"sys",k:"Mixed economy",d:"An economy with both a private sector and a public sector (1); resources are allocated partly by the price mechanism and partly by the government (1).",e:"Namibia is a mixed economy.",q:"Define a mixed economy."},
{t:"sys",k:"Private sector",d:"The part of the economy owned and run by private individuals and firms (1), usually aiming to make a profit (1).",e:"FNB Namibia, Shoprite, a taxi owner in Katutura.",p:"priv",q:"Define the private sector."},
{t:"sys",k:"Public sector",d:"The part of the economy owned and controlled by the government (1), aiming to provide a service for citizens rather than a profit (1).",e:"NamPower, NamWater, NBC, state schools and hospitals.",p:"priv",q:"Define the public sector."},
{t:"sys",k:"Price mechanism",d:"The way demand and supply interact (1) to set prices and so decide how resources are allocated (1).",q:"Define the price mechanism."},
{t:"sys",k:"Market failure",d:"When the price mechanism / market forces fail to allocate resources efficiently (1), so too much of a harmful good or too little of a beneficial good is produced (1).",p:"extc"},
{t:"sys",k:"Private cost",d:"A cost paid by the producer or consumer of a good themselves (1), e.g. wages, raw materials, fuel (1).",p:"extc",q:"Define private cost."},
{t:"sys",k:"External cost",d:"A harmful effect of production or consumption on third parties (1) who are not part of the transaction and are not compensated, e.g. pollution (1).",r:"THIRD PARTIES is the key phrase. This is the trap: do not call it social cost.",p:"extc",q:"Define external cost."},
{t:"sys",k:"Social cost",d:"Private cost (1) plus external cost (1).",r:"Social cost is the TOTAL cost to society. It is not “harm to third parties”.",p:"extc",q:"Define social cost."},
{t:"sys",k:"Private benefit",d:"A benefit received by the producer or consumer themselves (1), e.g. a firm's revenue or a consumer's satisfaction (1).",p:"extc",q:"Define private benefit."},
{t:"sys",k:"External benefit",d:"A beneficial effect on third parties (1) who do not pay for it, e.g. a vaccinated person does not spread the disease to others (1).",p:"extc",q:"Define external benefit."},
{t:"sys",k:"Social benefit",d:"Private benefit (1) plus external benefit (1).",p:"extc",q:"Define social benefit."},
{t:"sys",k:"Public good",d:"A good that is non-excludable: nobody can be stopped from using it (1); and non-rival: one person's use does not reduce the amount left for others (1).",r:"Not the same as a free good. Not “anything the government provides”.",e:"Street lighting, national defence.",q:"Define a public good."},
{t:"sys",k:"Merit good",d:"A good that is more beneficial than consumers realise (1), so it is under-consumed if left to the market, e.g. education, health care (1).",q:"Define a merit good."},
{t:"sys",k:"Demerit good",d:"A good that is more harmful than consumers realise (1), so it is over-consumed if left to the market, e.g. cigarettes, alcohol (1).",q:"Define a demerit good."},
{t:"sys",k:"Privatisation",d:"The sale / transfer of state-owned enterprises (1) to the private sector (1).",p:"priv"},
{t:"sys",k:"Nationalisation",d:"The transfer of a firm or industry from the private sector (1) to government ownership (1).",p:"priv"},
{t:"sys",k:"Conservation of resources",d:"Protecting and using natural resources carefully (1) so that they are still available for future generations (1).",e:"Fishing quotas (total allowable catch) protect fish stocks off Walvis Bay and Lüderitz.",q:"What is meant by the conservation of resources?"},
{t:"sys",k:"Regulation",d:"Rules or laws set by the government (1) to control the behaviour of firms or consumers, e.g. pollution limits, with fines for breaking them (1).",q:"Define regulation."},

// ---------- 3. Demand, supply and elasticity ----------
{t:"dse",k:"Market",d:"Any arrangement that brings buyers and sellers together (1) to exchange goods and services (1).",q:"Define a market."},
{t:"dse",k:"Demand",d:"The quantity of a good that consumers are willing and able to buy (1) at a given price in a given period of time (1).",r:"“Want” alone scores 0. It must be willing AND able.",p:"sd"},
{t:"dse",k:"Supply",d:"The quantity of a good that producers are willing and able to sell (1) at a given price in a given period of time (1).",p:"sd"},
{t:"dse",k:"Equilibrium price",d:"The price at which quantity demanded equals quantity supplied (1), so there is no shortage or surplus / the market clears (1).",p:"sd",q:"Define equilibrium price."},
{t:"dse",k:"Movement along a curve",d:"A change in quantity demanded or supplied caused ONLY by a change in the good's own price (1), shown as a move along the same curve: extension or contraction (1).",r:"Price of the good itself = movement. Never a shift.",p:"sd",q:"What is meant by a movement along a demand or supply curve?"},
{t:"dse",k:"Shift of a curve",d:"A change in demand or supply at every price (1), caused by any factor other than the good's own price; a new curve is drawn (1).",p:"sd",q:"What is meant by a shift of a demand or supply curve?"},
{t:"dse",k:"Excess demand",d:"Quantity demanded is greater than quantity supplied (1) because price is below the equilibrium: a shortage (1).",p:"pcon"},
{t:"dse",k:"Excess supply",d:"Quantity supplied is greater than quantity demanded (1) because price is above the equilibrium: a surplus (1).",p:"pcon"},
{t:"dse",k:"Price elasticity of demand (PED)",d:"The responsiveness of quantity demanded (1) to a change in price (1).",e:"PED = % change in quantity demanded ÷ % change in price.",p:"ped",q:"Define price elasticity of demand."},
{t:"dse",k:"Price elastic demand",d:"A change in price causes a larger percentage change in quantity demanded (1); PED is greater than 1 (1).",p:"ped",q:"What is meant by price elastic demand?"},
{t:"dse",k:"Price inelastic demand",d:"A change in price causes a smaller percentage change in quantity demanded (1); PED is less than 1 (1).",p:"ped",q:"What is meant by price inelastic demand?"},
{t:"dse",k:"Price elasticity of supply (PES)",d:"The responsiveness of quantity supplied (1) to a change in price (1).",e:"PES = % change in quantity supplied ÷ % change in price.",q:"Define price elasticity of supply."},
{t:"dse",k:"Substitutes",d:"Goods that can be used in place of each other, e.g. butter and margarine (1); if the price of one rises, demand for the other rises (1).",q:"Define substitute goods."},
{t:"dse",k:"Complements",d:"Goods that are used together / jointly demanded, e.g. cars and petrol (1); if the price of one rises, demand for the other falls (1).",q:"Define complementary goods."},
{t:"dse",k:"Normal and inferior goods",d:"Normal good: demand rises when income rises (1). Inferior good: demand falls when income rises (1).",q:"Distinguish between a normal good and an inferior good."},
{t:"dse",k:"Maximum price",d:"A legal upper limit on price (1), set below the equilibrium price to protect consumers (1).",e:"Result: a shortage (excess demand).",p:"pcon",q:"Define a maximum price."},
{t:"dse",k:"Minimum price",d:"A legal lower limit on price (1), set above the equilibrium price to protect producers or workers (1).",e:"Result: a surplus (excess supply).",p:"pcon",q:"Define a minimum price."},
{t:"dse",k:"Subsidy",d:"A payment by the government to producers (1) to lower their costs of production, so that supply rises and price falls (1).",p:"sd",q:"Define a subsidy."},
{t:"dse",k:"Ceteris paribus",d:"All other things / factors (1) remaining unchanged (1).",q:"What is meant by ceteris paribus?"},

// ---------- 4. Money and banking ----------
{t:"mon",k:"Money",d:"Anything that is generally accepted (1) as a means of payment for goods and services (1).",p:"money"},
{t:"mon",k:"Barter",d:"The direct exchange of goods and services for other goods and services (1) without the use of money (1)."},
{t:"mon",k:"Double coincidence of wants",d:"Each trader must have what the other wants (1) and want what the other has (1).",q:"What is meant by a double coincidence of wants?"},
{t:"mon",k:"Medium of exchange",d:"Money is accepted in payment for goods and services (1), so there is no need for barter / a double coincidence of wants (1).",p:"money",q:"Explain money's function as a medium of exchange."},
{t:"mon",k:"Measure of value",d:"Money allows the value / prices of different goods and services to be stated and compared (1) in one common unit (1).",r:"Comparing prices = MEASURE OF VALUE. Paying for things = medium of exchange. Do not swap them.",e:"Also called a unit of account.",p:"money",q:"Explain money's function as a measure of value."},
{t:"mon",k:"Store of value",d:"Money can be saved (1) and used to buy goods in the future, as long as it keeps its value (1).",p:"money",q:"Explain money's function as a store of value."},
{t:"mon",k:"Standard for deferred payment",d:"Money allows goods to be bought now and paid for later (1), which makes credit and borrowing possible (1).",p:"money",q:"Explain money's function as a standard for deferred payment."},
{t:"mon",k:"Qualities of good money",d:"Acceptable, durable, portable, divisible, scarce (limited in supply), uniform / hard to forge.",r:"These are QUALITIES, not functions. In a functions question: NO need to explain the qualities of money. They score nothing there.",nq:1},
{t:"mon",k:"Commercial bank",d:"A financial institution that accepts deposits and makes loans to the public and firms (1), aiming to make a profit for its owners / shareholders (1).",e:"FNB Namibia, Bank Windhoek, Standard Bank Namibia, Nedbank Namibia.",p:"money",q:"Define a commercial bank."},
{t:"mon",k:"Central bank",d:"The government-owned bank that controls the country's money supply and banking system (1) and acts as banker to the government and to the commercial banks (1).",e:"The Bank of Namibia.",p:"money",q:"Define a central bank."},
{t:"mon",k:"Lender of last resort",d:"The central bank lends to commercial banks (1) that are short of cash and cannot borrow anywhere else (1).",q:"What is meant by the central bank being the lender of last resort?"},
{t:"mon",k:"Repo rate",d:"The interest rate at which the central bank (Bank of Namibia) lends to commercial banks (1); when it changes, the rates banks charge their customers change too (1).",p:"policy",q:"What is the repo rate?"},
{t:"mon",k:"Interest rate",d:"The cost of borrowing money (1) and the reward for saving (1).",q:"Define the rate of interest."},
{t:"mon",k:"Saving",d:"The part of income that is not spent (1); consumption is postponed to the future (1)."},
{t:"mon",k:"Disposable income",d:"Income left after direct taxes have been deducted (and state benefits added) (1), which is available to spend or save (1)."},
{t:"mon",k:"Stock exchange",d:"A market where existing (second-hand) shares and government bonds are bought and sold (1), and where public limited companies can raise finance by issuing new shares (1).",e:"The Namibian Stock Exchange (NSX) in Windhoek.",p:"nsx",q:"Define a stock exchange."},
{t:"mon",k:"Share",d:"A unit of ownership in a company (1); the shareholder is entitled to part of the profit (1).",p:"nsx",q:"Define a share."},
{t:"mon",k:"Dividend",d:"The part of a company's profit (1) that is paid out to its shareholders (1).",p:"nsx",q:"Define a dividend."},
{t:"mon",k:"Money supply",d:"The total amount of money in circulation in an economy (1): notes, coins and bank deposits (1).",q:"Define the money supply."},
{t:"mon",k:"Overdraft and loan",d:"Overdraft: the bank lets a customer spend more than is in the current account up to an agreed limit, with interest charged only on the amount overdrawn (1). Loan: a fixed sum borrowed for a fixed period and repaid in instalments with interest (1).",q:"Distinguish between an overdraft and a bank loan."},

// ---------- 5. Labour, wages and trade unions ----------
{t:"lab",k:"Specialisation",d:"When a person, firm, region or country concentrates (1) on producing one good or service, or a narrow range of them (1).",p:"dol"},
{t:"lab",k:"Division of labour",d:"The production process is broken down into separate tasks (1) and each worker concentrates on one task (1).",p:"dol",q:"Define division of labour."},
{t:"lab",k:"Wages and salaries",d:"Wage: payment for labour that varies with the hours worked or output, usually paid weekly (1). Salary: a fixed annual amount paid monthly (1).",q:"Distinguish between a wage and a salary."},
{t:"lab",k:"Real income",d:"Income adjusted for inflation (1): what money income can actually buy / its purchasing power (1).",q:"Define real income."},
{t:"lab",k:"Non-wage factors",d:"Features of a job other than pay that influence the choice of occupation (1), e.g. job security, holidays, working hours, promotion prospects (1).",q:"What are non-wage factors?"},
{t:"lab",k:"Occupational mobility of labour",d:"The ability / willingness of workers to move from one job or occupation to another (1); it depends on skills, qualifications and training (1).",r:"Occupational = change of JOB. Do not describe moving to another town.",p:"mob",q:"Define occupational mobility of labour."},
{t:"lab",k:"Geographical mobility of labour",d:"The ability / willingness of workers to move from one area or region to another to work (1), e.g. from Oshakati to Walvis Bay; it depends on housing costs and family ties (1).",r:"Geographical = change of PLACE.",p:"mob",q:"Define geographical mobility of labour."},
{t:"lab",k:"Trade union",d:"An organisation of workers (1) formed to protect and improve its members' pay and working conditions (1).",e:"Mineworkers Union of Namibia (MUN), NANTU for teachers, the NUNW federation.",p:"tu",q:"Define a trade union."},
{t:"lab",k:"Collective bargaining",d:"Negotiation between trade union representatives and employers (1) over pay and working conditions on behalf of all the members (1).",p:"tu",q:"Define collective bargaining."},
{t:"lab",k:"Industrial action",d:"Action taken by workers to put pressure on their employer (1), e.g. a strike, a go-slow, work-to-rule or an overtime ban (1).",p:"tu",q:"Define industrial action."},
{t:"lab",k:"Strike",d:"Workers refuse to work / withdraw their labour (1) to put pressure on the employer to meet their demands (1).",p:"tu",q:"Define a strike."},
{t:"lab",k:"Minimum wage",d:"The lowest wage rate an employer is legally allowed to pay (1), set by the government above the market (equilibrium) wage (1).",p:"pcon",q:"Define a national minimum wage."},
{t:"lab",k:"Transfer earnings",d:"The minimum payment needed to keep a factor of production (a worker) in its present use (1): what it could earn in its next best use (1).",r:"NOT transfer payments. Transfer payments are government grants such as the old-age pension.",q:"Define transfer earnings."},
{t:"lab",k:"Productivity",d:"Output per worker / per unit of input (1) in a given period of time (1).",q:"Define productivity."},
{t:"lab",k:"Derived demand",d:"Labour is not demanded for its own sake (1); the demand for workers depends on the demand for the product they make (1).",q:"What is meant by saying the demand for labour is a derived demand?"},
{t:"lab",k:"Labour-intensive production",d:"Production that uses a high proportion of labour compared with capital (1), e.g. picking table grapes by hand at Aussenkehr (1).",q:"Define labour-intensive production."},
{t:"lab",k:"Capital-intensive production",d:"Production that uses a high proportion of capital (machinery) compared with labour (1), e.g. open-pit uranium mining at Husab (1).",q:"Define capital-intensive production."},

// ---------- 6. Firms, costs and market structure ----------
{t:"frm",k:"Sole trader",d:"A business owned and controlled by one person (1), who keeps all the profit but has unlimited liability (1).",p:"biz",q:"Define a sole trader."},
{t:"frm",k:"Partnership",d:"A business owned by two to twenty people (1) who share the profits, the decisions and the risks (1).",p:"biz",q:"Define a partnership."},
{t:"frm",k:"Private limited company",d:"A company owned by shareholders with limited liability (1); its shares cannot be sold to the general public (1).",e:"Written (Pty) Ltd in Namibia.",p:"biz",q:"Define a private limited company."},
{t:"frm",k:"Public limited company",d:"A company owned by shareholders with limited liability (1); its shares can be sold to the general public on the stock exchange (1).",r:"A public limited company is in the PRIVATE sector. It is not owned by the government.",p:"biz",q:"Define a public limited company."},
{t:"frm",k:"Limited liability",d:"Shareholders can lose only the amount they invested in the business (1); their personal possessions are safe if the firm fails (1).",p:"biz"},
{t:"frm",k:"Unlimited liability",d:"The owners are personally responsible for all the debts of the business (1) and may have to sell personal possessions to pay them (1).",p:"biz"},
{t:"frm",k:"Public corporation",d:"A business owned and controlled by the government (1) that aims to provide a service to the public rather than maximise profit (1).",e:"Also called a state-owned enterprise or parastatal: NamPower, NamWater, NBC, TransNamib, Namport.",p:"priv",q:"Define a public corporation (state-owned enterprise)."},
{t:"frm",k:"Multinational company",d:"A company that produces / has operations in more than one country (1), with its head office in one country (1).",q:"Define a multinational company."},
{t:"frm",k:"Co-operative",d:"A business owned and run by its members (1), who share the profits and have one vote each (1).",q:"Define a co-operative."},
{t:"frm",k:"Fixed cost",d:"A cost that does not change with output in the short run (1), e.g. rent, insurance, loan interest; it is paid even when output is zero (1).",p:"cost",q:"Define fixed cost."},
{t:"frm",k:"Variable cost",d:"A cost that changes directly with output (1), e.g. raw materials, wages of production workers (1).",p:"cost",q:"Define variable cost."},
{t:"frm",k:"Total cost",d:"Fixed cost (1) plus variable cost (1).",p:"cost",q:"Define total cost."},
{t:"frm",k:"Average cost",d:"Total cost (1) divided by output (1).",e:"Also called unit cost or average total cost.",p:"cost",q:"Define average cost."},
{t:"frm",k:"Average fixed cost",d:"Total FIXED cost (1) divided by output (1).",r:"Divide the FIXED cost only. Dividing total cost gives average total cost and scores 0.",e:"It falls all the time as output rises.",p:"cost",q:"Define average fixed cost."},
{t:"frm",k:"Total revenue",d:"Price (1) multiplied by quantity sold (1).",p:"cost",q:"Define total revenue."},
{t:"frm",k:"Average revenue",d:"Total revenue (1) divided by quantity sold (1).",r:"Average revenue = TR ÷ quantity = PRICE per unit. It is not profit.",p:"cost",q:"Define average revenue."},
{t:"frm",k:"Profit",d:"Total revenue (1) minus total cost (1).",p:"cost",q:"Define profit."},
{t:"frm",k:"Economies of scale",d:"The fall in average (unit) cost (1) as a firm's scale of production / output increases (1).",p:"eos"},
{t:"frm",k:"Internal economies of scale",d:"Falling average cost as ONE firm grows larger (1), e.g. bulk buying, financial, managerial, technical or risk-bearing economies (1).",r:"Internal = inside ONE firm.",p:"eos",q:"Define internal economies of scale."},
{t:"frm",k:"External economies of scale",d:"Falling average cost for every firm as the WHOLE INDUSTRY grows, often in one area (1), e.g. shared ports and roads, a pool of skilled labour, support firms nearby (1).",r:"External = the WHOLE INDUSTRY. Bulk buying is not an external economy.",p:"eos",q:"Define external economies of scale."},
{t:"frm",k:"Diseconomies of scale",d:"The rise in average cost (1) when a firm grows too large (1).",e:"Communication problems, slow decisions, low worker morale.",p:"eos"},
{t:"frm",k:"Horizontal integration",d:"A merger between firms at the same stage of production (1) in the same industry, e.g. two banks (1).",p:"integ",q:"Define horizontal integration."},
{t:"frm",k:"Vertical integration",d:"A merger between firms at different stages of production in the same industry (1): backward towards the supplier, forward towards the customer (1).",p:"integ",q:"Define vertical integration."},
{t:"frm",k:"Conglomerate integration",d:"A merger between firms in different, unrelated industries (1), which spreads risk across several markets (1).",p:"integ",q:"Define conglomerate integration."},
{t:"frm",k:"Monopoly",d:"A market with a single seller / one firm supplying the whole market (1); the firm is a price maker, protected by barriers to entry (1).",r:"Monopoly = price MAKER, never price taker.",p:"mono",q:"Define a monopoly."},
{t:"frm",k:"Perfect competition",d:"A market with many buyers and sellers of an identical product (1); firms are price takers and there are no barriers to entry (1).",p:"mono"},
{t:"frm",k:"Barriers to entry",d:"Obstacles that prevent new firms from entering a market (1), e.g. patents, high start-up costs, control of raw materials (1).",p:"mono"},
{t:"frm",k:"Price maker and price taker",d:"Price maker: a firm with the power to set its own price, e.g. a monopoly (1). Price taker: a firm that must accept the market price, as in perfect competition (1).",p:"mono",q:"Distinguish between a price maker and a price taker."},

// ---------- 7. Government and policy ----------
{t:"gov",k:"Macroeconomic aims",d:"Economic growth, low unemployment (full employment), price stability (low inflation), balance of payments stability, and a fairer distribution of income.",p:"policy",nq:1},
{t:"gov",k:"Fiscal policy",d:"The use of government spending and taxation (1) to influence total (aggregate) demand in the economy (1).",e:"Set out by the Minister of Finance in the Budget.",p:"policy"},
{t:"gov",k:"Monetary policy",d:"The use of interest rates and the money supply (1) by the central bank to influence total (aggregate) demand (1).",e:"The Bank of Namibia sets the repo rate.",p:"policy"},
{t:"gov",k:"Supply-side policy",d:"A policy to increase the productive capacity / total supply of the economy (1) by improving the quantity or quality of the factors of production, e.g. education and training (1).",p:"policy",q:"Define supply-side policy."},
{t:"gov",k:"Budget",d:"The government's plan of its expected revenue and spending (1) for the coming financial year (1).",q:"Define the government budget."},
{t:"gov",k:"Budget deficit",d:"Government spending is greater than government revenue (1) in a year (1).",p:"policy",q:"Define a budget deficit."},
{t:"gov",k:"Budget surplus",d:"Government revenue is greater than government spending (1) in a year (1).",q:"Define a budget surplus."},
{t:"gov",k:"National debt",d:"The total amount the government owes (1), built up from borrowing to cover past budget deficits (1).",q:"Define the national debt."},
{t:"gov",k:"Direct tax",d:"A tax on income or wealth (1), paid straight to the government by the person or firm it is charged on; the burden cannot be passed on (1).",e:"Income tax (PAYE), company tax.",p:"tax",q:"Define a direct tax."},
{t:"gov",k:"Indirect tax",d:"A tax on spending on goods and services (1); it is collected by sellers, who can pass the burden on to consumers in higher prices (1).",r:"Tariffs (customs duties) are INDIRECT taxes.",e:"VAT, excise duty, customs duty, fuel levy.",p:"tax",q:"Define an indirect tax."},
{t:"gov",k:"Progressive tax",d:"A tax that takes a higher percentage of income (1) as income rises (1).",e:"Namibia's income tax.",p:"tax",q:"Define a progressive tax."},
{t:"gov",k:"Proportional tax",d:"A tax that takes the same percentage of income (1) at every level of income (1).",r:"Same PERCENTAGE, not the same amount. Do not mix it up with progressive.",p:"tax",q:"Define a proportional tax."},
{t:"gov",k:"Regressive tax",d:"A tax that takes a higher percentage of income from low-income earners (1) than from high-income earners (1).",e:"VAT works this way.",p:"tax",q:"Define a regressive tax."},
{t:"gov",k:"Transfer payments",d:"Payments made by the government to individuals (1) for which no good or service is produced in return, e.g. the old-age pension, child grants (1).",r:"NOT transfer earnings. Transfer earnings are about keeping a worker in a job.",q:"Define transfer payments."},
{t:"gov",k:"Current and capital expenditure",d:"Current expenditure: day-to-day spending, e.g. teachers' salaries, medicines (1). Capital expenditure: spending on long-lasting assets, e.g. roads, schools, clinics (1).",q:"Distinguish between government current expenditure and capital expenditure."},
{t:"gov",k:"Redistribution of income",d:"The government uses progressive taxes and transfer payments (1) to narrow the gap between rich and poor (1).",q:"What is meant by the redistribution of income?"},
{t:"gov",k:"Qualities of a good tax",d:"Equitable (based on ability to pay), certain (people know how much and when), convenient (easy to pay), economical (cheap to collect).",nq:1},

// ---------- 8. Indicators and development ----------
{t:"ind",k:"Inflation",d:"A sustained / persistent rise (1) in the general price level (1).",r:"“Prices go up” scores 1 at most. Say SUSTAINED and GENERAL price level.",p:"infl"},
{t:"ind",k:"Deflation",d:"A sustained fall (1) in the general price level (1)."},
{t:"ind",k:"Consumer price index",d:"A measure of the change in the average price of a weighted basket of goods and services (1) bought by a typical household (1).",e:"The Namibia Statistics Agency publishes the NCPI every month.",p:"infl",q:"What is the consumer price index (CPI)?"},
{t:"ind",k:"Demand-pull inflation",d:"Inflation caused by total (aggregate) demand rising faster than total supply (1): too much money chasing too few goods (1).",p:"infl",q:"Define demand-pull inflation."},
{t:"ind",k:"Cost-push inflation",d:"Inflation caused by rising costs of production, e.g. wages, imported fuel (1), which firms pass on as higher prices (1).",p:"infl",q:"Define cost-push inflation."},
{t:"ind",k:"Unemployment",d:"People of working age who are willing and able to work (1) and are actively looking for a job but cannot find one (1).",p:"unemp"},
{t:"ind",k:"Frictional unemployment",d:"Short-term unemployment (1) while workers are moving between jobs or looking for their first job (1).",p:"unemp",q:"Define frictional unemployment."},
{t:"ind",k:"Structural unemployment",d:"Unemployment caused by a change in the structure of the economy (1): an industry declines or workers' skills are no longer needed, e.g. a mine closes or machines replace workers (1).",p:"unemp",q:"Define structural unemployment."},
{t:"ind",k:"Cyclical unemployment",d:"Unemployment caused by a lack of total (aggregate) demand (1) during a recession (1).",p:"unemp",q:"Define cyclical unemployment."},
{t:"ind",k:"Seasonal unemployment",d:"Unemployment caused by the demand for labour changing with the time of year (1), e.g. in tourism, farming at harvest time, fishing (1).",p:"unemp",q:"Define seasonal unemployment."},
{t:"ind",k:"Gross domestic product (GDP)",d:"The total value of all goods and services produced (1) within a country's borders in a year (1).",p:"dev",q:"Define gross domestic product (GDP)."},
{t:"ind",k:"Gross national product (GNP)",d:"GDP (1) plus net income from abroad (1).",r:"GNP = GDP + NET INCOME FROM ABROAD. Nothing to do with adding exports.",p:"dev",q:"Define gross national product (GNP)."},
{t:"ind",k:"GDP per capita",d:"GDP (1) divided by the population (1).",e:"Average output / income per person.",p:"dev",q:"Define GDP per capita."},
{t:"ind",k:"Real GDP",d:"GDP adjusted for inflation (1), so it shows the change in the actual volume of output (1).",q:"Define real GDP."},
{t:"ind",k:"Economic growth",d:"An increase in real GDP (1) over a period of time / an increase in the productive capacity of the economy (1).",p:"dev"},
{t:"ind",k:"Recession",d:"A fall in real GDP (1) for two quarters in a row (1).",q:"Define a recession."},
{t:"ind",k:"Standard of living",d:"The level of material well-being of people (1): the goods and services they can afford and have access to (1).",p:"dev",q:"Define the standard of living."},
{t:"ind",k:"Human Development Index",d:"A measure of development that combines income per head, education (years of schooling) and health (life expectancy) (1) into one value between 0 and 1 (1).",p:"dev",q:"What is the Human Development Index (HDI)?"},
{t:"ind",k:"Absolute poverty",d:"Not having enough income (1) to afford basic needs such as food, clothing and shelter (1).",q:"Define absolute poverty."},
{t:"ind",k:"Relative poverty",d:"Being poor compared with other people in the same society (1): income is well below the average (1).",q:"Define relative poverty."},
{t:"ind",k:"Birth rate",d:"The number of live births (1) per 1 000 of the population per year (1).",p:"pop",q:"Define birth rate."},
{t:"ind",k:"Death rate",d:"The number of deaths (1) per 1 000 of the population per year (1).",p:"pop",q:"Define death rate."},
{t:"ind",k:"Natural increase",d:"The birth rate (1) minus the death rate (1).",p:"pop",q:"Define the natural increase in population."},
{t:"ind",k:"Net migration",d:"Immigration (people moving in) (1) minus emigration (people moving out) (1).",p:"pop",q:"Define net migration."},
{t:"ind",k:"Dependent population",d:"People who are not in the labour force, the young and the old (1), and who rely on the working population to support them (1).",p:"pop",q:"What is meant by the dependent population?"},
{t:"ind",k:"Optimum population",d:"The size of population that, with the resources available (1), gives the highest output / income per head (1).",p:"pop",q:"Define optimum population."},
{t:"ind",k:"Primary, secondary and tertiary sectors",d:"Primary: extracting natural resources, e.g. mining, fishing, farming. Secondary: manufacturing and construction, e.g. fish canning. Tertiary: services, e.g. banking, tourism, retail.",nq:1},

// ---------- 9. International trade ----------
{t:"int",k:"Exports",d:"Goods and services sold to other countries (1), so money flows into the country (1).",q:"Define exports."},
{t:"int",k:"Imports",d:"Goods and services bought from other countries (1), so money flows out of the country (1).",q:"Define imports."},
{t:"int",k:"Visible and invisible trade",d:"Visible trade: trade in goods, e.g. diamonds, fish, uranium (1). Invisible trade: trade in services, e.g. tourism, banking, transport (1).",p:"bop",q:"Distinguish between visible and invisible trade."},
{t:"int",k:"Balance of trade",d:"The value of visible exports (goods) (1) minus the value of visible imports (goods) (1).",p:"bop",q:"Define the balance of trade."},
{t:"int",k:"Balance of payments",d:"A record of all the money flowing into and out of a country (1) from its trade and financial dealings with the rest of the world in a year (1).",p:"bop",q:"Define the balance of payments."},
{t:"int",k:"Current account",d:"The part of the balance of payments that records trade in goods and trade in services (1), plus income flows and current transfers (1).",p:"bop",q:"What does the current account of the balance of payments record?"},
{t:"int",k:"Free trade",d:"International trade without restrictions (1) such as tariffs and quotas (1).",p:"prot"},
{t:"int",k:"Protectionism",d:"Government measures that restrict imports (1) to protect domestic industries from foreign competition (1).",p:"prot",q:"Define protectionism (trade protection)."},
{t:"int",k:"Tariff",d:"A tax on imported goods (1), which raises their price and makes local goods more competitive (1).",r:"A tariff is an INDIRECT tax (a customs duty).",p:"prot",q:"Define a tariff."},
{t:"int",k:"Quota",d:"A limit on the quantity (or value) of a good that may be imported (1) in a given period of time (1).",p:"prot",q:"Define an import quota."},
{t:"int",k:"Embargo",d:"A complete ban (1) on trade in a certain good or with a certain country (1).",p:"prot",q:"Define an embargo."},
{t:"int",k:"Infant industry",d:"A new industry that is still too small to gain economies of scale (1) and so cannot yet compete with established foreign firms (1).",p:"prot",q:"Define an infant industry."},
{t:"int",k:"Dumping",d:"Selling goods in a foreign market (1) at a price below the cost of production / below the price at home (1).",p:"prot"},
{t:"int",k:"Exchange rate",d:"The price of one currency (1) in terms of another currency (1).",e:"For example N$18 = US$1.",p:"fx",q:"Define an exchange rate."},
{t:"int",k:"Floating exchange rate",d:"An exchange rate that is determined by market forces (1): the demand for and supply of the currency (1).",p:"fx",q:"Define a floating exchange rate."},
{t:"int",k:"Fixed exchange rate",d:"An exchange rate that is set by the government or central bank against another currency (1) and kept at that level (1).",e:"The Namibia dollar is pegged one-to-one to the South African rand.",p:"fx",q:"Define a fixed exchange rate."},
{t:"int",k:"Depreciation",d:"A fall in the value of a currency against other currencies (1) caused by market forces in a floating system (1).",e:"Exports become cheaper, imports dearer.",p:"fx",q:"Define depreciation of a currency."},
{t:"int",k:"Appreciation",d:"A rise in the value of a currency against other currencies (1) caused by market forces in a floating system (1).",p:"fx",q:"Define appreciation of a currency."},
{t:"int",k:"Devaluation",d:"A deliberate decision by the government or central bank (1) to lower the value of a fixed exchange rate (1).",p:"fx",q:"Define devaluation."},
{t:"int",k:"Customs union",d:"A group of countries with free trade between the members (1) and a common external tariff on imports from non-members (1).",e:"SACU: Botswana, Eswatini, Lesotho, Namibia and South Africa.",p:"prot",q:"Define a customs union."},
{t:"int",k:"Comparative advantage",d:"A country can produce a good at a lower opportunity cost (1) than another country (1).",q:"Define comparative advantage."},
{t:"int",k:"Globalisation",d:"The growing integration / interdependence of the world's economies (1) through trade, investment by multinational companies and the movement of people and technology (1)."}
];
var QS = [
// ---------- 1. Basic economic problem ----------
{id:"b1",t:"bep",m:4,p:"oc",q:"State the four factors of production.",a:"Land (1)\nLabour (1)\nCapital (1)\nEnterprise / entrepreneurship (1)",r:"Do not accept “money” for capital."},
{id:"b2",t:"bep",m:4,q:"State the reward (factor payment) earned by each factor of production.",a:"Land: rent (1)\nLabour: wages (1)\nCapital: interest (1)\nEnterprise: profit (1)"},
{id:"b3",t:"bep",m:1,p:"oc",q:"A farmer near Otavi can use a field to grow either maize or mahangu. She chooses maize. Identify her opportunity cost.",a:"The mahangu she could have grown (1).",r:"Do not accept “money” or “the cost of the seed”. Opportunity cost is the next best ALTERNATIVE."},
{id:"b4",t:"bep",m:4,p:"oc",q:"Explain, using an example, why scarcity forces a government to make choices.",a:"Government resources / tax revenue are limited (1) while the wants of citizens are unlimited (1), so it cannot pay for everything and must choose (1). Example: more spending on drought relief means fewer new classrooms; the classrooms are the opportunity cost (1)."},
{id:"b5",t:"bep",m:4,p:"ppc",q:"Explain the effect of a new mineral discovery on a country's production possibility curve.",a:"The PPC shifts outwards / to the right (1) because the quantity of resources (land) has increased (1). The economy can now produce more of both goods (1), which is potential economic growth (1)."},
{id:"b6",t:"bep",m:2,p:"ppc",q:"What does a point inside a production possibility curve show?",a:"Some resources are unemployed / not fully used (1), so the economy is inefficient: it could produce more of both goods (1)."},
{id:"b7",t:"bep",m:2,p:"ppc",q:"State two causes of an outward shift of a production possibility curve.",a:"Any two: more resources, e.g. new mineral discoveries or a larger labour force (1); improved machinery and production methods (1); better education and training of workers (1); more investment in capital goods (1)."},
{id:"b8",t:"bep",m:2,p:"ppc",q:"Explain why a movement along a production possibility curve involves an opportunity cost.",a:"To produce more of one good, resources must be moved away from the other good (1), so less of the other good is produced: that lost output is the opportunity cost (1)."},
{id:"b9",t:"bep",m:4,q:"Classify each resource as land, labour, capital or enterprise:\n(i) hake in the sea off Walvis Bay\n(ii) a fishing trawler\n(iii) a deckhand on the trawler\n(iv) the owner who started the fishing company and risks her savings",a:"(i) land (1)\n(ii) capital (1)\n(iii) labour (1)\n(iv) enterprise (1)"},
{id:"b10",t:"bep",m:4,q:"Distinguish between a free good and an economic good.",a:"A free good is not scarce / is unlimited in supply (1), so it has no opportunity cost, e.g. air (1), WHILE an economic good is scarce / uses scarce resources (1), so it has an opportunity cost and a price, e.g. bread (1).",r:"A free good is not one the government gives away free of charge. Link the two halves with “while”."},
{id:"b11",t:"bep",m:4,q:"Explain two functions of an entrepreneur.",a:"Organises / combines land, labour and capital (1) so that goods and services can be produced (1).\nTakes the risk (1): the money invested may be lost if the business fails (1).\nAlso accept: makes the key decisions about what and how to produce."},

// ---------- 2. Economic systems and market failure ----------
{id:"s1",t:"sys",m:3,q:"State the three basic questions that every economic system must answer.",a:"What to produce? (1)\nHow to produce? (1)\nFor whom to produce? (1)"},
{id:"s2",t:"sys",m:4,q:"Explain two advantages of a market economy.",a:"Any two, 2 marks each:\nConsumer choice (1): firms produce what consumers demand (1).\nCompetition between firms (1) keeps prices low and quality high (1).\nThe profit motive (1) encourages efficiency and new products (1)."},
{id:"s3",t:"sys",m:4,q:"Explain two disadvantages of a market economy.",a:"Any two, 2 marks each:\nPublic goods such as street lighting are not provided (1) because firms cannot charge for them (1).\nMerit goods such as education are under-provided (1) because the poor cannot afford them (1).\nExternal costs such as pollution are ignored (1) because firms consider only their private costs (1).\nIncome is unequally shared (1): people without work or skills earn very little (1)."},
{id:"s4",t:"sys",m:4,q:"Namibia is a mixed economy. Explain what this means, using examples.",a:"It has a private sector (1), e.g. FNB Namibia, Shoprite, privately owned farms (1), AND a public sector (1), e.g. NamPower, NamWater, NBC, state schools (1)."},
{id:"s5",t:"sys",m:2,p:"extc",q:"A uranium mine near Arandis pays wages and buys fuel. Dust from the mine harms the health of people living nearby. Identify one private cost and one external cost.",a:"Private cost: wages / fuel (1).\nExternal cost: harm to the health of nearby residents (1).",r:"The residents are THIRD PARTIES, so their harm is the external cost. Do not label it social cost."},
{id:"s6",t:"sys",m:2,p:"extc",q:"A firm's private costs are N$5 million and its external costs are N$2 million. Calculate the social cost.",a:"N$5 million + N$2 million (1) = N$7 million (1)",r:"Social cost = private cost + external cost."},
{id:"s7",t:"sys",m:2,p:"extc",q:"The social benefit of a vaccination programme is N$12 million and the private benefit is N$9 million. Calculate the external benefit.",a:"N$12 million − N$9 million (1) = N$3 million (1)"},
{id:"s8",t:"sys",m:4,q:"Explain why a government provides public goods such as street lighting.",a:"Street lighting is non-excludable: people who do not pay cannot be stopped from using it (1), so there are free riders (1). A private firm could not charge for it or make a profit, so the market would not provide it (1). The government therefore provides it and pays for it from tax revenue (1)."},
{id:"s9",t:"sys",m:4,p:"extc",q:"Explain two ways a government can reduce the external costs of pollution.",a:"Any two, 2 marks each:\nTax the polluting firm (1): higher costs make it cut output or pollution (1).\nRegulation that limits emissions (1), with fines for firms that break the law (1).\nSubsidise cleaner production methods (1) so that firms can afford to switch (1)."},
{id:"s10",t:"sys",m:7,p:"priv",q:"Discuss whether NamPower should be privatised.",a:"FOR (up to 4):\nA private owner has a profit motive (1), so costs are cut and efficiency improves (1).\nThe government receives revenue from the sale (1) and no longer has to cover losses with taxpayers' money (1).\nAGAINST (up to 4):\nA private monopoly could raise electricity prices (1), which hurts poor households and raises firms' costs (1).\nUnprofitable services such as rural electrification may be cut (1), and jobs may be lost as costs are reduced (1).\nOVERALL: a supported judgement, e.g. only if prices are regulated.",r:"Maximum four if one-sided."},
{id:"s11",t:"sys",m:3,q:"Explain why education is described as a merit good.",a:"It is more beneficial than people realise (1), so if left to the market too little would be bought, especially by the poor (1). It also benefits third parties, e.g. employers gain a more skilled workforce: an external benefit (1)."},
{id:"s12",t:"sys",m:4,p:"extc",q:"Explain why overfishing is an example of market failure.",a:"Each fishing firm considers only its private costs and benefits (1) and catches as much as it can (1). Falling fish stocks are an external cost to other fishermen and to future generations (1), so more fish are caught than is best for society: resources are not allocated efficiently (1)."},
{id:"s13",t:"sys",m:4,p:"priv",q:"State two public sector organisations and two private sector organisations in Namibia.",a:"Public sector, any two: NamPower, NamWater, NBC, TransNamib, Namport (2).\nPrivate sector, any two: FNB Namibia, Bank Windhoek, Shoprite, Pupkewitz, a sole trader (2).",r:"A public limited company is PRIVATE sector."},
{id:"s14",t:"sys",m:4,q:"Distinguish between a public good and a merit good.",a:"A public good is non-excludable and non-rival (1), so the market does not provide it at all, e.g. street lighting (1), WHILE a merit good can be sold by firms (1) but is under-consumed because people underestimate its benefits, e.g. education (1)."},
{id:"s15",t:"sys",m:4,q:"Explain one advantage and one disadvantage of a planned economy.",a:"Advantage: the government can make sure basic goods and services are provided for everyone (1), so income is more equally shared (1).\nDisadvantage: there is no profit motive or competition (1), so firms are inefficient and consumers have little choice (1)."},

// ---------- 3. Demand, supply and elasticity ----------
{id:"d1",t:"dse",m:4,p:"sd",q:"State four factors that can cause the demand curve for a product to shift.",a:"Any four: income (1); price of substitutes (1); price of complements (1); tastes and fashion (1); advertising (1); population size (1); expected future prices (1).",r:"Do NOT accept “price of the product”. A change in its own price is a movement along the curve."},
{id:"d2",t:"dse",m:4,p:"sd",q:"State four factors that can cause the supply curve for a product to shift.",a:"Any four: costs of production, e.g. wages, raw materials (1); improved production methods / new machinery (1); indirect taxes (1); subsidies (1); weather (1); number of firms (1); prices of other goods the firm could make (1).",r:"Do NOT accept “price of the product”. A change in its own price is a movement along the curve."},
{id:"d3",t:"dse",m:3,p:"ped",q:"The price of bread rises from N$10 to N$12 and the quantity demanded falls from 500 to 450 loaves a day. Calculate the price elasticity of demand.",a:"% change in quantity demanded = −50 ÷ 500 × 100 = −10% (1)\n% change in price = 2 ÷ 10 × 100 = 20% (1)\nPED = −10 ÷ 20 = −0.5 (accept 0.5) (1)",r:"Quantity goes on TOP. Price ÷ quantity scores 0 for the last mark."},
{id:"d4",t:"dse",m:4,p:"ped",q:"The price of a taxi ride falls from N$20 to N$15 and the number of rides demanded rises from 100 to 150. Calculate the PED and state whether demand is elastic or inelastic.",a:"% change in quantity = 50 ÷ 100 × 100 = 50% (1)\n% change in price = −5 ÷ 20 × 100 = −25% (1)\nPED = 50 ÷ −25 = −2 (accept 2) (1)\nDemand is price elastic because PED is greater than 1 (1)"},
{id:"d5",t:"dse",m:3,p:"ped",q:"State three factors that influence the price elasticity of demand for a product.",a:"Any three: number of substitutes (1); necessity or luxury (1); proportion of income spent on it (1); time period (1); whether it is habit-forming (1)."},
{id:"d6",t:"dse",m:4,p:"ped",q:"Explain why the demand for electricity supplied by Erongo RED is price inelastic.",a:"Electricity is a necessity (1) with few close substitutes for lighting and appliances (1), so when the price rises households still have to buy almost the same amount (1): quantity demanded falls by a smaller percentage than the price rises (1)."},
{id:"d7",t:"dse",m:3,p:"ped",q:"The PED for a firm's product is 0.4. Explain what happens to total revenue if the firm raises its price.",a:"Demand is price inelastic (1), so quantity demanded falls by a smaller percentage than the price rises (1), and total revenue rises (1)."},
{id:"d8",t:"dse",m:6,p:"sd",q:"Explain, with the aid of a diagram, the effect of a government subsidy to mahangu farmers on the market for mahangu.",a:"Diagram (up to 3): axes labelled price and quantity, with D, S1 and the original equilibrium (1); supply curve shifted to the right, S1 to S2 (1); new equilibrium showing a lower price and a higher quantity (1).\nExplanation (up to 3): the subsidy lowers farmers' costs of production (1), so supply increases (1); price falls and quantity rises (1).",r:"Marks are lost for unlabelled axes or curves. Supply moves, not demand."},
{id:"d9",t:"dse",m:6,p:"sd",q:"Explain, with the aid of a diagram, the effect of a successful advertising campaign for Namibian beef on the market for beef.",a:"Diagram (up to 3): axes labelled price and quantity, with D1, S and the original equilibrium (1); demand curve shifted to the right, D1 to D2 (1); new equilibrium showing a higher price and a higher quantity (1).\nExplanation (up to 3): advertising changes tastes in favour of beef (1), so demand increases at every price (1); price rises and quantity rises (1)."},
{id:"d10",t:"dse",m:3,p:"sd",q:"The price of petrol rises. Explain the effect on the demand for cars.",a:"Petrol and cars are complements (1). Running a car becomes more expensive (1), so the demand for cars falls: the demand curve shifts to the left (1)."},
{id:"d11",t:"dse",m:4,p:"sd",q:"The price of chicken rises. Explain the effect on the market for beef.",a:"Chicken and beef are substitutes (1). Consumers switch from chicken to beef (1), so the demand curve for beef shifts to the right (1); the price and the quantity of beef both rise (1)."},
{id:"d12",t:"dse",m:4,p:"sd",q:"Explain the difference between a movement along a demand curve and a shift of a demand curve.",a:"A movement along the curve is caused by a change in the good's own price (1) and is called an extension or contraction of demand (1), WHILE a shift is caused by a non-price factor such as income or tastes (1), so more or less is demanded at every price and a new curve is drawn (1).",r:"Price changes = movement along. Anything else = shift."},
{id:"d13",t:"dse",m:4,p:"pcon",q:"The government sets a maximum price for maize meal below the equilibrium price. Explain the likely effects.",a:"At the lower price quantity demanded rises (1) and quantity supplied falls (1), so there is a shortage / excess demand (1). This can lead to queues, rationing or a black market (1)."},
{id:"d14",t:"dse",m:4,p:"pcon",q:"A minimum price is set above the equilibrium price for a farm product. Explain the likely effects.",a:"At the higher price quantity supplied rises (1) and quantity demanded falls (1), so there is a surplus / excess supply (1). The government may have to buy and store the unsold output (1)."},
{id:"d15",t:"dse",m:3,p:"sd",q:"A drought reduces the maize harvest. Explain the effect on the price and quantity of maize.",a:"Supply decreases: the supply curve shifts to the left (1). The equilibrium price rises (1) and the equilibrium quantity falls (1)."},
{id:"d16",t:"dse",m:3,q:"Explain how the price mechanism removes a surplus in a market.",a:"A surplus means the price is above the equilibrium (1). Sellers cut the price to get rid of unsold stock (1); quantity demanded extends and quantity supplied contracts until the two are equal (1)."},
{id:"d17",t:"dse",m:4,p:"sd",q:"Explain the effect of an increase in an indirect tax on the market for fizzy drinks.",a:"The tax raises the cost of supplying each unit (1), so the supply curve shifts to the left (1). The price rises (1) and the quantity bought and sold falls (1)."},
{id:"d18",t:"dse",m:3,q:"Explain why the supply of farm products is price inelastic in the short run.",a:"Crops take time to grow (1), so when the price rises farmers cannot increase output quickly (1); quantity supplied changes by a smaller percentage than price (1)."},
{id:"d19",t:"dse",m:3,q:"The price of fish rises from N$40 to N$50 a kilogram and the quantity supplied rises from 1 000 kg to 1 100 kg. Calculate the price elasticity of supply.",a:"% change in quantity supplied = 100 ÷ 1 000 × 100 = 10% (1)\n% change in price = 10 ÷ 40 × 100 = 25% (1)\nPES = 10 ÷ 25 = 0.4 (1)"},
{id:"d20",t:"dse",m:4,p:"sd",q:"Incomes in Windhoek rise. Explain the effect on the demand for (i) restaurant meals and (ii) second-hand clothes.",a:"(i) Restaurant meals are a normal good (1), so demand rises: the curve shifts right (1).\n(ii) Second-hand clothes are an inferior good (1), so demand falls: the curve shifts left (1)."},

// ---------- 4. Money and banking ----------
{id:"m1",t:"mon",m:4,p:"money",q:"State the four functions of money.",a:"Medium of exchange (1)\nMeasure of value / unit of account (1)\nStore of value (1)\nStandard for deferred payment (1)",r:"NO need to explain the qualities of money. Durable, portable and divisible are qualities and score 0 here."},
{id:"m2",t:"mon",m:4,q:"State four qualities of good money.",a:"Any four: acceptable (1); durable (1); portable (1); divisible (1); scarce / limited in supply (1); uniform / hard to forge (1).",r:"This time the question IS about qualities. Do not write the functions."},
{id:"m3",t:"mon",m:4,q:"Explain two disadvantages of barter.",a:"Any two, 2 marks each:\nIt needs a double coincidence of wants (1), so finding someone to trade with takes a long time (1).\nThere is no common measure of value (1), so it is hard to agree how much one good is worth in terms of another (1).\nMany goods cannot be divided (1), e.g. a cow cannot be split to buy something small (1).\nGoods are hard to store as wealth (1) because they rot or lose value (1)."},
{id:"m4",t:"mon",m:4,p:"money",q:"State four functions of a central bank such as the Bank of Namibia.",a:"Any four: issues notes and coins (1); banker to the government (1); banker to the commercial banks / lender of last resort (1); carries out monetary policy / sets the repo rate (1); manages the foreign exchange reserves (1); supervises the commercial banks (1)."},
{id:"m5",t:"mon",m:4,p:"money",q:"State four services that a commercial bank such as FNB Namibia provides to its customers.",a:"Any four: accepts deposits / keeps money safe (1); gives loans and overdrafts (1); provides ways to pay, e.g. debit cards, EFT, cellphone banking (1); exchanges foreign currency (1); gives financial advice (1)."},
{id:"m6",t:"mon",m:4,p:"money",q:"Distinguish between a commercial bank and a central bank.",a:"A commercial bank deals with the public and firms (1) and aims to make a profit, e.g. FNB Namibia (1), WHILE a central bank deals with the government and the commercial banks (1) and aims to keep prices and the banking system stable, e.g. the Bank of Namibia (1)."},
{id:"m7",t:"mon",m:4,p:"policy",q:"Explain how a rise in interest rates affects consumer spending.",a:"Borrowing becomes more expensive (1), so fewer people take loans to buy cars or furniture on credit (1). Saving earns a higher reward (1), so households save more and spend less (1).\nAlso accept: repayments on existing loans rise, leaving less to spend."},
{id:"m8",t:"mon",m:3,q:"State three reasons why people save.",a:"Any three: to buy an expensive item later, e.g. a car or a deposit on a house (1); for emergencies (1); for retirement (1); to earn interest (1); for children's education (1)."},
{id:"m9",t:"mon",m:4,p:"nsx",q:"Explain two functions of a stock exchange.",a:"It lets public limited companies raise capital (1) by issuing new shares to the public (1).\nIt provides a market for second-hand shares (1), so shareholders can sell and get their money back when they need it (1)."},
{id:"m10",t:"mon",m:2,p:"infl",q:"Explain why inflation makes money a poor store of value.",a:"Rising prices reduce the purchasing power of money (1), so money that has been saved buys fewer goods in the future (1)."},
{id:"m11",t:"mon",m:4,q:"Explain two reasons why a firm might borrow from a commercial bank.",a:"To buy capital goods such as machinery or vehicles (1) so that it can expand output (1).\nTo cover day-to-day costs such as wages and stock (1) while waiting for customers to pay (1)."},
{id:"m12",t:"mon",m:4,p:"money",q:"Explain how money acts as (i) a medium of exchange and (ii) a measure of value.",a:"(i) Money is accepted in payment for goods and services (1), so there is no need to barter (1).\n(ii) Money lets the prices of different goods be stated and compared (1) in one unit, the Namibia dollar (1).",r:"Paying = medium of exchange. Comparing prices = measure of value."},
{id:"m13",t:"mon",m:2,q:"State two reasons why people with higher incomes usually save a larger share of their income.",a:"They can already afford all their needs (1), so they have income left over after spending (1)."},

// ---------- 5. Labour, wages and trade unions ----------
{id:"l1",t:"lab",m:4,q:"State four non-wage factors that influence a person's choice of occupation.",a:"Any four: job security (1); working hours (1); holidays (1); promotion prospects (1); job satisfaction (1); working conditions (1); fringe benefits, e.g. medical aid or a housing allowance (1); distance from home (1)."},
{id:"l2",t:"lab",m:4,q:"Explain two reasons why doctors earn more than cleaners.",a:"Doctors need long and expensive training (1), so the supply of doctors is low (1).\nTheir skills are in high demand and hard to replace (1), so employers must pay more to attract them (1)."},
{id:"l3",t:"lab",m:4,p:"dol",q:"Explain two advantages of the division of labour to a firm.",a:"Any two, 2 marks each:\nWorkers repeat one task and become faster and more skilled (1), so output per worker rises (1).\nNo time is wasted moving between tasks (1), so average cost falls (1).\nEach worker needs only a few tools and a short training (1), which lowers costs (1).",r:"Repeated points score once: “higher productivity” and “more output per worker” are the same point."},
{id:"l4",t:"lab",m:4,p:"dol",q:"Explain two disadvantages of the division of labour to workers.",a:"Doing the same task all day is boring (1), so job satisfaction is low (1).\nWorkers have only narrow skills (1), so they may struggle to find other work if machines replace them (1)."},
{id:"l5",t:"lab",m:4,p:"tu",q:"State four functions of a trade union.",a:"Any four: negotiates higher wages (1); improves working conditions and hours (1); protects jobs (1); represents members in disputes with the employer (1); improves health and safety (1); gives legal advice or training (1)."},
{id:"l6",t:"lab",m:7,p:"pcon",q:"Discuss whether a national minimum wage benefits workers.",a:"FOR (up to 4):\nLow-paid workers earn more (1), so their standard of living rises and poverty falls (1).\nIt stops employers exploiting workers (1), and better pay can motivate workers to be more productive (1).\nAGAINST (up to 4):\nLabour costs rise (1), so firms may employ fewer workers: unemployment (1).\nFirms may raise prices to cover the cost (1), so the real wage rises less, and workers in the informal sector are not covered (1).\nOVERALL: a supported judgement, e.g. it helps those who keep their jobs.",r:"Maximum four if one-sided."},
{id:"l7",t:"lab",m:4,p:"tu",q:"Explain two factors that affect the bargaining strength of a trade union.",a:"Any two, 2 marks each:\nThe share of the workforce who are members (1): a strike by most workers stops production (1).\nThe skills of the members (1): skilled workers are hard to replace (1).\nThe level of unemployment (1): when it is high, employers can find other workers easily (1)."},
{id:"l8",t:"lab",m:4,p:"mob",q:"Distinguish between occupational mobility and geographical mobility of labour.",a:"Occupational mobility is the ability to move from one job to another (1), e.g. a teacher retrains as an accountant (1), WHILE geographical mobility is the ability to move from one area to another to work (1), e.g. from Rundu to Walvis Bay (1).",r:"Job = occupational. Place = geographical. Link the two halves with “while”."},
{id:"l9",t:"lab",m:2,p:"mob",q:"State two causes of geographical immobility of labour.",a:"Any two: family ties (1); high cost or shortage of housing in the new area (1); cost of moving (1); children's schooling (1); lack of information about jobs elsewhere (1)."},
{id:"l10",t:"lab",m:2,p:"mob",q:"State two causes of occupational immobility of labour.",a:"Any two: lack of skills or qualifications (1); long or expensive training (1); age (1); discrimination (1)."},
