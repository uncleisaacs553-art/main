{id:"l11",t:"lab",m:2,p:"tu",q:"State two types of industrial action other than a strike.",a:"Any two: go-slow (1); work-to-rule (1); overtime ban (1); picketing (1)."},
{id:"l12",t:"lab",m:4,q:"Explain two reasons why a worker might choose a lower-paid job.",a:"Any two, 2 marks each:\nBetter job security (1), e.g. the job is less likely to be lost (1).\nShorter hours or longer holidays (1), giving more time with family (1).\nThe job is closer to home (1), so travel costs and travel time are lower (1).\nMore job satisfaction (1), e.g. nursing or teaching (1)."},
{id:"l13",t:"lab",m:5,p:"dol",q:"Analyse how specialisation can benefit a country.",a:"The country concentrates on what it produces best, e.g. Namibia on diamonds, uranium, fish and beef (1), which means resources are used more efficiently and output is higher (1). Larger output brings economies of scale, which means lower average costs (1). The surplus is exported, which earns foreign currency (1) that pays for imports the country cannot make cheaply, so living standards rise (1).",r:"Analyse = chains of “which means”. The other side is not needed."},

// ---------- 6. Firms, costs and market structure ----------
{id:"f1",t:"frm",m:4,p:"biz",q:"Explain two advantages of being a sole trader.",a:"The owner makes all the decisions (1), so decisions are quick (1).\nThe owner keeps all the profit (1), which is an incentive to work hard (1).\nAlso accept: easy and cheap to set up."},
{id:"f2",t:"frm",m:4,p:"biz",q:"Explain two advantages of a public limited company.",a:"It can raise large amounts of capital (1) by selling shares to the public on the stock exchange (1).\nShareholders have limited liability (1), so people are more willing to invest (1)."},
{id:"f3",t:"frm",m:4,p:"cost",q:"A bakery has fixed costs of N$10 000 a month and variable costs of N$5 per loaf. It bakes 2 000 loaves a month. Calculate (i) total cost and (ii) average cost.",a:"(i) Variable cost = N$5 × 2 000 = N$10 000 (1); total cost = N$10 000 + N$10 000 = N$20 000 (1)\n(ii) Average cost = N$20 000 ÷ 2 000 (1) = N$10 per loaf (1)"},
{id:"f4",t:"frm",m:2,p:"cost",q:"A bakery has fixed costs of N$10 000 a month and bakes 2 000 loaves. Calculate the average fixed cost.",a:"N$10 000 ÷ 2 000 (1) = N$5 per loaf (1)",r:"Divide the FIXED cost only."},
{id:"f5",t:"frm",m:5,p:"cost",q:"A firm sells 400 units at N$15 each. Its total cost is N$4 500. Calculate (i) total revenue, (ii) average revenue and (iii) profit.",a:"(i) N$15 × 400 (1) = N$6 000 (1)\n(ii) N$6 000 ÷ 400 = N$15, the same as the price (1)\n(iii) N$6 000 − N$4 500 (1) = N$1 500 (1)",r:"Average revenue = TR ÷ quantity. It always equals the price per unit."},
{id:"f6",t:"frm",m:4,p:"cost",q:"State two fixed costs and two variable costs of a bakery.",a:"Fixed, any two: rent (1); insurance (1); interest on loans (1); the manager's salary (1).\nVariable, any two: flour and other ingredients (1); packaging (1); electricity for the ovens (1); wages of hourly paid bakers (1)."},
{id:"f7",t:"frm",m:2,p:"cost",q:"Explain what happens to average fixed cost as output rises.",a:"It falls (1) because the same total fixed cost is spread over more units of output (1)."},
{id:"f8",t:"frm",m:4,p:"eos",q:"State four internal economies of scale.",a:"Any four: bulk-buying / purchasing (1); financial (1); managerial (1); technical (1); risk-bearing (1); marketing (1)."},
{id:"f9",t:"frm",m:4,p:"eos",q:"Explain two internal economies of scale that a large supermarket chain may enjoy.",a:"Any two, 2 marks each:\nBulk buying (1): suppliers give discounts on large orders, so the cost of each item falls (1).\nFinancial (1): banks see a large firm as a safer borrower and charge it a lower rate of interest (1).\nManagerial (1): it can afford specialist managers, e.g. buyers and accountants, who work more efficiently (1)."},
{id:"f10",t:"frm",m:1,p:"eos",q:"A large firm sells many different products in many different markets. Identify the economy of scale it gains.",a:"Risk-bearing economies (1).",r:"Not technical economies. A wide product range spreads RISK."},
{id:"f11",t:"frm",m:4,p:"eos",q:"Explain two external economies of scale available to fishing firms in Walvis Bay.",a:"Any two, 2 marks each:\nShared infrastructure (1): the port, cold storage and roads built for the industry lower every firm's transport costs (1).\nA pool of skilled labour (1): trained crews and fish processors live in the town, so firms spend less on training (1).\nSupport firms nearby (1): net makers, ship repairers and packaging suppliers cut delays and costs (1).",r:"External = the WHOLE INDUSTRY benefits. Bulk buying by one firm is internal and scores 0."},
{id:"f12",t:"frm",m:3,p:"eos",q:"State three diseconomies of scale.",a:"Any three: poor communication (1); slower decision-making / harder to co-ordinate (1); low worker morale (1); poor industrial relations (1).",r:"Repeated points score once: “low morale” and “workers feel unimportant” are one point."},
{id:"f13",t:"frm",m:3,p:"mono",q:"State three barriers to entry.",a:"Any three: patents / legal protection (1); high start-up costs (1); control of raw materials (1); economies of scale of the existing firm (1); strong brand loyalty (1)."},
{id:"f14",t:"frm",m:4,p:"mono",q:"State four features of a monopoly.",a:"Any four: a single seller (1); price maker (1); barriers to entry (1); no close substitutes (1); can keep high profits in the long run (1).",r:"Price MAKER. Writing “price taker” scores 0."},
{id:"f15",t:"frm",m:4,p:"mono",q:"State four features of perfect competition.",a:"Any four: many buyers and sellers (1); identical products (1); firms are price takers (1); no barriers to entry or exit (1); buyers and sellers have full information (1)."},
{id:"f16",t:"frm",m:7,p:"mono",q:"Discuss whether monopolies are harmful to consumers.",a:"HARMFUL (up to 4):\nA monopoly is a price maker (1), so it can charge higher prices than competing firms would (1).\nWith no competition there is less choice (1) and less pressure to keep quality high (1).\nNOT HARMFUL (up to 4):\nIts large size gives economies of scale (1), so lower costs may be passed on as lower prices (1).\nHigh profits can pay for research and better products (1), and a natural monopoly such as NamWater's pipelines avoids wasteful duplication (1).\nOVERALL: a supported judgement, e.g. it depends on whether the government regulates the price.",r:"Maximum four if one-sided."},
{id:"f17",t:"frm",m:4,q:"Explain two reasons why small firms survive.",a:"Any two, 2 marks each:\nThey give personal service (1), e.g. a hairdresser or tailor whose customers stay loyal (1).\nThe market is small or local (1), so there is not enough demand for a large firm (1).\nThe owner wants to stay in control (1) and chooses not to grow (1)."},
{id:"f18",t:"frm",m:4,p:"integ",q:"Distinguish between horizontal and vertical integration.",a:"Horizontal integration joins firms at the same stage of production (1), e.g. two fish-canning factories (1), WHILE vertical integration joins firms at different stages of production (1), e.g. a canning factory and a fishing fleet (1)."},
{id:"f19",t:"frm",m:3,p:"integ",q:"A fish-canning factory takes over the fishing fleet that supplies it. Identify the type of integration and give one benefit to the factory.",a:"Vertical (1) backward (1) integration.\nBenefit: a secure supply of fish / control over the cost and quality of its raw material (1)."},
{id:"f20",t:"frm",m:2,q:"State two aims of firms other than maximising profit.",a:"Any two: growth (1); survival (1); maximising sales revenue (1); a larger market share (1); social or environmental responsibility (1)."},
{id:"f21",t:"frm",m:4,q:"Explain two benefits to Namibia of a multinational company opening a mine in the country.",a:"Any two, 2 marks each:\nJobs are created (1), so incomes rise and unemployment falls (1).\nThe company pays tax and royalties (1), giving the government more revenue for public services (1).\nIt brings capital and skills (1), and local workers are trained (1).\nMinerals are exported (1), which earns foreign currency (1)."},
{id:"f22",t:"frm",m:4,q:"Explain two disadvantages to a country of hosting multinational companies.",a:"Profits are sent back to the home country (1), so less money stays in the local economy (1).\nNatural resources may be used up or the environment damaged (1), which is an external cost to local people (1).\nAlso accept: local firms cannot compete; the company may leave and cause unemployment."},

// ---------- 7. Government and policy ----------
{id:"g1",t:"gov",m:4,p:"policy",q:"State four macroeconomic aims of a government.",a:"Any four: economic growth (1); low unemployment / full employment (1); price stability / low inflation (1); balance of payments stability (1); fairer distribution of income (1)."},
{id:"g2",t:"gov",m:3,p:"unemp",q:"Explain how an increase in government spending can reduce unemployment.",a:"More government spending raises total (aggregate) demand (1). Firms increase output to meet the extra demand (1), so they employ more workers (1)."},
{id:"g3",t:"gov",m:4,p:"policy",q:"A government increases its spending to reduce unemployment. Explain how this may conflict with another government aim.",a:"Higher spending raises total (aggregate) demand (1). If demand grows faster than the economy can supply (1), prices are pulled up: demand-pull inflation (1). This conflicts with the aim of price stability (1).\nAlso accept: higher incomes pull in more imports, which worsens the current account.",r:"Do not write “unemployment falls” as the conflict. That is the goal. The conflict is INFLATION."},
{id:"g4",t:"gov",m:4,p:"tax",q:"Distinguish between direct and indirect taxes, giving one example of each.",a:"A direct tax is charged on income or wealth and paid straight to the government (1), e.g. income tax (1), WHILE an indirect tax is charged on spending on goods and services and can be passed on to consumers (1), e.g. VAT (1)."},
{id:"g5",t:"gov",m:4,p:"tax",q:"Classify each tax as direct or indirect:\n(i) income tax\n(ii) VAT\n(iii) company tax\n(iv) a tariff on imported cars",a:"(i) direct (1)\n(ii) indirect (1)\n(iii) direct (1)\n(iv) indirect (1)",r:"Tariffs are INDIRECT taxes."},
{id:"g6",t:"gov",m:3,p:"tax",q:"Ms Shikongo earns N$100 000 and pays N$10 000 in tax. Mr Beukes earns N$400 000 and pays N$40 000. Identify the type of tax and explain your answer.",a:"Proportional (1). Both pay 10% of their income (1): the same percentage is taken at every level of income (1).",r:"He pays a larger AMOUNT, but the PERCENTAGE is the same, so it is not progressive."},
{id:"g7",t:"gov",m:3,p:"tax",q:"Ms Shikongo earns N$100 000 and pays N$10 000 in tax. Mr Beukes earns N$400 000 and pays N$100 000. Identify the type of tax and explain your answer.",a:"Progressive (1). She pays 10% and he pays 25% (1): the percentage taken rises as income rises (1)."},
{id:"g8",t:"gov",m:3,p:"tax",q:"Explain why VAT is described as a regressive tax.",a:"Everyone pays the same rate of VAT on a product (1), but that amount is a bigger percentage of a poor person's income (1), because the poor spend a larger share of their income (1)."},
{id:"g9",t:"gov",m:4,p:"tax",q:"State four reasons why governments levy taxes.",a:"Any four: to raise revenue for public spending (1); to redistribute income (1); to discourage demerit goods such as cigarettes (1); to protect local industries from imports (1); to reduce total demand and control inflation (1)."},
{id:"g10",t:"gov",m:3,p:"tax",q:"State three qualities of a good tax.",a:"Any three: equitable / based on ability to pay (1); certain (1); convenient to pay (1); economical / cheap to collect (1)."},
{id:"g11",t:"gov",m:4,p:"policy",q:"Explain how the Bank of Namibia could use monetary policy to reduce inflation.",a:"It raises the repo rate (1), so commercial banks raise the interest rates they charge (1). Borrowing and spending fall while saving rises (1), so total demand falls and demand-pull inflation is reduced (1)."},
{id:"g12",t:"gov",m:4,p:"unemp",q:"Explain two supply-side policies that could reduce unemployment.",a:"Any two, 2 marks each:\nMore spending on education and training (1) gives workers the skills that employers need (1).\nLower income tax (1) increases the incentive to work (1).\nSupport or subsidies for small businesses (1) help new firms to start up and hire workers (1)."},
{id:"g13",t:"gov",m:7,p:"tax",q:"Discuss whether a government should raise income tax to reduce a budget deficit.",a:"FOR (up to 4):\nTax revenue rises (1), so the gap between spending and revenue narrows and less borrowing is needed (1).\nIncome tax is progressive (1), so those most able to pay carry most of the burden (1).\nAGAINST (up to 4):\nDisposable income falls (1), so consumer spending and total demand fall, which can raise unemployment (1).\nHigher tax weakens the incentive to work (1), and skilled workers may leave the country, so revenue may rise less than expected (1).\nOVERALL: a supported judgement, e.g. cutting wasteful spending may be less harmful.",r:"Maximum four if one-sided."},
{id:"g14",t:"gov",m:4,q:"Explain two ways a government can redistribute income from rich to poor.",a:"Any two, 2 marks each:\nProgressive income tax (1) takes a higher percentage from high earners (1).\nTransfer payments such as the old-age pension (1) raise the income of the poor (1).\nFree or subsidised education and health care (1) give the poor services they could not afford (1)."},
{id:"g15",t:"gov",m:4,q:"State two examples of government capital expenditure and two examples of current expenditure.",a:"Capital, any two: building roads (1); schools (1); clinics and hospitals (1); dams (1).\nCurrent, any two: salaries of teachers and nurses (1); medicines (1); old-age pensions (1); fuel for police vehicles (1)."},
{id:"g16",t:"gov",m:5,p:"policy",q:"Analyse how a cut in interest rates might increase economic growth.",a:"Lower interest rates make borrowing cheaper (1), which means consumers buy more on credit (1). Firms borrow to invest in new machinery, which means productive capacity rises (1). Saving is less rewarding, which means more income is spent (1). Higher total demand makes firms raise output, so real GDP grows (1).",r:"Analyse = a chain. Each “which means” link earns the next mark."},
{id:"g17",t:"gov",m:4,p:"infl",q:"Explain two ways fiscal policy can be used to reduce inflation.",a:"Raise taxes (1), so households have less disposable income and spend less (1).\nCut government spending (1), so total demand falls and prices rise more slowly (1)."},

// ---------- 8. Indicators and development ----------
{id:"i1",t:"ind",m:4,p:"infl",q:"Distinguish between demand-pull inflation and cost-push inflation.",a:"Demand-pull inflation is caused by total demand rising faster than supply (1), e.g. after a tax cut or a rise in government spending (1), WHILE cost-push inflation is caused by rising costs of production (1), e.g. higher wages or dearer imported fuel, which firms pass on in prices (1)."},
{id:"i2",t:"ind",m:4,p:"infl",q:"Explain two effects of inflation on households.",a:"Any two, 2 marks each:\nPeople on fixed incomes, e.g. pensioners, can buy less (1) because their purchasing power falls (1).\nThe real value of savings falls (1) if the interest rate is lower than the inflation rate (1).\nBorrowers gain (1) because the real value of what they owe falls (1)."},
{id:"i3",t:"ind",m:2,p:"infl",q:"The consumer price index rises from 120 to 126 in a year. Calculate the rate of inflation.",a:"(126 − 120) ÷ 120 × 100 (1) = 5% (1)"},
{id:"i4",t:"ind",m:2,p:"infl",q:"Money wages rise by 4% in a year in which inflation is 6%. State what happens to real wages.",a:"Real wages fall (1) by about 2%, because prices rise faster than wages (1)."},
{id:"i5",t:"ind",m:4,p:"unemp",q:"State four types of unemployment.",a:"Frictional (1)\nStructural (1)\nCyclical / demand-deficient (1)\nSeasonal (1)"},
{id:"i6",t:"ind",m:4,p:"unemp",q:"Identify the type of unemployment in each case:\n(i) lodge workers laid off after the tourist season\n(ii) miners who lose their jobs when a mine closes for good\n(iii) a graduate looking for a first job\n(iv) workers laid off during a recession",a:"(i) seasonal (1)\n(ii) structural (1)\n(iii) frictional (1)\n(iv) cyclical (1)"},
{id:"i7",t:"ind",m:4,p:"unemp",q:"Explain two consequences of high unemployment for a government.",a:"Tax revenue falls (1) because fewer people earn and spend (1).\nSpending on grants and support rises (1), so less is left for schools and clinics: an opportunity cost (1).\nAlso accept: more crime and social problems to deal with.",r:"Repeated points score once: “less income tax” and “lower tax revenue” are one point."},
{id:"i8",t:"ind",m:2,p:"unemp",q:"A country has a labour force of 1 000 000 people, of whom 330 000 are unemployed. Calculate the unemployment rate.",a:"330 000 ÷ 1 000 000 × 100 (1) = 33% (1)"},
{id:"i9",t:"ind",m:2,p:"dev",q:"A country's GDP is N$200 billion and its population is 2.5 million. Calculate GDP per capita.",a:"N$200 000 000 000 ÷ 2 500 000 (1) = N$80 000 (1)"},
{id:"i10",t:"ind",m:2,p:"dev",q:"A country's GDP is N$200 billion and its net income from abroad is −N$5 billion. Calculate GNP.",a:"N$200 billion − N$5 billion (1) = N$195 billion (1)",r:"GNP = GDP + net income from abroad. Here the net income is negative, so GNP is smaller than GDP."},
{id:"i11",t:"ind",m:4,p:"dev",q:"Explain two reasons why GDP per capita may be a poor measure of living standards.",a:"Any two, 2 marks each:\nIt is an average (1): it does not show how unequally income is shared (1).\nIt leaves out the informal sector and subsistence farming (1), so output is under-counted (1).\nIt ignores external costs such as pollution (1), which lower the quality of life (1)."},
{id:"i12",t:"ind",m:4,p:"dev",q:"State four characteristics of a developing country.",a:"Any four: low GDP per capita (1); high birth rate / fast population growth (1); large share of workers in the primary sector (1); low life expectancy (1); low literacy rate (1); poor infrastructure (1)."},
{id:"i13",t:"ind",m:4,p:"pop",q:"Explain two reasons why birth rates are high in many developing countries.",a:"Any two, 2 marks each:\nChildren help on the farm and support their parents in old age (1) because there is little or no state pension (1).\nThere is little access to family planning or education about it (1), so families are larger (1).\nInfant mortality is high (1), so parents have more children in case some do not survive (1)."},
{id:"i14",t:"ind",m:4,p:"pop",q:"Explain two problems caused by rapid population growth.",a:"Any two, 2 marks each:\nMore pressure on schools, clinics and housing (1), so the government must spend more or quality falls (1).\nMore people look for work than there are jobs (1), so unemployment rises (1).\nOutput is shared among more people (1), so GDP per capita may fall (1)."},
{id:"i15",t:"ind",m:7,p:"dev",q:"Discuss whether economic growth always improves living standards.",a:"IMPROVES (up to 4):\nHigher output means higher incomes and more jobs (1), so people can afford more goods and services (1).\nTax revenue rises (1), so the government can spend more on education and health (1).\nDOES NOT ALWAYS (up to 4):\nGrowth can bring external costs such as pollution and the loss of natural resources (1), which lower the quality of life (1).\nThe extra income may go mainly to the rich (1), so inequality widens and the poor are no better off (1).\nOVERALL: a supported judgement, e.g. it depends on how the gains are shared.",r:"Maximum four if one-sided."},
{id:"i16",t:"ind",m:3,p:"dev",q:"State the three parts of the Human Development Index.",a:"Income per head (1)\nEducation / years of schooling (1)\nHealth / life expectancy (1)"},
{id:"i17",t:"ind",m:4,q:"Distinguish between absolute poverty and relative poverty.",a:"Absolute poverty means not being able to afford basic needs (1) such as food, clothing and shelter (1), WHILE relative poverty means being poor compared with others in the same country (1): income is well below the average (1)."},
{id:"i18",t:"ind",m:4,q:"Explain two policies a government could use to reduce poverty.",a:"Any two, 2 marks each:\nTransfer payments such as old-age pensions and child grants (1) raise the incomes of the poorest (1).\nFree education and training (1) give people the skills to earn more (1).\nCreating jobs through public works (1) gives the unemployed an income (1)."},
{id:"i19",t:"ind",m:3,q:"Explain how the pattern of employment changes as a country develops.",a:"The share of workers in the primary sector falls (1). The secondary sector grows as manufacturing expands (1). Later the tertiary (services) sector becomes the largest employer (1)."},
{id:"i20",t:"ind",m:2,p:"pop",q:"State two reasons why death rates fall as a country develops.",a:"Any two: better health care (1); better nutrition (1); clean water and sanitation (1); better education about health (1)."},

// ---------- 9. International trade ----------
{id:"x1",t:"int",m:4,p:"prot",q:"State four methods of trade protection.",a:"Any four: tariffs (1); quotas (1); embargoes (1); subsidies to local producers (1); exchange controls (1); strict product standards (1)."},
{id:"x2",t:"int",m:3,p:"prot",q:"Explain how a tariff protects domestic producers.",a:"A tariff is a tax on imports (1), so imported goods become more expensive (1) and consumers switch to locally made goods (1)."},
{id:"x3",t:"int",m:2,p:"tax",q:"State whether a tariff is a direct or an indirect tax, and give a reason.",a:"Indirect (1), because it is a tax on spending on imported goods and can be passed on to consumers in higher prices (1).",r:"Tariffs are INDIRECT taxes."},
{id:"x4",t:"int",m:4,p:"prot",q:"Explain two reasons why a government may protect its industries from imports.",a:"Any two, 2 marks each:\nTo protect infant industries (1) until they are large enough to compete (1).\nTo protect jobs (1) in industries that would shrink because of cheap imports (1).\nTo stop dumping (1), where foreign firms sell below cost to destroy local firms (1).\nTo reduce a current account deficit (1) by cutting spending on imports (1)."},
{id:"x5",t:"int",m:4,p:"prot",q:"Explain two benefits of free trade to consumers.",a:"Prices are lower (1) because there are no tariffs and firms face more competition (1).\nThere is a wider choice of goods (1), including products that cannot be made at home (1)."},
{id:"x6",t:"int",m:7,p:"prot",q:"Discuss whether Namibia benefits from being a member of the Southern African Customs Union (SACU).",a:"BENEFITS (up to 4):\nNamibian firms can sell to the much larger South African market without tariffs (1), so exports and output can grow (1).\nNamibia receives a share of the customs revenue that SACU collects (1), which pays for a large part of government spending (1).\nCOSTS (up to 4):\nLocal infant industries face competition from big South African firms (1), so they may fail to grow (1).\nThe common external tariff is the same for all members (1), so Namibia cannot set its own tariffs, and SACU revenue can fall sharply from year to year (1).\nOVERALL: a supported judgement.",r:"Maximum four if one-sided."},
{id:"x7",t:"int",m:2,p:"bop",q:"A country exports goods worth N$60 billion and imports goods worth N$75 billion. Calculate the balance of trade.",a:"N$60 billion − N$75 billion (1) = −N$15 billion / a deficit of N$15 billion (1)"},
{id:"x8",t:"int",m:4,p:"fx",q:"Explain how a depreciation of a country's currency affects its exports and imports.",a:"Exports become cheaper for foreign buyers (1), so demand for exports rises (1). Imports become more expensive in local currency (1), so demand for imports falls (1)."},
{id:"x9",t:"int",m:2,p:"bop",q:"State two causes of a current account deficit.",a:"Any two: spending on imports rises, e.g. because incomes rise (1); exports fall, e.g. lower world prices for minerals (1); local goods are less competitive (1); a strong exchange rate (1)."},
{id:"x10",t:"int",m:4,p:"bop",q:"Explain two ways a government could reduce a current account deficit.",a:"Any two, 2 marks each:\nTariffs or quotas on imports (1) reduce spending on foreign goods (1).\nSubsidies or support for exporters (1) make exports cheaper and raise export earnings (1).\nHigher taxes (1) cut incomes, so less is spent on imports (1)."},
{id:"x11",t:"int",m:2,p:"fx",q:"The exchange rate is US$1 = N$18. A tourist changes US$500 into Namibia dollars. Calculate how many Namibia dollars she receives.",a:"500 × 18 (1) = N$9 000 (1)"},

      '<path d="M' + r1(X(qs)) + " " + yy + "V204M" + r1(X(qd)) + " " + yy + 'V204" fill="none" stroke="' + PUR + '" stroke-dasharray="3 3"/>' +

  var sc = DG.list[DG.i], isM = sc.c === "M", r = isM ? null : C.shiftResult(sc.c, sc.d);
  var ok1 = DG.p1 === sc.c + sc.d, ok2 = isM || DG.p2 === r.p + r.q, pts = (ok1 ? 1 : 0) + (!isM && ok2 ? 1 : 0);
  DG.full = ok1 && ok2; DG.pts += pts; DG.max += isM ? 1 : 2;
  S.diag.n++;
  if (DG.full) { S.diag.ok++; S.diag.run++; if (S.diag.run > S.diag.best) S.diag.best = S.diag.run; } else S.diag.run = 0;
  award(1 + 4 * pts, "d");
}
RENDER.diag = function () {
  var h = '<div class="card hero"><h2>Curve lab</h2><p>Tap a rule and watch the curve move. These four rules answer every shift question.</p>' +
    '<div class="svgbox" id="lab-svg"></div><p id="lab-cap" class="center" aria-live="polite"></p>' +
    '<div class="rule4">' + rule4("D", "R") + rule4("D", "L") + rule4("S", "R") + rule4("S", "L") + '</div>' +
    '<div class="center"><button class="linkbtn" data-act="lab-reset">Reset the diagram</button></div></div>';
  h += '<div class="card" id="dg">' + dgHTML() + '</div>';
  h += '<div class="card"><h2>What shifts which curve?</h2><div class="scroll"><table><tr><th style="color:var(--dem)">DEMAND shifts when this changes</th><th style="color:var(--sup)">SUPPLY shifts when this changes</th></tr>';
  D.SHIFTERS.d.forEach(function (d, i) { h += '<tr><td>' + esc(d) + '</td><td>' + esc(D.SHIFTERS.s[i] || "") + '</td></tr>'; });
  h += '</table></div><div class="flag"><b>Trap:</b> a change in the good’s own PRICE shifts neither curve. It is a movement along the curve.</div></div>';
  h += '<div class="card"><h2>7-point drawing checklist</h2><p class="small mut">Tick each point as you draw. In a 6-mark diagram question about half the marks are usually for the diagram itself.</p>';
  D.CHECK.forEach(function (c, i) {
    h += '<label class="check"><input type="checkbox" data-chg="chk" data-i="' + i + '"' + (S.diag.chk.indexOf(i) >= 0 ? " checked" : "") + '><span>' + (i + 1) + '. ' + esc(c) + '</span></label>';
  });
  h += '<div class="center"><button class="linkbtn" data-act="chk-reset">Untick all</button></div></div>';
  h += '<div class="sech"><h2>Classic scenarios</h2><span class="tag">' + D.CLASSIC.length + '</span></div>';
  D.CLASSIC.forEach(function (c) {
    h += '<details data-k="c-' + c.id + '"><summary><span class="grow">' + esc(c.t) + '</span></summary><div class="body"><p class="mut">' + esc(c.ex) + '</p>' +
      '<div class="svgbox">' + C.sdSVG(c.o) + '</div><ol class="steps">' + c.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("") + '</ol></div></details>';
  });
  paint("diag", h); drawLab();
};
ACT.lab = function (el) {
  LAB.c = el.getAttribute("data-c"); LAB.d = el.getAttribute("data-d");
  cancelAnimationFrame(labRaf);
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, t0 = null;
  if (still) { LAB.t = 1; drawLab(); return; }
  LAB.t = 0; drawLab();
  labRaf = requestAnimationFrame(function step(ts) {
    if (t0 === null) t0 = ts;
    LAB.t = Math.min(1, (ts - t0) / 550); drawLab();
    if (LAB.t < 1) labRaf = requestAnimationFrame(step);
  });
};
ACT["lab-reset"] = function () { cancelAnimationFrame(labRaf); LAB = {c:"", d:"", t:1}; drawLab(); };
ACT["dg-start"] = function () { DG = {list:C.shuffle(D.SCEN).slice(0, 8), i:0, p1:null, p2:null, pts:0, max:0, full:false, done:false}; dgPaint(); };
ACT["dg-p1"] = function (el) {
  if (!DG || DG.p1 !== null) return;
  DG.p1 = el.getAttribute("data-k");
  if (DG.list[DG.i].c === "M") dgFinish();
  dgPaint();
};
ACT["dg-p2"] = function (el) {
  if (!DG || DG.p1 === null || DG.p2 !== null) return;
  DG.p2 = el.getAttribute("data-k"); dgFinish(); dgPaint();
};
ACT["dg-next"] = function () {
  if (!DG) return;
  DG.i++; DG.p1 = null; DG.p2 = null; DG.full = false;
  if (DG.i >= DG.list.length) DG.done = true;
  dgPaint();
  var el = $("#dg"); if (el && el.scrollIntoView) el.scrollIntoView({block:"start"});
};
ACT["dg-quit"] = function () { DG = null; dgPaint(); };
ACT["chk-reset"] = function () { S.diag.chk = []; save(); RENDER.diag(); };
CHG.chk = function (el) {
  var i = +el.getAttribute("data-i"), at = S.diag.chk.indexOf(i);
  if (el.checked && at < 0) S.diag.chk.push(i);
  if (!el.checked && at >= 0) S.diag.chk.splice(at, 1);
  save();
  if (S.diag.chk.length === D.CHECK.length) toast("All 7 points: full diagram marks", "ok");
};

// =====================================================================================

// =====================================================================================
RENDER.notes = function () {
  var h = '<div class="card hero"><h2>Notes</h2><p>' + D.DEFS.length + ' definitions in mark-scheme wording, in 9 themes. The green numbers show where each mark falls.</p>' +
    '<label for="nt-q">Search the definitions</label><input type="search" id="nt-q" placeholder="e.g. tariff, elasticity, GDP" autocomplete="off">' +
    '<label class="toggle"><input type="checkbox" data-chg="selftest"' + (S.selftest ? " checked" : "") + '><span>Self-test: hide each definition until I tap it</span></label></div>' +
    '<div id="nt-list"' + (S.selftest ? ' class="selftest"' : "") + '>';
  D.THEMES.forEach(function (t, i) {
    var defs = D.DEFS.filter(function (d) { return d.t === t.id; });
    h += '<details data-k="n-' + t.id + '"><summary><span class="grow">' + (i + 1) + '. ' + esc(t.n) + '</span><span class="tag">' + defs.length + '</span></summary><div class="body">';
    defs.forEach(function (d) {
      h += '<div class="def" data-s="' + esc((d.k + " " + d.d).toLowerCase()) + '"><div class="k">' + esc(d.k) + '</div><div class="dd" data-act="def-show">' + fmt(d.d) +
        (d.e ? '<div class="note">' + fmt(d.e) + '</div>' : '') + (d.r ? '<div class="flag"><b>Marker’s rule:</b> ' + fmt(d.r) + '</div>' : '') + '</div></div>';
    });
    h += '<div class="row"><button class="btn ghost sm" data-act="nt-quiz" data-id="' + t.id + '">Quiz me on this theme</button></div></div></details>';
  });
  h += '</div><p id="nt-none" class="mut center" hidden>No definition matches that search.</p>';
  paint("notes", h);
};
function notesFilter(v) {
  var q = v.trim().toLowerCase(), any = false;
  $$("#nt-list details").forEach(function (d) {
    var hit = 0;
    $$(".def", d).forEach(function (r) { var ok = !q || r.getAttribute("data-s").indexOf(q) >= 0; r.hidden = !ok; if (ok) hit++; });
    d.hidden = !hit; if (hit) any = true;
    if (q) d.open = hit > 0;
  });
  $("#nt-none").hidden = any;
}
ACT["def-show"] = function (el) { if (S.selftest) el.parentNode.classList.toggle("shown"); };
ACT["nt-quiz"] = function (el) { QSEL.theme = el.getAttribute("data-id"); QZ = null; showTab("quiz"); };
CHG.selftest = function (el) { S.selftest = el.checked; save(); $("#nt-list").className = S.selftest ? "selftest" : ""; $$("#nt-list .def.shown").forEach(function (d) { d.classList.remove("shown"); }); };

// =====================================================================================
// 6. SECTION B + PAPER 2
// =====================================================================================
var EX = null;
function exHTML() {

  if (!EX) {
    return '<h2>Be the examiner</h2><p>Read a student’s answer and give it a mark. This is where the caps and the marker’s rules bite.</p>' +
      '<p class="small mut">' + done + ' of ' + n + ' marked correctly</p><button class="btn big" data-act="ex-start">Start marking</button>';
  }
  if (EX.i >= EX.list.length) {
    return '<h2>Be the examiner</h2><h3>' + EX.ok + ' of ' + EX.list.length + ' marked correctly</h3>' +
      '<div class="row"><button class="btn" data-act="ex-start">Mark again</button><button class="btn ghost" data-act="ex-quit">Close</button></div>';
  }
  var e = EX.list[EX.i];
  var h = '<div class="qhud"><span>Be the examiner · ' + (EX.i + 1) + ' of ' + EX.list.length + '</span><span>' + EX.ok + ' right</span></div>' +
    '<div class="bar"><i style="width:' + C.pct(EX.i, EX.list.length) + '%"></i></div><p><b>' + C.txt(e.q) + '</b> <span class="tag ok">' + plural(e.m, "mark") + '</span></p>' +
    '<div class="lbl">The student wrote</div><div class="student">' + C.txt(e.ans) + '</div><div class="lbl">Your mark</div><div class="opts two">';
  e.opts.forEach(function (o) {
    var cls = EX.pick === null ? "" : o === e.right ? " right" : o === EX.pick ? " wrong" : "";
    h += '<button class="opt' + cls + '" data-act="ex-pick" data-v="' + o + '"' + (EX.pick !== null ? " disabled" : "") + '>' + o + ' out of ' + e.m + '</button>';
  });
  h += '</div>';
  if (EX.pick !== null) {
    h += '<div class="fb ' + (EX.pick === e.right ? "ok" : "bad") + '"><h4>' + (EX.pick === e.right ? "Correct: " : "The mark is ") + e.right + ' out of ' + e.m + '.</h4>' + esc(e.why) + '</div>' +
      '<div class="row"><button class="btn big" data-act="ex-next">' + (EX.i + 1 < EX.list.length ? "Next answer" : "See result") + '</button></div>';

}
function exPaint() { var el = $("#ex"); if (el) el.innerHTML = exHTML(); }
RENDER.long = function () {
  var h = '<div class="card hero"><h2>The two papers</h2><div class="scroll"><table>' +
    '<tr><th class="rh">Paper 1</th><td>2 h 30 min · 80 marks<br><b>Section A</b>: about 23 short questions (40)<br><b>Section B</b>: 2 data-response questions × 20 (40)</td></tr>' +
    '<tr><th class="rh">Paper 2</th><td>2 h · 80 marks<br><b>Q1</b>: compulsory case study (20)<br><b>Q2–Q6</b>: choose 3 (20 each)</td></tr></table></div>' +
    '<p class="small mut">A B is roughly 70%: about 56 of 80 on each paper.</p></div>';

  h += '<div class="card"><h2>Time plan</h2><div class="scroll"><table>' +
    '<tr><th class="rh">Paper 1<br>150 min</th><td>Section A: 65 min (about 1½ min a mark)<br>Section B: 35 min for each data response<br>Checking: 15 min</td></tr>' +
    '<tr><th class="rh">Paper 2<br>120 min</th><td>Read and choose your 3 questions: 5 min<br>Four questions: 27 min each<br>Checking: 7 min</td></tr></table></div></div>';

  h += '<div class="card"><h2>Paper 2: every question has this shape</h2><ol class="steps">' +
    '<li><b>(a)(i) Define</b> <span class="tag ok">2</span><br>Two parts, exact wording. About 3 minutes.</li>' +
    '<li><b>(a)(ii) List four</b> <span class="tag ok">4</span><br>Four short answers, one per line. No explaining. About 4 minutes.</li>' +
    '<li><b>(b) Explain / Analyse</b> <span class="tag ok">7</span><br>Three developed points: point + because + which means. About 9 minutes.</li>' +
    '<li><b>(c) Discuss / Evaluate</b> <span class="tag ok">7–9</span><br>Two points for, two against, then “Overall…”. About 11 minutes.</li></ol></div>';

  h += '<div class="card"><h2>Discuss / Evaluate template</h2>' +
    '<div class="tpl for"><h4>For</h4>“One advantage is … <b>because</b> … <b>which means</b> …”<br>“A second advantage is … <b>so</b> …”</div>' +
    '<div class="tpl against"><h4>Against</h4>“<b>However</b>, a disadvantage is … <b>because</b> …”<br>“<b>Also</b> … <b>which means</b> …”</div>' +
    '<div class="tpl overall"><h4>Overall</h4>“<b>Overall</b>, … because … It depends on …”</div>' +
    '<div class="flag"><b>Maximum four if one-sided.</b> One-sided Discuss and Assess answers are capped at 4 of 7.</div></div>';

  h += '<div class="card"><h2>Explain / Analyse chain</h2><div class="tpl"><h4>One developed point</h4><b>Point</b> → <b>because</b> … → <b>which means</b> … → <b>so</b> (the effect on price, output, jobs or costs)</div>' +
    '<p class="small mut">Explain = point + “because”. Analyse = longer chains of “which means”. Neither needs the other side.</p></div>';

  h += '<div class="card"><h2>Section B: how to work a data response</h2><ol class="steps">' +

  h += '</div><div class="card" id="ex">' + exHTML() + '</div>';

  h += '<div class="sech"><h2>Worked questions</h2><span class="tag">' + D.WORKED.length + '</span></div><p class="small mut" style="margin-top:-2px">Exam-style questions with full-mark answers. The figures are illustrative.</p>';
  D.WORKED.forEach(function (w) {
    h += '<details data-k="w-' + w.id + '"><summary><span class="grow">' + esc(w.title) + '</span><span class="tag acc">' + esc(w.paper) + '</span></summary><div class="body">';

ACT["ex-start"] = function () {
  var list = C.shuffle(D.EXAM);
  list.sort(function (a, b) { return (S.exam[a.id] ? 1 : 0) - (S.exam[b.id] ? 1 : 0); });   // not yet right come first
  EX = {list:list, i:0, pick:null, ok:0}; exPaint();
};
ACT["ex-pick"] = function (el) {
  if (!EX || EX.pick !== null) return;
  var e = EX.list[EX.i]; EX.pick = +el.getAttribute("data-v");
  if (EX.pick === e.right) { EX.ok++; S.exam[e.id] = 1; }
  award(EX.pick === e.right ? 10 : 2); exPaint();
};
ACT["ex-next"] = function () {
  if (!EX) return;
  EX.i++; EX.pick = null; exPaint();
  var el = $("#ex"); if (el && el.scrollIntoView) el.scrollIntoView({block:"start"});
};
ACT["ex-quit"] = function () { EX = null; exPaint(); };

// =====================================================================================
// My progress (opens from the bar at the top)
// =====================================================================================
function sheetHTML() {
  var L = C.level(S.xp), t = totals(), d = day(), st = C.streak(S.days, new Date());
  var h = '<div class="sheethead"><h2>My progress</h2><button class="btn ghost sm" data-act="sheet-close" id="sheet-x">Close</button></div>';
  if (!Store.ok) h += '<div class="flag" style="margin-bottom:12px"><b>Not saving.</b> This browser is blocking storage, so your progress lasts only until you close the page.</div>';
  h += '<div class="card"><div class="lbl">Level ' + L.lv + ' · ' + esc(L.title) + '</div><div class="bar"><i style="width:' + L.pct + '%;background:var(--pur)"></i></div>' +
    '<p class="small mut">' + S.xp + ' XP · ' + (L.need - L.into) + ' XP to level ' + (L.lv + 1) + ' · ' + plural(st, "day") + ' streak</p></div>';
  h += '<div class="card"><div class="lbl">Road to a B</div>' +
    (t.pct == null ? '<p class="mut">Play a quiz round to see your grade.</p>'
      : '<div class="bar ' + barCls(t.pct) + '"><i style="width:' + t.pct + '%"></i></div><p>Quiz average <b>' + t.pct + '%</b> · grade <b>' + C.grade(t.pct) + '</b> · ' +
        (t.pct >= C.TARGET ? "on B standard" : (C.TARGET - t.pct) + " points to a B") + '</p>') +
    '<p class="small mut">A B is roughly 70%: about 56 of 80 on each paper. Grade boundaries here are approximate.</p></div>';
  h += '<div class="card"><div class="lbl">Today’s missions · +30 XP each</div>';
  MISSIONS.forEach(function (m) {
    var n = Math.min(d[m.k] || 0, m.n);
    h += '<div class="mission"><span>' + m.txt + '</span><span class="tag ' + (n >= m.n ? "ok" : "") + '">' + (n >= m.n ? "Done ✓" : n + "/" + m.n) + '</span></div>';
  });
  h += '</div><div class="card"><div class="lbl">Badges</div><div class="badges">';
  BADGES.forEach(function (b) { h += '<div class="badge' + (S.badges[b.id] ? " on" : "") + '"><b>' + (S.badges[b.id] ? "★ " : "") + esc(b.n) + '</b>' + esc(b.d) + '</div>'; });
  h += '</div></div>';
  h += '<details data-k="bk"><summary><span class="grow">Backup and reset</span></summary><div class="body">' +
    '<p class="small mut">Progress, your own questions and your logged traps live in this browser only. Copy the backup text somewhere safe, or paste one here to restore it.</p>' +
    '<label>Backup text<textarea id="bk-text" spellcheck="false">' + esc(JSON.stringify(S)) + '</textarea></label>' +
    '<div class="row"><button class="btn ghost sm" data-act="bk-copy">Copy backup</button><button class="btn ghost sm" data-act="bk-load">Restore from this text</button></div>' +
    '<div class="row"><button class="btn bad sm" data-act="reset">Erase all progress</button></div></div></details>';
  return h;
}
function sheetPaint() { $("#sheet-body").innerHTML = sheetHTML(); }
ACT["sheet-open"] = function () {
  sheetPaint(); $("#sheet").hidden = false; doc.body.style.overflow = "hidden";
  var x = $("#sheet-x"); if (x) x.focus();
};
function sheetClose() { $("#sheet").hidden = true; doc.body.style.overflow = ""; $("#hud").focus(); }
ACT["sheet-close"] = sheetClose;
ACT["bk-copy"] = function () {
  var ta = $("#bk-text"); ta.value = JSON.stringify(S); ta.focus(); ta.select();
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function () { toast("Backup copied", "ok"); }, function () { toast("Text selected: copy it by hand"); });
    else { doc.execCommand("copy"); toast("Backup copied", "ok"); }
  } catch (e) { toast("Text selected: copy it by hand"); }
};
ACT["bk-load"] = function (el) {
  var data;
  try { data = JSON.parse($("#bk-text").value); } catch (e) { toast("That text is not a valid backup", "bad"); return; }
  if (!data || typeof data !== "object" || Array.isArray(data)) { toast("That text is not a valid backup", "bad"); return; }
  if (!twoTap(el, "Tap again: this replaces your progress")) return;
  S = C.sanitize(data); QZ = TG = DG = EX = null; save(); renderHud(); sheetPaint(); RENDER[S.tab in RENDER ? S.tab : "pred"](); toast("Backup restored", "ok");
};
ACT.reset = function (el) {
  if (!twoTap(el, "Tap again to erase everything")) return;
  var tab = S.tab; S = C.blank(); S.tab = tab; QZ = TG = DG = EX = null;
  Store.clear(); save(); renderHud(); sheetPaint(); RENDER[tab in RENDER ? tab : "pred"](); toast("Progress erased");
};

// ---------- events ----------
doc.addEventListener("click", function (ev) {
  if (ev.target === $("#sheet")) { sheetClose(); return; }
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el || el.disabled) return;
  var f = ACT[el.getAttribute("data-act")];
  if (f) f(el, ev);
});
doc.addEventListener("change", function (ev) {
  var k = ev.target.getAttribute && ev.target.getAttribute("data-chg");
  if (k && CHG[k]) CHG[k](ev.target);
});
doc.addEventListener("input", function (ev) { if (ev.target.id === "nt-q") notesFilter(ev.target.value); });
doc.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && !$("#sheet").hidden) { sheetClose(); return; }
  if ((ev.key === "ArrowRight" || ev.key === "ArrowLeft") && ev.target.getAttribute && ev.target.getAttribute("role") === "tab") {
    var i = TABS.map(function (t) { return t[0]; }).indexOf(S.tab), j = (i + (ev.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length;
    showTab(TABS[j][0]); $("#tb-" + TABS[j][0]).focus();
  }
});

// ---------- start ----------
$("#tabs").innerHTML = TABS.map(function (t) {
  return '<button role="tab" id="tb-' + t[0] + '" data-act="tab" data-tab="' + t[0] + '" aria-controls="tab-' + t[0] + '" aria-selected="false">' + t[1] + '</button>';
}).join("");
TABS.forEach(function (t) { $("#tab-" + t[0]).setAttribute("aria-labelledby", "tb-" + t[0]); });
renderHud();
showTab(S.tab);
if (!Store.ok) setTimeout(function () { toast("Storage is blocked: progress will not be saved", "warn"); }, 600);
})();
</script>
