<p>Unemployment remains high, especially among young people. A survey found 360 000 people unemployed out of a labour force of 1 200 000. Local manufacturers have asked the government for more protection against cheap imports.</p>`,parts:[
      {l:"(a)",q:"Identify the year with the highest inflation rate.",m:1,cw:"Identify",scheme:["2022 (1)"],model:"2022 (6.1%)."},
      {l:"(b)",q:"Define unemployment.",m:2,cw:"Define",scheme:["People of working age who are willing and able to work (1)","and actively looking for work but do not have a job (1)"],model:"People of working age who are willing and able to work and are looking for work, but have no job."},
      {l:"(c)",q:"Using the extract, calculate the unemployment rate. Show your working.",m:3,cw:"Calculate",scheme:["Formula: unemployed ÷ labour force × 100 (1)","360 000 ÷ 1 200 000 × 100 (1)","= 30% (1)"],model:"Unemployment rate = 360 000 ÷ 1 200 000 × 100 = 30%"},
      {l:"(d)",q:"Explain two types of unemployment that may exist in Namibia.",m:4,cw:"Explain",scheme:["Type 1 (1) + explanation (1), e.g. structural: decline of an industry (mine closure), skills no longer needed","Type 2 (1) + explanation (1), e.g. seasonal: tourism/agriculture jobs only in some months; frictional: school leavers/graduates between jobs; cyclical: low demand in recession"],model:"1. Structural unemployment: when a mine closes, miners lose their jobs and their skills are not needed in other industries. 2. Seasonal unemployment: some workers in tourism and farming only have work in the busy season, so they are unemployed for part of the year."},
      {l:"(e)",q:"Analyse how the change in the repo rate between 2021 and 2023 may have affected inflation.",m:4,cw:"Analyse",scheme:["Repo rate rose from 3.75% to 7.75% (1)","commercial banks raise lending rates, so borrowing is more expensive (1)","consumers and firms spend/invest less; saving is more attractive (1)","aggregate demand falls, so inflation falls (data: 6.1% → 5.9% → 4.2%) (1)"],model:"The repo rate rose from 3.75% to 7.75%. Commercial banks then raised their lending rates, so loans became more expensive. Households and firms borrowed and spent less, and saving became more attractive. Lower spending reduced aggregate demand, so prices rose more slowly: inflation fell from 6.1% in 2022 to 4.2% in 2024."},
      {l:"(f)",q:"Discuss whether Namibia should put tariffs on imports to protect local manufacturers.",m:6,cw:"Discuss",scheme:["For (up to 3): protects infant industries / local jobs; reduces imports and improves current account; raises government revenue","Against (up to 3): higher prices for consumers; less choice; local firms become inefficient; retaliation by trading partners; SACU rules (common external tariff) limit Namibia acting alone","Max 4 if only one side; credit a supported conclusion"],model:"For: a tariff makes imports more expensive, so consumers buy more local products. Local firms sell more and can grow, so they hire more workers, which reduces unemployment. It also raises tax revenue. Against: consumers pay higher prices and have less choice, which lowers living standards, especially for the poor. Protected firms may not try to become efficient. Other countries may retaliate with their own tariffs, hurting Namibian exports such as beef and fish. Also, as a SACU member, Namibia shares a common external tariff, so it cannot easily set tariffs alone. Overall, a temporary tariff for a true infant industry may help, but long-term protection is likely to harm consumers."}]}
  ]}
]},

{ id:"p1b", paper:1, title:"Paper 1: Mock B", minutes:150, total:80,
  intro:"Answer ALL questions. Section A: 40 marks. Section B: two data-response questions, 20 marks each. Show all working in calculations.",
  sections:[
  { name:"Section A (40 marks)", questions:[
    {id:"a1",theme:1,parts:[
      {l:"(a)",q:"Define a mixed economy.",m:2,cw:"Define",scheme:["An economy where resources are allocated by both the private sector / market (1)","and the public sector / government (1)"],model:"A mixed economy is one where both the private sector (through the market) and the government decide how resources are used."},
      {l:"(b)",q:"State two disadvantages of a market economy.",m:2,cw:"State",scheme:["Any two (1 each): inequality of income; public goods not provided; merit goods under-provided; demerit goods over-consumed; external costs/pollution; monopoly power"],model:"Public goods are not provided. Income is unequal."},
      {l:"(c)",q:"Give one example of a state-owned enterprise in Namibia.",m:1,cw:"Identify",scheme:["NamPower / NamWater / TransNamib / Air Namibia (former) / NamPost / Telecom Namibia / Namport (1)"],model:"NamPower."}]},
    {id:"a2",theme:2,parts:[
      {l:"(a)",q:"State two functions of a commercial bank.",m:2,cw:"State",scheme:["Any two (1 each): accept deposits; give loans/overdrafts/mortgages; payment services; foreign exchange; safe custody; financial advice"],model:"Accepting deposits and giving loans."},
      {l:"(b)",q:"Explain one reason why a sole trader may want to become a private limited company.",m:2,cw:"Explain",scheme:["Limited liability (1) so the owner's personal assets are safe if the business fails (1)","OR more capital (1) because shares can be sold to family/friends to fund growth (1)"],model:"To get limited liability, because then the owner can only lose the money invested and not their own house or car."},
      {l:"(c)",q:"State one action a trade union may take in a wage dispute.",m:1,cw:"State",scheme:["Strike / go-slow / work-to-rule / overtime ban / collective bargaining / picketing (1)"],model:"A strike."}]},
    {id:"a3",theme:3,parts:[
      {l:"(a)",q:"State two factors that could cause the supply of fish to decrease.",m:2,cw:"State",scheme:["Any two (1 each): lower fishing quotas; higher fuel/labour costs; bad weather / changes in ocean conditions; new indirect tax; boats breaking down / fewer firms. (Do NOT credit 'a fall in the price of fish'.)"],model:"A cut in fishing quotas and a rise in fuel costs."},
      {l:"(b)",q:"Explain the difference between a 'decrease in supply' and a 'contraction of supply'.",m:3,cw:"Explain",scheme:["Decrease in supply: the whole supply curve shifts left (1)","caused by a non-price factor, e.g. higher costs (1)","Contraction: a movement down along the same supply curve caused by a fall in the good's own price (1)"],model:"A decrease in supply is a shift of the whole supply curve to the left, caused by a non-price factor such as higher costs. A contraction of supply is a movement down along the same curve, caused by a fall in the good's own price."}]},
    {id:"a4",theme:4,parts:[
      {l:"(a)",q:"Sam borrows N$8 000 at 12% simple interest a year for 2 years. Calculate the total amount he must repay. Show your working.",m:3,cw:"Calculate",scheme:["Interest = 8 000 × 0.12 × 2 (1)","= N$1 920 (1)","Total = 8 000 + 1 920 = N$9 920 (1)"],model:"Interest = 8 000 × 0.12 × 2 = N$1 920. Total repaid = 8 000 + 1 920 = N$9 920"},
      {l:"(b)",q:"State two reasons why people save.",m:2,cw:"State",scheme:["Any two (1 each): for emergencies; for old age/retirement; to buy expensive items (house, car); for education; to earn interest; for children's future"],model:"For retirement and for emergencies."}]},
    {id:"a5",theme:5,parts:[
      {l:"(a)",q:"A factory employed 20 workers and produced 4 000 units. After training, 20 workers produce 5 000 units. Calculate the % increase in labour productivity.",m:3,cw:"Calculate",scheme:["Before: 4 000 ÷ 20 = 200; after: 5 000 ÷ 20 = 250 units per worker (1)","(250 − 200) ÷ 200 × 100 (1)","= 25% (1)"],model:"Before: 4 000 ÷ 20 = 200 units per worker. After: 5 000 ÷ 20 = 250. Increase = (250 − 200) ÷ 200 × 100 = 25%"},
      {l:"(b)",q:"State two diseconomies of scale.",m:2,cw:"State",scheme:["Any two (1 each): poor communication; slow decision making; low worker motivation; coordination/control problems; (external) congestion, higher land prices"],model:"Poor communication and slow decisions."}]},
    {id:"a6",theme:6,parts:[
      {l:"(a)",q:"Define monetary policy.",m:2,cw:"Define",scheme:["Changing interest rates / money supply (1)","by the central bank (Bank of Namibia) to influence the economy (1)"],model:"Monetary policy is when the Bank of Namibia changes interest rates or the money supply to influence the economy."},
      {l:"(b)",q:"The government plans to spend N$95 billion and expects revenue of N$88 billion. Calculate the budget balance and state whether it is a surplus or a deficit.",m:2,cw:"Calculate",scheme:["88 − 95 = −N$7 billion (1)","Deficit (1)"],model:"88 − 95 = −7. A budget deficit of N$7 billion."},
      {l:"(c)",q:"State one reason why VAT is a regressive tax.",m:1,cw:"State",scheme:["Poor people spend a larger % of their income, so VAT takes a larger % of their income (1)"],model:"Poor households spend most of their income, so VAT takes a bigger share of their income than of a rich person's."}]},
    {id:"a7",theme:7,parts:[
      {l:"(a)",q:"Namibia's exports of goods were N$62 billion and imports of goods were N$74 billion. Calculate the balance of trade in goods.",m:2,cw:"Calculate",scheme:["62 − 74 (1)","= −N$12 billion (deficit) (1)"],model:"62 − 74 = −N$12 billion: a trade deficit."},
      {l:"(b)",q:"State two components of the current account of the balance of payments.",m:2,cw:"State",scheme:["Any two (1 each): trade in goods; trade in services; primary income; secondary income (transfers)"],model:"Trade in goods and trade in services."},
      {l:"(c)",q:"State one effect of a depreciation of the N$ on Namibia's imports.",m:1,cw:"State",scheme:["Imports become more expensive / fewer imports bought (1)"],model:"Imports become more expensive."}]},
    {id:"a8",theme:9,parts:[
      {l:"(a)",q:"Distinguish between renewable and non-renewable resources, using one Namibian example of each.",m:4,cw:"Distinguish",scheme:["Renewable: can be replaced naturally (1); e.g. solar, wind, fish (1)","Non-renewable: finite, cannot be replaced once used (1); e.g. diamonds, uranium, gold (1)"],model:"A renewable resource can be replaced naturally, e.g. solar energy. A non-renewable resource is finite and cannot be replaced once used, e.g. diamonds."},
      {l:"(b)",q:"State one way the government can protect fish stocks.",m:1,cw:"State",scheme:["Fishing quotas / closed seasons / licences / net-size rules / fines (1)"],model:"Set fishing quotas."}]}
  ]},
  { name:"Section B (40 marks)", questions:[
    {id:"b1",theme:7,stem:`<p><b>Extract: Tourism and the exchange rate</b> <span class="small muted">(practice data)</span></p>
<p>Tourism is one of Namibia's biggest earners of foreign currency. Visitors come to Etosha, Sossusvlei and the coast. Over one year the exchange rate moved from US$1 = N$16.00 to US$1 = N$18.40. Tour operators reported more bookings from the USA and Europe. However, fuel importers warned that petrol prices would rise. Many tourism jobs are seasonal, and lodges in conservancies share income with local communities.</p>`,parts:[
      {l:"(a)",q:"Define exchange rate.",m:2,cw:"Define",scheme:["The price of one currency (1)","in terms of another currency (1)"],model:"The price of one currency expressed in another currency."},
      {l:"(b)",q:"A US tourist has US$1 500. Calculate how many more N$ she gets at the new rate than at the old rate.",m:3,cw:"Calculate",scheme:["Old: 1 500 × 16.00 = N$24 000 (1)","New: 1 500 × 18.40 = N$27 600 (1)","Difference = N$3 600 (1)"],model:"Old: 1 500 × 16.00 = N$24 000. New: 1 500 × 18.40 = N$27 600. Difference: N$3 600 more."},
      {l:"(c)",q:"Has the N$ appreciated or depreciated? Give a reason from the extract.",m:2,cw:"Identify",scheme:["Depreciated (1)","more N$ are needed to buy one US$ (16.00 → 18.40) (1)"],model:"Depreciated, because one US$ now buys more N$ (N$18.40 instead of N$16.00)."},
      {l:"(d)",q:"Explain why tourism is recorded in the current account as an export of services.",m:3,cw:"Explain",scheme:["Foreign tourists spend money in Namibia (1)","so foreign currency flows into Namibia (1)","it is a service, not a physical good (invisible) (1)"],model:"Foreign tourists pay for hotels, tours and food in Namibia. Money flows into Namibia from abroad, just like when goods are sold abroad. Because hotels and tours are services, not goods, it is an export of services (invisible export)."},
      {l:"(e)",q:"Analyse how the change in the exchange rate could cause inflation in Namibia.",m:4,cw:"Analyse",scheme:["N$ depreciates, so imports cost more in N$ (1)","e.g. imported fuel / petrol prices rise (1)","firms' transport and production costs rise (1)","costs passed on in higher prices: cost-push inflation (1)"],model:"The N$ has depreciated, so importers must pay more N$ for goods priced in US$, such as fuel. Petrol prices rise, so transport and production costs rise for many firms. Firms pass these higher costs on to consumers as higher prices, so the general price level rises: cost-push inflation."},
      {l:"(f)",q:"Discuss whether growth in tourism is good for the Namibian economy.",m:6,cw:"Discuss",scheme:["Benefits (up to 3): foreign currency / current account; jobs incl. rural; income for conservancies and local communities; multiplier to other firms; tax revenue","Costs (up to 3): seasonal and low-paid jobs; damage to environment/wildlife; dependence on foreign demand (e.g. pandemics); profits may leave the country (foreign-owned lodges)","Max 4 if only one side; reward a supported conclusion"],model:"Good: tourists bring foreign currency, which improves the current account. Lodges and tour firms create jobs, including in rural areas where jobs are few, and conservancies share income with communities, which reduces poverty. Tourists also spend in shops and restaurants, so other firms grow. Not so good: many jobs are seasonal, so workers are unemployed in the low season. Too many visitors can damage fragile areas such as Sossusvlei. Tourism also depends on events abroad; during COVID-19 tourism almost stopped. Overall, tourism is good for Namibia if it is managed sustainably and the income stays in local communities."}]},
    {id:"b2",theme:3,stem:`<p><b>Extract: A single electricity supplier</b> <span class="small muted">(practice data)</span></p>
<p>In a country, one state-owned firm owns all electricity transmission lines. Other firms cannot easily enter the market because building a grid costs billions. Electricity prices rose by 8% while quantity demanded fell by only 2%. The firm has economies of scale but some customers complain about poor service. The government is considering allowing private solar farms to sell electricity to the grid.</p>`,parts:[
      {l:"(a)",q:"Identify the type of market structure described in the extract.",m:1,cw:"Identify",scheme:["Monopoly (1)"],model:"Monopoly."},
      {l:"(b)",q:"Calculate the price elasticity of demand for electricity.",m:2,cw:"Calculate",scheme:["−2 ÷ 8 (1)","= −0.25 (1)"],model:"PED = −2% ÷ 8% = −0.25"},
      {l:"(c)",q:"Using your answer to (b), explain what happened to the firm's total revenue.",m:3,cw:"Explain",scheme:["Demand is inelastic (0.25 < 1) (1)","% fall in quantity is smaller than % rise in price (1)","so total revenue rises (1)"],model:"Demand is inelastic because 0.25 is less than 1. The quantity fell by a smaller % (2%) than the price rose (8%), so total revenue increased."},
      {l:"(d)",q:"State two barriers to entry in this market.",m:2,cw:"State",scheme:["Very high start-up costs / grid costs billions (1)","Economies of scale of existing firm / legal rights / government ownership / control of transmission lines (1)"],model:"High start-up cost of building a grid, and the existing firm owns all transmission lines."},
      {l:"(e)",q:"Explain why this firm can use price discrimination but a firm in perfect competition cannot.",m:4,cw:"Explain",scheme:["Price discrimination = different prices to different groups for the same product (1)","The monopoly has market power / is a price maker (1)","A firm in perfect competition is a price taker (1)","because there are many firms with identical products; if it raised price, buyers would switch (1)"],model:"Price discrimination means charging different prices to different groups for the same product, e.g. higher rates for businesses than households. The monopoly can do this because it is a price maker: customers have no other supplier. A firm in perfect competition is a price taker. If it charged a higher price, buyers would simply buy the identical product from one of the many other firms."},
      {l:"(f)",q:"Discuss whether allowing private solar farms to sell electricity would benefit consumers.",m:8,cw:"Discuss",scheme:["For (up to 4): more competition → lower prices / better service; more supply → fewer power cuts / less imported electricity; renewable, clean energy; new jobs and investment","Against (up to 4): solar is not available at night / needs storage; the monopoly may lose economies of scale so costs rise; private firms may focus on profit, not poor rural areas; set-up and regulation costs","Judgement (up to 2): weighed conclusion, e.g. depends on regulation and price of storage"],model:"For: private solar farms add competition, so the monopoly must improve service and keep prices down. Supply increases, so there may be fewer shortages and less need to import electricity. Solar is renewable and Namibia has strong sunshine, so this is sustainable. Against: solar only works in the day, so the grid still needs other sources at night. If the state firm sells less, it may lose economies of scale and its average cost may rise, which could push prices up. Private firms want profit and may not invest in poor rural areas. Judgement: it depends on how well the government regulates prices and access to the grid. Overall, consumers are likely to benefit in the long run because more supply and competition usually lower prices, as long as the regulator protects rural customers."}]}
  ]}
]},

{ id:"p2a", paper:2, title:"Paper 2: Mock A", minutes:120, total:80,
  intro:"Section A: Question 1 is compulsory (20 marks). Section B: answer any THREE questions (20 marks each). Total 80 marks.",
  sections:[
  { name:"Section A: compulsory case study (20 marks)", questions:[
    {id:"q1",theme:9,stem:`<p><b>Case study: A new uranium mine in the Erongo Region</b> <span class="small muted">(practice case)</span></p>
<p>A foreign mining company wants to open a new uranium mine near Arandis. It will employ 900 workers and build a road and a clinic. Uranium exports would earn foreign currency and the government would receive royalties and company tax. Farmers and tourism operators are worried. The mine needs a lot of water from underground aquifers, and dust may spread to farmland. Uranium is a non-renewable resource, and the mine would close after about 20 years.</p>`,parts:[
      {l:"(a)",q:"Define social cost.",m:2,cw:"Define",scheme:["Private cost + external cost (1)","the total cost to society of an activity (1)"],model:"Social cost is the total cost of an activity to society: private cost plus external cost."},
      {l:"(b)",q:"Identify two external costs of the mine from the case study.",m:2,cw:"Identify",scheme:["Water taken from aquifers (less for farmers/towns) (1)","Dust spreading to farmland (1)","(also: harm to tourism / landscape)"],model:"Loss of underground water for others, and dust on farmland."},
      {l:"(c)",q:"Explain two benefits of the mine to the local community.",m:4,cw:"Explain",scheme:["Benefit 1 (1) + explanation (1), e.g. 900 jobs, so households earn income and living standards rise","Benefit 2 (1) + explanation (1), e.g. new road/clinic: external benefits, better access to health care and markets; local shops gain customers"],model:"1. Jobs: the mine will employ 900 people, so more households earn wages and can afford better food, housing and education. 2. Infrastructure: the new road and clinic can be used by everyone, so people get better health care and can reach markets more easily."},
      {l:"(d)",q:"Analyse how the mine could increase Namibia's GDP.",m:5,cw:"Analyse",scheme:["Mine produces uranium: output rises (1)","exports increase, (X − M) rises (1)","investment (I) in machines and roads rises (1)","workers earn wages and spend in local shops (1)","other firms expand: multiplier effect, so GDP rises further (1)"],model:"The mine produces uranium, so the country's total output rises. Most uranium is exported, so exports (X) rise, which adds to GDP = C + I + G + (X − M). Building the mine is investment (I), which also adds to GDP. The 900 workers earn wages and spend them in local shops, so consumption (C) rises. Shops and suppliers then expand and hire more workers, so GDP rises even more (the multiplier effect)."},
      {l:"(e)",q:"Evaluate whether the government should allow the mine to open.",m:7,cw:"Evaluate",scheme:RUBRIC7_DISCUSS,model:"Uranium mining is a primary activity that uses a non-renewable resource (K). For: the mine creates 900 jobs in Erongo and the government gains royalties and tax, which it can spend on schools and hospitals; exports bring foreign currency (App/An). Against: the mine uses scarce water from aquifers in a desert region, so farmers and towns may have less water; dust can harm farmland and tourism, which are also important sources of jobs (An). Also, uranium will run out in 20 years, so jobs are not permanent. Judgement: the decision depends on whether the social benefits are greater than the social costs. If the government makes the company pay for water recycling, controls dust and saves part of the royalties for the future, the benefits are likely to be bigger than the costs. So overall the mine should be allowed, but only with strict environmental conditions (E)."}]}
  ]},
  { name:"Section B: answer any THREE (60 marks)", choose:3, questions:[
    {id:"q2",theme:1,parts:[
      {l:"(a)(i)",q:"Define market failure.",m:2,cw:"Define",scheme:["When the market / price mechanism (1)","does not allocate resources efficiently (1)"],model:"Market failure is when the free market does not allocate resources efficiently."},
      {l:"(a)(ii)",q:"State two examples of merit goods.",m:2,cw:"State",scheme:["Any two (1 each): education, health care, vaccinations, libraries, museums"],model:"Education and health care."},
      {l:"(a)(iii)",q:"Explain why a market economy will not provide public goods.",m:2,cw:"Explain",scheme:["Public goods are non-excludable, so people can use them without paying (free-rider problem) (1)","so private firms cannot make a profit and will not supply them (1)"],model:"People cannot be stopped from using a public good like street lights, so they will not pay (free riders). Firms cannot make a profit, so they do not provide it."},
      {l:"(b)",q:"Analyse how the division of labour can increase output in a factory.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"Division of labour means splitting production into separate tasks done by different workers (K). In a meat-processing plant in Okahandja (App), each worker does one task, e.g. cutting, packing or labelling. Because the worker repeats one task, he becomes skilled and fast (link 1). Less time is wasted moving between tasks and tools (link 2). Simple tasks make it easier to use machines (link 3). So each worker produces more in an hour: labour productivity rises (link 4). With the same number of workers, total output of the factory rises and average cost falls (link 5)."},
      {l:"(c)",q:"Discuss whether Namibia's government should provide more goods and services instead of the private sector.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"In a mixed economy both government and private firms provide goods (K). For more government provision: the state can provide public goods and merit goods, such as clinics and schools in rural Kunene, which private firms ignore because they are not profitable (App). This raises living standards and reduces inequality, because the poor can use them even if they cannot pay (An). Against: some state-owned enterprises in Namibia have needed large government bailouts, because without a profit motive there is less pressure to be efficient. This uses tax money that could go to other needs, and choice for consumers may fall (An). Judgement: it depends on the type of good. For public and merit goods, government provision is best because the market fails. For ordinary goods, private firms are usually more efficient. So overall the government should focus on goods where the market fails and leave the rest to the private sector (E)."}]},
    {id:"q3",theme:2,parts:[
      {l:"(a)(i)",q:"Define a trade union.",m:2,cw:"Define",scheme:["An organisation of workers (1)","that protects/improves members' pay and working conditions (1)"],model:"An organisation of workers that aims to protect and improve its members' pay and working conditions."},
      {l:"(a)(ii)",q:"State two functions of a trade union.",m:2,cw:"State",scheme:["Any two (1 each): negotiate wages; improve working conditions; protect jobs; legal advice; training; health and safety"],model:"Negotiating higher wages and improving safety at work."},
      {l:"(a)(iii)",q:"Explain one reason why a trade union may be weak.",m:2,cw:"Explain",scheme:["Reason (1) + explanation (1), e.g. few members, so the employer does not depend on them; workers are unskilled and easy to replace; high unemployment means many people want the jobs"],model:"When unemployment is high, there are many people who want the jobs, so the employer can easily replace workers who strike."},
      {l:"(b)",q:"Analyse how a successful wage increase for mineworkers could affect a mining company.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"Wages are the reward for labour and a cost of production (K). If the Mineworkers Union of Namibia wins a 10% pay rise (App), the mine's costs of production rise (link 1). Profit falls unless the mine can raise prices (link 2). But mineral prices are set on world markets, so the mine cannot pass the cost on easily (link 3). The mine may replace some workers with machines or cut jobs to reduce costs (link 4). On the other hand, better-paid workers may be more motivated and productive, which could partly cover the higher cost (link 5)."},
      {l:"(c)",q:"Discuss whether strikes are good for workers.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"A strike is when workers stop working to put pressure on the employer (K). Good for workers: a strike stops production, so the firm loses revenue and may agree to higher wages and better safety; e.g. in mining, every lost day costs the firm a lot (App, An). Bad for workers: workers usually lose pay during a strike. The firm may lose customers or exports, so in the long run it may cut jobs or close. Workers may also lose public support (An). Judgement: whether a strike is good depends on how strong the union is and how profitable the firm is. If the firm is profitable and the workers are skilled, a short strike can win real gains. If the firm is weak or unemployment is high, the strike may cost jobs. So overall strikes are only good for workers as a last step after negotiation fails (E)."}]},
    {id:"q4",theme:3,parts:[
      {l:"(a)(i)",q:"Define perfect competition.",m:2,cw:"Define",scheme:["A market with many buyers and sellers (1)","selling identical products with free entry/exit and perfect information; firms are price takers (1)"],model:"A market with many firms selling identical products, with no barriers to entry, so each firm is a price taker."},
      {l:"(a)(ii)",q:"State two barriers to entry into a market.",m:2,cw:"State",scheme:["Any two (1 each): high start-up costs; economies of scale of existing firms; legal barriers/licences/patents; control of raw materials; brand loyalty"],model:"High start-up costs and licences."},
      {l:"(a)(iii)",q:"Explain why pricing policies such as price skimming are not used in perfect competition.",m:2,cw:"Explain",scheme:["Firms in perfect competition are price takers / have no market power (1)","if a firm charged more than the market price, buyers would switch to identical products from other firms (1)"],model:"A firm in perfect competition is a price taker. If it charged a higher price, buyers would buy the identical product from other firms, so it cannot choose its own price."},
      {l:"(b)",q:"Analyse the effect of a monopoly on consumers.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"A monopoly is a single seller with no close substitutes (K), e.g. a single water supplier in a town (App). Because there are no rivals, consumers cannot switch (link 1). The monopoly is a price maker, so it can raise the price above the competitive level (link 2). Consumers pay more and buy less, so consumer welfare falls (link 3). Without competition there is little pressure to improve service or quality (link 4). However, a large monopoly may gain economies of scale, so its average costs are low, which could mean lower prices if it is regulated (link 5)."},
      {l:"(c)",q:"Discuss whether advertising benefits consumers.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"Advertising is a way to inform or persuade consumers to buy a product (K). Benefits: informative advertising tells consumers about prices and new products, e.g. supermarket specials in Windhoek newspapers, so they can make better choices and save money (App, An). Costs: persuasive advertising can mislead and create brand loyalty, so demand becomes more inelastic and firms can charge higher prices. The cost of advertising is added to the price. It can also encourage demerit goods like alcohol (An). Judgement: it depends on the type of advertising. Informative advertising mostly helps consumers, while persuasive advertising mostly helps firms. Overall, advertising benefits consumers when it is controlled by rules against false claims (E)."}]},
    {id:"q5",theme:6,parts:[
      {l:"(a)(i)",q:"Define a budget deficit.",m:2,cw:"Define",scheme:["When government spending (1)","is greater than government revenue (1)"],model:"When government spending is greater than government revenue in a year."},
      {l:"(a)(ii)",q:"State two sources of government revenue in Namibia.",m:2,cw:"State",scheme:["Any two (1 each): income tax; company tax; VAT; SACU receipts; excise/import duty; mining royalties; dividends from SOEs"],model:"VAT and SACU receipts."},
      {l:"(a)(iii)",q:"Explain one feature of a good tax.",m:2,cw:"Explain",scheme:["Canon named (1) + explained (1), e.g. equity: tax based on ability to pay; certainty: taxpayer knows how much and when; convenience; economy: cheap to collect"],model:"Equity: the tax should be fair, so people with higher incomes pay more."},
      {l:"(b)",q:"Analyse how expansionary fiscal policy can reduce unemployment.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"Expansionary fiscal policy means more government spending and/or lower taxes (K). For example, the government builds more roads and houses (App). Construction firms get contracts and hire more workers (link 1). Workers earn wages and spend more in shops (link 2). Lower income tax also raises disposable income, so consumption rises (link 3). Aggregate demand rises, so firms produce more (link 4). To produce more output, firms need more labour, so cyclical unemployment falls (link 5)."},
      {l:"(c)",q:"Discuss whether Namibia should raise VAT to reduce its budget deficit.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"VAT is an indirect tax on spending, now 15% in Namibia (K). For: a higher VAT rate raises a lot of revenue because almost everyone buys goods, so the budget deficit and the need to borrow fall; less borrowing means less interest paid in future (App, An). Against: VAT is regressive, so poor households lose a bigger share of their income. Prices rise, so spending falls, firms sell less and may cut jobs, which slows growth and can even reduce tax income (An). Judgement: it depends on whether basic foods remain zero-rated and on the state of the economy. If the economy is weak, a VAT rise could cause more unemployment. Overall, a small VAT rise with basic foods zero-rated could help, but cutting wasteful spending is less harmful (E)."}]},
    {id:"q6",theme:7,parts:[
      {l:"(a)(i)",q:"Define comparative advantage.",m:2,cw:"Define",scheme:["When a country can produce a good (1)","at a lower opportunity cost than another country (1)"],model:"When a country can produce a good at a lower opportunity cost than another country."},
      {l:"(a)(ii)",q:"State two methods of protection.",m:2,cw:"State",scheme:["Any two (1 each): tariffs; quotas; subsidies to local firms; embargo; strict standards / red tape"],model:"Tariffs and quotas."},
      {l:"(a)(iii)",q:"Explain one reason for protecting an infant industry.",m:2,cw:"Explain",scheme:["A new industry has high average costs / no economies of scale yet (1)","so it cannot compete with large foreign firms until it grows (1)"],model:"A new industry is small and has high costs, so it cannot compete with big foreign firms until it grows and gains economies of scale."},
      {l:"(b)",q:"Analyse how international trade can raise living standards in Namibia.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"International trade is the exchange of goods and services between countries (K). Namibia exports diamonds, uranium and fish, where it has a comparative advantage (App). Specialising in these goods uses resources efficiently (link 1). Exports earn foreign currency, which pays for imports Namibia cannot make, e.g. cars and fuel (link 2). Consumers get a wider choice and often lower prices (link 3). Export firms grow and create jobs, so incomes rise (link 4). Higher real incomes and more choice mean a higher standard of living (link 5)."},
      {l:"(c)",q:"Discuss whether Namibia benefits from being a member of SACU.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"SACU is a customs union with free trade between members and a common external tariff (K). Benefits: Namibia receives SACU revenue, which is a large share of government income, and its firms can sell freely to South Africa's big market (App, An). Costs: Namibian firms face strong competition from big South African firms, so local manufacturing struggles to grow; Namibia cannot set its own tariffs; and SACU revenue can change a lot from year to year, making the budget uncertain (An). Judgement: it depends on whether Namibia can develop its own industries. The revenue and market access are very important now, while the costs can be reduced with infant-industry protection, which SACU allows. So overall Namibia benefits from SACU membership (E)."}]}
  ]}
]},

{ id:"p2b", paper:2, title:"Paper 2: Mock B", minutes:120, total:80,
  intro:"Section A: Question 1 is compulsory (20 marks). Section B: answer any THREE questions (20 marks each). Total 80 marks.",
  sections:[
  { name:"Section A: compulsory case study (20 marks)", questions:[
    {id:"q1",theme:7,stem:`<p><b>Case study: Namibia's fishing industry</b> <span class="small muted">(practice case)</span></p>
<p>Fishing is Namibia's second-largest export earner after mining. Most hake and horse mackerel is processed in Walvis Bay and Lüderitz and exported to Spain and other EU countries. The government sets a Total Allowable Catch (quota) each year to protect fish stocks. Last year fuel prices rose, and the N$ weakened against the euro. A large fishing company plans to merge with a canning factory. Unions worry about job losses because the merged firm wants to buy new machines.</p>`,parts:[
      {l:"(a)",q:"Define a quota (in fishing).",m:2,cw:"Define",scheme:["A legal limit (1)","on the amount of fish that can be caught (in a period) (1)"],model:"A legal limit on the quantity of fish that can be caught in a year."},
      {l:"(b)",q:"Identify the sector of the economy for (i) fishing and (ii) canning.",m:2,cw:"Identify",scheme:["(i) Primary (1)","(ii) Secondary (1)"],model:"(i) Primary sector. (ii) Secondary sector."},
      {l:"(c)",q:"Explain how a weaker N$ against the euro affects Namibian fish exporters.",m:4,cw:"Explain",scheme:["Namibian fish becomes cheaper in euros for EU buyers (1)","so demand / export volumes rise (1)","each euro earned converts into more N$ (1)","so exporters' revenue and profit in N$ rise (1)"],model:"When the N$ weakens, EU buyers need fewer euros to buy the same N$ amount of fish, so Namibian fish is cheaper in Spain and demand rises. Also, each euro the exporter earns converts into more N$, so its revenue and profit in N$ increase."},
      {l:"(d)",q:"Analyse how the merger could lower the firm's average costs.",m:5,cw:"Analyse",scheme:["This is a vertical forward merger (1)","the firm gains economies of scale, e.g. bulk buying of tins/fuel (1)","technical: new machines produce more per worker (1)","no middleman: secure outlet, lower transport/transaction costs (1)","output rises faster than total cost, so average cost (TC ÷ Q) falls (1)"],model:"The fishing company joining the canning factory is a vertical forward merger. The bigger firm can buy tins and fuel in bulk at a discount (purchasing economy). New machines can process more fish per worker (technical economy). It no longer pays a separate firm a profit margin to can its fish, and it is sure of an outlet. Because output rises faster than total cost, average cost (TC ÷ Q) falls."},
      {l:"(e)",q:"Evaluate whether the government should increase the fishing quota to create more jobs.",m:7,cw:"Evaluate",scheme:RUBRIC7_DISCUSS,model:"A quota limits the catch to protect a renewable resource (K). For a higher quota: firms can catch and process more fish in Walvis Bay and Lüderitz, so they hire more workers and exports and tax revenue rise (App, An). Against: if the catch is greater than the rate at which fish stocks reproduce, stocks fall. In the future catches would drop and many more jobs would be lost; this is not sustainable and harms future generations (An). Judgement: it depends on scientific evidence about the size of fish stocks. If stocks are healthy, a small increase can create jobs safely. If stocks are low, raising the quota gives short-term jobs but long-term losses. Overall, jobs should be created by processing more fish locally (adding value) rather than by catching more (E)."}]}
  ]},
  { name:"Section B: answer any THREE (60 marks)", choose:3, questions:[
    {id:"q2",theme:4,parts:[
      {l:"(a)(i)",q:"Define a minimum wage.",m:2,cw:"Define",scheme:["The lowest wage (1)","an employer may legally pay a worker (1)"],model:"The lowest wage that an employer is legally allowed to pay a worker."},
      {l:"(a)(ii)",q:"State two wage factors that affect a person's choice of job.",m:2,cw:"State",scheme:["Any two (1 each): basic pay; overtime; bonuses; commission; fringe benefits (housing, car, medical aid)"],model:"Basic pay and overtime pay."},
      {l:"(a)(iii)",q:"Explain why the demand for labour is a derived demand.",m:2,cw:"Explain",scheme:["Firms hire labour to produce goods and services (1)","so demand for labour depends on demand for those products (1)"],model:"Firms only hire workers to make goods, so if demand for the goods rises, demand for workers rises."},
      {l:"(b)",q:"Analyse why workers in the mining industry often earn more than workers in agriculture.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"Wages are set by the demand for and supply of labour (K). Mines in Namibia need skilled workers such as engineers and machine operators (App). These skills need long training, so the supply of such workers is low (link 1). Mining is very profitable and capital-intensive, so each worker produces output of high value (link 2). This makes demand for mine labour high (link 3). Mining unions are strong, so they can bargain for higher pay (link 4). In farming, many unskilled people are available and output per worker is lower, so wages are lower (link 5)."},
      {l:"(c)",q:"Discuss whether raising the national minimum wage will reduce poverty in Namibia.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"A minimum wage is the lowest legal wage (K). For: low-paid workers such as domestic and farm workers earn more, so they can afford food, transport and school costs, which reduces poverty (App, An). Against: if the minimum wage is above the equilibrium wage, firms demand fewer workers and may replace them with machines, so unemployment rises; unemployed people earn nothing, so poverty may rise. Many poor Namibians work in the informal sector where the law is not applied (An). Judgement: it depends on how big the rise is and how profitable firms are. A small rise helps workers without many job losses, but a big rise could hurt the poorest. Overall, a moderate rise together with job creation and training will reduce poverty more than a large rise alone (E)."}]},
    {id:"q3",theme:5,parts:[
      {l:"(a)(i)",q:"Define economies of scale.",m:2,cw:"Define",scheme:["Falling average cost (1)","as a firm increases its scale of output (1)"],model:"The fall in average cost of production as a firm grows larger."},
      {l:"(a)(ii)",q:"State two types of merger.",m:2,cw:"State",scheme:["Any two (1 each): horizontal; vertical (forward/backward); conglomerate"],model:"Horizontal and conglomerate."},
      {l:"(a)(iii)",q:"Explain one reason why small firms survive.",m:2,cw:"Explain",scheme:["Reason (1) + explanation (1), e.g. personal service; serve small/niche or local markets; flexible; government support"],model:"Small firms give personal service, so customers who know the owner keep coming back."},
      {l:"(b)",q:"Analyse how an increase in productivity can increase a firm's profit.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"Productivity is output per worker per period (K). If a bakery in Oshakati trains its workers (App), each worker makes more loaves per hour (link 1). With the same wage bill, output rises, so average cost per loaf falls (link 2). The bakery can keep the price the same and earn more profit per loaf, or lower the price (link 3). A lower price attracts more customers, so sales and total revenue rise (link 4). Since profit = TR − TC, and TR rises faster than TC, profit increases (link 5)."},
      {l:"(c)",q:"Discuss whether a merger between two large supermarket chains in Namibia is good for consumers.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"This is a horizontal merger: two firms at the same stage join (K). Good: the bigger firm gets purchasing economies of scale, buying in bulk at a discount, so it can lower prices; it may also open stores in more towns (App, An). Bad: with fewer rivals, the merged firm has more market power, so it may raise prices and reduce choice; small local suppliers may be squeezed (An). Judgement: it depends on whether the cost savings are passed on to consumers. This is why the Namibian Competition Commission checks mergers. If other strong rivals remain, consumers probably gain; if the merged firm controls most of the market, they will probably lose. Overall, the merger is good only with conditions set by the Competition Commission (E)."}]},
    {id:"q4",theme:3,parts:[
      {l:"(a)(i)",q:"Define price elasticity of demand.",m:2,cw:"Define",scheme:["The responsiveness of quantity demanded (1)","to a change in the good's price (1)"],model:"How much the quantity demanded responds to a change in the price of the good."},
      {l:"(a)(ii)",q:"State two factors that affect price elasticity of demand.",m:2,cw:"State",scheme:["Any two (1 each): number/closeness of substitutes; necessity vs luxury; % of income; habit; time period; definition of the product"],model:"Number of substitutes and the % of income spent on the good."},
      {l:"(a)(iii)",q:"The price of a taxi trip rises from N$14 to N$16 and trips fall from 1 000 to 950 a day. Calculate PED.",m:2,cw:"Calculate",scheme:["%ΔQd = −5%; %ΔP = 14.29% (1)","PED = −5 ÷ 14.29 = −0.35 (1)"],model:"%ΔQd = −50 ÷ 1 000 × 100 = −5%. %ΔP = 2 ÷ 14 × 100 = 14.29%. PED = −5 ÷ 14.29 = −0.35 (inelastic)."},
      {l:"(b)",q:"Analyse how a government subsidy to bread producers would affect the market for bread. You may use a diagram.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE.concat(["Diagram (if drawn): labelled axes, D and S1/S2, S shifts RIGHT, new lower P2 and higher Q2."]),model:"A subsidy is money paid by the government to producers (K). Bakeries in Namibia receive money per loaf (App). This lowers their costs of production (link 1). Firms are willing to supply more at every price, so supply shifts right from S1 to S2 (link 2). At the old price there is now excess supply, so the price falls (link 3). The lower price causes an extension of demand: quantity demanded rises (link 4). The new equilibrium has a lower price P2 and a higher quantity Q2, so poor households can afford more bread (link 5)."},
      {l:"(c)",q:"Discuss whether a firm should lower its price to increase its revenue.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"Total revenue = price × quantity (K). For lowering price: if demand is price elastic, e.g. a brand of soft drink with many substitutes in a Windhoek supermarket (App), a 10% price cut may raise quantity by 20%, so total revenue rises (An). Against: if demand is inelastic, e.g. for petrol or bread, quantity rises by only a small %, so total revenue falls. Rivals may also cut their prices (a price war), so the firm gains no extra customers. A lower price may also reduce profit if costs rise with output (An). Judgement: it depends on the price elasticity of demand. The firm should only cut its price if PED is greater than 1 and rivals are unlikely to follow. For necessities with few substitutes, raising the price would increase revenue instead (E)."}]},
    {id:"q5",theme:8,parts:[
      {l:"(a)(i)",q:"Define standard of living.",m:2,cw:"Define",scheme:["The level of welfare / material well-being (1)","of people, e.g. income, goods and services, health, education (1)"],model:"The level of welfare or material comfort that people enjoy, such as income, health and education."},
      {l:"(a)(ii)",q:"State two features of a developing economy.",m:2,cw:"State",scheme:["Any two (1 each): low GDP per capita; large primary sector; high birth rate/population growth; young population; lower life expectancy/literacy; poor infrastructure; high inequality"],model:"High population growth and a large primary sector."},
      {l:"(a)(iii)",q:"Explain one limitation of using GDP per capita to compare living standards.",m:2,cw:"Explain",scheme:["Limitation (1) + explanation (1), e.g. it is an average and ignores inequality: in Namibia many people earn far below the average; ignores informal sector; ignores quality of life/environment"],model:"It is an average, so it ignores inequality. In Namibia, a few people earn very high incomes while many earn very little, so GDP per capita makes most people look richer than they are."},
      {l:"(b)",q:"Analyse how rapid population growth can affect a developing economy.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"Population growth depends on the birth rate, the death rate and migration (K). In Namibia many people move to Windhoek (App). A fast-growing population needs more schools, clinics and water (link 1). The government must spend more on these, which leaves less for investment in roads and industry (link 2). Many young people enter the labour market each year, but there are not enough jobs, so unemployment rises (link 3). Informal settlements grow because housing is not built fast enough (link 4). If output grows more slowly than population, GDP per capita falls, so living standards fall (link 5)."},
      {l:"(c)",q:"Discuss whether the HDI is a better measure of development than GDP per capita.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"The HDI combines life expectancy, years of schooling and GNI per capita (K). For HDI: it shows more than income. Namibia has an upper-middle income per head but only a medium HDI, because life expectancy and schooling are lower; this gives a truer picture of how people live (App, An). Against: HDI still uses averages, so it does not show Namibia's very high inequality; it ignores the environment, housing quality and freedom; and data can be hard to collect (An). Judgement: it depends on the purpose. To compare total output or market size, GDP per capita is useful. To compare how well people live, the HDI is better because health and education matter. Overall the HDI is the better measure, but it should be used together with an inequality measure such as the Gini coefficient (E)."}]},
    {id:"q6",theme:6,parts:[
      {l:"(a)(i)",q:"Define inflation.",m:2,cw:"Define",scheme:["A sustained / continuous rise (1)","in the general price level (1)"],model:"A sustained rise in the general price level over time."},
      {l:"(a)(ii)",q:"State two effects of inflation.",m:2,cw:"State",scheme:["Any two (1 each): lower purchasing power; fixed-income groups lose; savers lose; borrowers gain; exports less competitive; uncertainty; menu costs"],model:"People on fixed incomes can buy less, and exports become less competitive."},
      {l:"(a)(iii)",q:"Explain why the Bank of Namibia usually follows the South African Reserve Bank's interest rate.",m:2,cw:"Explain",scheme:["The N$ is pegged 1:1 to the rand (CMA) (1)","if Namibian rates are much lower, money flows to South Africa, putting pressure on reserves / the peg (1)"],model:"The N$ is pegged one-to-one to the rand. If Namibia's interest rates were much lower, savers and investors would move money to South Africa, reducing Namibia's foreign reserves and putting the peg at risk."},
      {l:"(b)",q:"Analyse how a rise in the repo rate can reduce inflation.",m:7,cw:"Analyse",scheme:RUBRIC7_ANALYSE,model:"The repo rate is the rate at which the Bank of Namibia lends to commercial banks (K). If it rises from 7% to 7.5% (App), banks such as FNB raise their lending rates (link 1). Loans, mortgages and credit cards cost more, so households borrow and spend less (link 2). Saving earns more, so people save instead of spend (link 3). Firms also invest less because loans are dearer (link 4). Aggregate demand falls, so firms cannot raise prices as easily and the rate of inflation falls (link 5)."},
      {l:"(c)",q:"Discuss whether higher interest rates are good for the Namibian economy.",m:7,cw:"Discuss",scheme:RUBRIC7_DISCUSS,model:"An interest rate is the cost of borrowing and the reward for saving (K). Good: higher rates reduce demand-pull inflation, so prices are more stable and the poor keep their purchasing power; savers and pensioners earn more; it protects the N$ peg with the rand (App, An). Bad: loans cost more, so firms invest less and households with mortgages have less to spend; growth slows and unemployment, already high in Namibia, may rise (An). Judgement: it depends on the cause of inflation and the state of the economy. If inflation is caused by high demand, higher rates work well. If it is cost-push inflation from fuel prices, higher rates hurt growth without solving the cause. Overall, higher rates are good only for a short time when inflation is high and caused by demand (E)."}]}
  ]}
]}
];

<script>
/* =====================================================================
   APP CODE: you do not need to change anything below to add questions.
   ===================================================================== */
(function(){
"use strict";
var KEY = "nssco_econ_v1";
var EXAM_DATE = new Date(2026, 10, 11, 8, 0, 0); // 11 Nov 2026, 08:00 local time

function blank(){ return {v:1, tab:"dash", flash:{}, quiz:{}, quizWrong:{}, written:{}, exams:[], drafts:{}, active:null}; }
var S = blank();
try {
  var raw = localStorage.getItem(KEY);
  if (raw) { var o = JSON.parse(raw); if (o && o.v === 1) { S = Object.assign(blank(), o); } }
} catch (e) { /* storage blocked: app still works, progress not kept */ }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function $(s, r){ return (r || document).querySelector(s); }
function $all(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ var d = new Date(iso); return d.toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"}); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function themeById(id){ for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return THEMES[i]; return null; }
function band(p){ return p >= 80 ? "green" : p >= 50 ? "amber" : "red"; }
function grade(p){ var g = [[90,"A*"],[80,"A"],[70,"B"],[60,"C"],[50,"D"],[40,"E"],[30,"F"],[20,"G"]]; for (var i = 0; i < g.length; i++) if (p >= g[i][0]) return g[i][1]; return "U"; }

/* ---------- Diagrams (SVG) ---------- */
function svgDia(name){
  var d = DIAGRAMS[name]; if (!d) return "";
  function X(x){ return (50 + x * 2.6).toFixed(1); }
  function Y(y){ return (225 - y * 2.05).toFixed(1); }
  var s = '<figure class="dia"><svg viewBox="0 0 330 270" role="img" aria-label="' + esc(d.caption) + '" font-family="system-ui,sans-serif" font-size="12">';
  s += '<defs><marker id="ah-' + name + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>';
  s += '<line x1="50" y1="225" x2="50" y2="12" stroke="#111" stroke-width="2"/><line x1="50" y1="225" x2="310" y2="225" stroke="#111" stroke-width="2"/>';
  s += '<text x="14" y="120" transform="rotate(-90 14 120)" text-anchor="middle" font-weight="700">' + esc(d.y) + '</text>';
  s += '<text x="180" y="262" text-anchor="middle" font-weight="700">' + esc(d.x) + '</text><text x="42" y="238" text-anchor="middle">0</text>';
  (d.lines || []).forEach(function(l){
    var c = l.color || "#111827";
    s += '<line x1="' + X(l.a[0]) + '" y1="' + Y(l.a[1]) + '" x2="' + X(l.b[0]) + '" y2="' + Y(l.b[1]) + '" stroke="' + c + '" stroke-width="2.5"/>';
    s += '<text x="' + (+X(l.b[0]) + 4) + '" y="' + (+Y(l.b[1]) + (l.b[1] > l.a[1] ? 2 : 12)) + '" fill="' + c + '" font-weight="700">' + esc(l.label) + '</text>';
  });
  if (d.quarter){
    var r = d.quarter, pts = [];
    for (var t = 0; t <= 90; t += 3){ var rad = t * Math.PI / 180; pts.push(X(r * Math.sin(rad)) + "," + Y(r * Math.cos(rad))); }
    s += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><text x="' + X(r * 0.78) + '" y="' + Y(r * 0.72) + '" fill="#1d4ed8" font-weight="700">PPC</text>';
  }
  if (d.wave){
    var wp = [];
    for (var x = 0; x <= 95; x += 1){ wp.push(X(x) + "," + Y(30 + 0.4 * x + 15 * Math.sin(2 * Math.PI * (x - 5) / 50))); }
    s += '<line x1="' + X(0) + '" y1="' + Y(30) + '" x2="' + X(95) + '" y2="' + Y(68) + '" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>';
    s += '<polyline points="' + wp.join(" ") + '" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>';
  }
  (d.hlines || []).forEach(function(h){
    s += '<line x1="' + X(0) + '" y1="' + Y(h.y) + '" x2="' + X(92) + '" y2="' + Y(h.y) + '" stroke="#b91c1c" stroke-width="2"/>';
    s += '<text x="' + X(92) + '" y="' + (+Y(h.y) - 5) + '" text-anchor="end" fill="#b91c1c" font-weight="700">' + esc(h.label) + '</text>';
  });
  (d.points || []).forEach(function(p){
    if (p.p){ s += '<line x1="' + X(0) + '" y1="' + Y(p.y) + '" x2="' + X(p.x) + '" y2="' + Y(p.y) + '" stroke="#6b7280" stroke-dasharray="4 3"/><text x="45" y="' + (+Y(p.y) + 4) + '" text-anchor="end" font-weight="700">' + esc(p.p) + '</text>'; }
    if (p.q){ s += '<line x1="' + X(p.x) + '" y1="' + Y(0) + '" x2="' + X(p.x) + '" y2="' + Y(p.y) + '" stroke="#6b7280" stroke-dasharray="4 3"/><text x="' + X(p.x) + '" y="240" text-anchor="middle" font-weight="700">' + esc(p.q) + '</text>'; }
    s += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="3.5" fill="#111827"/>';
    if (p.label){ s += '<text x="' + (+X(p.x) + 6) + '" y="' + (+Y(p.y) - 6) + '" font-weight="700">' + esc(p.label) + '</text>'; }
  });
  (d.arrows || []).forEach(function(a){
    s += '<line x1="' + X(a.a[0]) + '" y1="' + Y(a.a[1]) + '" x2="' + X(a.b[0]) + '" y2="' + Y(a.b[1]) + '" stroke="#b45309" stroke-width="2.5" marker-end="url(#ah-' + name + ')"/>';
  });
  (d.texts || []).forEach(function(t){ s += '<text x="' + X(t.x) + '" y="' + Y(t.y) + '" text-anchor="middle" font-weight="700" fill="#374151">' + esc(t.t) + '</text>'; });
  s += '</svg><figcaption>' + esc(d.caption) + '</figcaption></figure>';
  return s;
}
function withDiagrams(html){ return html.replace(/\[\[dia:(\w+)\]\]/g, function(m, n){ return svgDia(n); }); }

/* ---------- Stats ---------- */
function themeStats(t){
  var cards = FLASHCARDS[t] || [], got = 0, rated = 0, again = 0;
  cards.forEach(function(c, i){ var v = S.flash[t + "-" + i]; if (v){ rated++; if (v === "got") got++; else again++; } });
  var flashPct = rated ? got / cards.length * 100 : null;
  var q = S.quiz[t]; var quizPct = q ? q.best : null;
  var wm = 0, wx = 0;
  Object.keys(S.written).forEach(function(k){ var w = S.written[k]; if (w.t === t){ wm += w.mark; wx += w.max; } });
  var writtenPct = wx ? wm / wx * 100 : null;
  var parts = [[quizPct, .4], [flashPct, .3], [writtenPct, .3]], sum = 0, wsum = 0;
  parts.forEach(function(p){ if (p[0] !== null){ sum += p[0] * p[1]; wsum += p[1]; } });
  return {ready: wsum ? Math.round(sum / wsum) : 0, started: wsum > 0, quizPct: quizPct, flashPct: flashPct, writtenPct: writtenPct, again: again, got: got, total: cards.length};
}

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Scores over time" font-family="system-ui,sans-serif" font-size="11" style="width:100%;max-width:520px">';

      var id = t.id + "-" + i;

function examById(id){ for (var i = 0; i < EXAMS.length; i++) if (EXAMS[i].id === id) return EXAMS[i]; return null; }
function pid(ex, q, k){ return ex.id + "." + q.id + "." + k; }
function includedQuestions(ex){
  var out = [];
  ex.sections.forEach(function(sec){ sec.questions.forEach(function(q){ if (!sec.choose || S.active.chosen.indexOf(q.id) >= 0) out.push(q); }); });
  return out;
}
function examScore(ex){

  return {score: sc, unmarked: unmarked};
}

}

    var bestP = past.length ? Math.max.apply(null, past.map(function(e){ return Math.round(e.score / e.max * 100); })) : null;
    h += '<div class="card"><h3>' + esc(ex.title) + '</h3><p class="small">' + ex.minutes + ' minutes · ' + ex.total + ' marks</p>'
      + '<p class="small muted">' + (bestP === null ? "Not tried yet." : "Best: " + bestP + "% (grade " + grade(bestP) + ") · " + past.length + " attempt(s)") + '</p>'
      + '<div class="row"><button class="btn" data-start="' + ex.id + '" data-timed="1">Start timed</button><button class="btn ghost" data-start="' + ex.id + '" data-timed="0">Practise untimed</button></div></div>';
  });
  h += '<div class="card"><h3>Approximate grades</h3><p class="small">A* 90%+ · A 80% · B 70% · C 60% · D 50% · E 40% · F 30% · G 20%. These are a guide only; real boundaries are set each year.</p></div>';
  v.innerHTML = h;
  $all("[data-start]", v).forEach(function(b){ b.onclick = function(){
    S.active = {id: b.dataset.start, start: Date.now(), timed: b.dataset.timed === "1", chosen: [], marks: {}, revealed: {}, paper: {}};
    timesUpShown = false; save(); renderers.exam();
  }; });
};

function renderActiveExam(v){
  var a = S.active, ex = examById(a.id);
  var h = '<div class="timer"><span><b id="examTimer">' + timerText() + '</b></span><span class="small" id="runTotal"></span></div>';
  h += '<h2>' + esc(ex.title) + '</h2><div class="card"><p>' + esc(ex.intro) + '</p><p class="small muted">Write your answer first. The mark scheme opens only after you write something (or tap "I answered on paper"). Mark honestly using the rubric in Exam technique.</p></div>';
  var qnum = 0;
  ex.sections.forEach(function(sec){
    h += '<h3>' + esc(sec.name) + '</h3>';
    if (sec.choose) h += '<p class="small"><b>Choose ' + sec.choose + '.</b> Tick the questions you answer. Only ticked questions count. Chosen: <b id="chosenCount">' + a.chosen.length + '</b>/' + sec.choose + '</p>';
    sec.questions.forEach(function(q){
      var on = !sec.choose || a.chosen.indexOf(q.id) >= 0, th = themeById(q.theme); qnum++;
      var qmax = q.parts.reduce(function(s, p){ return s + p.m; }, 0);
      h += '<div class="q' + (on ? "" : " off") + '" id="q-' + q.id + '"><div class="row" style="justify-content:space-between"><b>Question ' + qnum + ' <span class="pill">Theme ' + q.theme + ': ' + esc(th.short) + '</span></b><span class="small">[' + qmax + ' marks]</span></div>';
      if (sec.choose) h += '<label class="check"><input type="checkbox" data-choose="' + q.id + '"' + (on ? " checked" : "") + '> I am answering this question</label>';
      if (q.stem) h += '<div class="stem">' + q.stem + '</div>';
      q.parts.forEach(function(p, k){
        var id = pid(ex, q, k), draft = S.drafts[id] || "", rev = !!a.revealed[id], mk = a.marks[id];
        h += '<div class="part" data-pid="' + id + '"><p class="pq"><span class="marks">[' + p.m + ']</span>' + esc(p.l) + ' ' + esc(p.q) + '</p>';
        h += '<textarea data-draft="' + id + '" aria-label="Your answer to ' + esc(p.l) + '" placeholder="Write your answer here…">' + esc(draft) + '</textarea>';
        if (!rev){
          h += '<div class="row"><button class="btn" data-reveal="' + id + '"' + ((draft.trim().length >= 3 || a.paper[id]) ? "" : " disabled") + '>Reveal mark scheme</button><button class="btn ghost" data-paper="' + id + '">I answered on paper</button></div>';
        } else {
          h += '<div class="scheme"><h5>Mark scheme (' + esc(p.cw) + ', ' + p.m + ' marks)</h5><ul>' + p.scheme.map(function(s){ return "<li>" + esc(s) + "</li>"; }).join("") + '</ul></div>';
          h += '<div class="model"><b>Model answer:</b> ' + esc(p.model) + '</div>';
          h += '<p class="small"><b>Your mark:</b></p><div class="markpick" role="group" aria-label="Choose your mark">';
          for (var m = 0; m <= p.m; m++) h += '<button data-mark="' + id + '" data-m="' + m + '" aria-pressed="' + (mk === m) + '">' + m + '</button>';
          h += '</div>';
        }
        h += '</div>';
      });
      h += '</div>';
    });
  });
  h += '<div class="card"><p id="finishInfo"></p><div class="row"><button class="btn good" id="exFinish">Finish and save</button><button class="btn warn" id="exQuit">Quit without saving</button></div></div>';
  v.innerHTML = h;
  updateTotals();
  $all("textarea[data-draft]", v).forEach(function(t){ t.oninput = function(){
    var id = t.dataset.draft; S.drafts[id] = t.value; save();
    var rb = $('[data-reveal="' + id + '"]', v); if (rb) rb.disabled = !(t.value.trim().length >= 3 || S.active.paper[id]);
  }; });
  $all("[data-paper]", v).forEach(function(b){ b.onclick = function(){ S.active.paper[b.dataset.paper] = true; save(); var rb = $('[data-reveal="' + b.dataset.paper + '"]', v); if (rb) rb.disabled = false; }; });
  $all("[data-reveal]", v).forEach(function(b){ b.onclick = function(){ var id = b.dataset.reveal; S.active.revealed[id] = true; save(); rerenderKeepScroll(id); }; });
  $all("[data-mark]", v).forEach(function(b){ b.onclick = function(){
    S.active.marks[b.dataset.mark] = +b.dataset.m; save();
    $all('[data-mark="' + b.dataset.mark + '"]', v).forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    updateTotals();
  }; });
  $all("[data-choose]", v).forEach(function(c){ c.onchange = function(){
    var sec = null; ex.sections.forEach(function(s){ if (s.choose) sec = s; });
    var arr = S.active.chosen, i = arr.indexOf(c.dataset.choose);
    if (c.checked){ if (arr.length >= sec.choose){ c.checked = false; alert("You can only answer " + sec.choose + " questions in this section. Untick one first."); return; } arr.push(c.dataset.choose); }
    else if (i >= 0) arr.splice(i, 1);
    save();
    $("#q-" + c.dataset.choose).classList.toggle("off", !c.checked);
    var cc = $("#chosenCount"); if (cc) cc.textContent = arr.length;
    updateTotals();
  }; });
  $("#exQuit").onclick = function(){ if (confirm("Quit this paper? Your marks for this attempt will not be saved.")){ clearDrafts(ex); S.active = null; save(); renderers.exam(); } };
  $("#exFinish").onclick = function(){
    var r = examScore(ex), chooseSec = ex.sections.filter(function(s){ return s.choose; })[0];
    if (chooseSec && S.active.chosen.length < chooseSec.choose && !confirm("You chose only " + S.active.chosen.length + " of " + chooseSec.choose + " Section B questions. Save anyway?")) return;
    if (r.unmarked && !confirm(r.unmarked + " part(s) have no mark yet and will count as 0. Save anyway?")) return;
    var d = nowISO();
    includedQuestions(ex).forEach(function(q){ q.parts.forEach(function(p, k){
      var id = pid(ex, q, k), m = S.active.marks[id];
      S.written[id] = {t: q.theme, mark: m === undefined ? 0 : m, max: p.m, d: d};
    }); });
    var mins = Math.round((Date.now() - S.active.start) / 60000);
    S.exams.push({id: ex.id, title: ex.title, paper: ex.paper, d: d, score: r.score, max: ex.total, timed: S.active.timed, mins: mins});
    clearDrafts(ex); S.active = null; save();
    var p = Math.round(r.score / ex.total * 100);
    alert("Saved: " + r.score + "/" + ex.total + " (" + p + "%), approximate grade " + grade(p) + ".");
    show("dash");
  };
}
function clearDrafts(ex){ Object.keys(S.drafts).forEach(function(k){ if (k.indexOf(ex.id + ".") === 0) delete S.drafts[k]; }); }
function rerenderKeepScroll(id){
  var el = document.querySelector('[data-pid="' + id + '"]'), top = el ? el.getBoundingClientRect().top : 0;
  renderActiveExam($("#view-exam"));
  var el2 = document.querySelector('[data-pid="' + id + '"]');
  if (el2) window.scrollBy(0, el2.getBoundingClientRect().top - top);
}
function updateTotals(){
  var ex = examById(S.active.id), r = examScore(ex);
  var rt = $("#runTotal"); if (rt) rt.textContent = "Marks so far: " + r.score + "/" + ex.total;
  var fi = $("#finishInfo"); if (fi) fi.innerHTML = "Current total: <b>" + r.score + "/" + ex.total + "</b> (" + Math.round(r.score / ex.total * 100) + "%, approx. grade " + grade(Math.round(r.score / ex.total * 100)) + "). Unmarked parts: " + r.unmarked + ".";
}

/* ---------- Exam technique ---------- */
renderers.tech = function(){
  $("#view-tech").innerHTML = TECHNIQUE_HTML;
};
var TECHNIQUE_HTML = '<h2>Exam technique</h2>'
+ '<div class="card"><h3>Command words</h3><div class="tablewrap"><table><tr><th>Word</th><th>What to do</th><th>Example answer shape</th></tr>'
+ '<tr><td><b>State / Identify / Give</b></td><td>A short point. No explanation needed.</td><td>"Bulk buying."</td></tr>'
+ '<tr><td><b>Define</b></td><td>The precise meaning of the term.</td><td>"Opportunity cost is the next best alternative given up when a choice is made."</td></tr>'
+ '<tr><td><b>Calculate</b></td><td>Formula → working → exact answer with unit or % sign.</td><td>"PED = −10 ÷ 25 = −0.4"</td></tr>'
+ '<tr><td><b>Explain</b></td><td>Point + <b>because</b> (a reason).</td><td>"Demand rises <i>because</i> incomes rise, so people can afford more."</td></tr>'
+ '<tr><td><b>Analyse</b></td><td>A <b>chain</b> of cause and effect. Aim for 5 links.</td><td>"A → so B → so C → so D → so E."</td></tr>'
+ '<tr><td><b>Discuss</b></td><td>Both sides (for and against).</td><td>"On one hand… On the other hand…"</td></tr>'
+ '<tr><td><b>Evaluate</b></td><td>Both sides + a <b>justified judgement</b>.</td><td>"…It depends on… so overall…"</td></tr>'
+ '<tr><td><b>Distinguish</b></td><td>Define both terms and show the difference.</td><td>"A direct tax is… whereas an indirect tax is…"</td></tr>'
+ '<tr><td><b>Draw</b></td><td>A fully labelled diagram.</td><td>Axes, curves, equilibrium, shift arrows.</td></tr>'
+ '</table></div></div>'
+ '<div class="card"><h3>Chains of reasoning</h3><p>Each link must <b>cause</b> the next. Use linking words: <b>because, so, therefore, this leads to, as a result</b>.</p>'
+ '<div class="box ex"><b>Question:</b> Analyse how a rise in the repo rate can reduce inflation.<br>'
+ '1. The Bank of Namibia raises the repo rate →<br>2. so commercial banks raise their lending rates →<br>3. so loans cost more and households borrow and spend less →<br>4. so aggregate demand falls →<br>5. so firms cannot raise prices as fast, and <b>inflation falls</b>.</div>'
+ '<div class="box tip"><b>Weak answer:</b> "Higher interest rates reduce inflation because people spend less." (one link only)<br><b>Strong answer:</b> all 5 links above, with a Namibian example.</div></div>'
+ '<div class="card"><h3>Marking rubric for long answers</h3><p>Long answers are marked on four skills:</p>'
+ '<div class="tablewrap"><table><tr><th>Skill</th><th>Meaning</th></tr>'
+ '<tr><td><b>Knowledge (K)</b></td><td>Correct definitions and terms.</td></tr>'
+ '<tr><td><b>Application (A)</b></td><td>Use the case, data or a Namibian example.</td></tr>'
+ '<tr><td><b>Analysis (An)</b></td><td>Chains of cause and effect.</td></tr>'
+ '<tr><td><b>Evaluation (E)</b></td><td>Weigh both sides and make a supported judgement.</td></tr></table></div>'
+ '<h4>7-mark Discuss / Evaluate</h4><div class="tablewrap"><table><tr><th>K</th><th>A</th><th>An</th><th>E</th></tr><tr><td>1</td><td>1</td><td>3</td><td>2</td></tr></table></div>'
+ '<ul><li>You <b>must</b> give both sides.</li><li>The judgement must <b>weigh</b> the sides: "It depends on… If… then… So overall…".</li><li>A third one-sided point is <b>not</b> evaluation and gets no E marks.</li></ul>'
+ '<h4>7-mark Explain / Analyse</h4><div class="tablewrap"><table><tr><th>K</th><th>A</th><th>An</th></tr><tr><td>1</td><td>1</td><td>5 (one per link)</td></tr></table></div>'
+ '<div class="box ex"><b>Evaluation starter:</b> "Overall, X is likely to be more important than Y <b>because</b>… However, this depends on… In the short run… but in the long run…"</div></div>'
+ '<div class="card"><h3>Diagrams: what loses marks</h3><ul><li>Axes not labelled (use <b>Price</b> and <b>Quantity</b>).</li><li>Curves not labelled (D, S, D1, D2, S1, S2).</li><li>No equilibrium points (P1, Q1, P2, Q2).</li><li>Shift in the wrong direction (a decrease in supply moves S to the <b>left</b>).</li><li>Drawing a shift when only the own price changed (that is a <b>movement along</b>).</li></ul><p>Draw with a ruler, make it large, and refer to it in your writing ("as shown in the diagram, price rises from P1 to P2").</p></div>'
+ '<div class="card"><h3>Calculations</h3><ol><li>Write the <b>formula</b>.</li><li>Show the <b>working</b> with the numbers.</li><li>Give the <b>exact final answer</b> with the <b>unit (N$, units) or % sign</b>.</li></ol><p>Round only at the end (2 decimal places unless told otherwise). Even if the final answer is wrong, the formula and working can earn marks.</p></div>'
+ '<div class="card"><h3>Time plan</h3><ul><li><b>Paper 1 (150 min, 80 marks):</b> about 1.8 minutes per mark. Section A ≈ 70 min, each Section B question ≈ 35 min, 10 min to check.</li>'
+ '<li><b>Paper 2 (120 min, 80 marks):</b> 1.5 minutes per mark. Q1 ≈ 28 min, each chosen question ≈ 28 min, 8 min to read and choose.</li>'
+ '<li>Look at the marks: 2 marks = two short points; 7 marks = a full paragraph with a chain or both sides.</li></ul></div>';

/* ---------- Start ---------- */
show(renderers[S.tab] ? S.tab : "dash");
})();
</script>
