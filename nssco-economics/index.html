<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSSCO Economics Study Dashboard</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#4b5563; --line:#d1d5db;
  --brand:#1d4ed8; --brand-soft:#e0e7ff; --red:#b91c1c; --red-soft:#fee2e2;
  --amber:#b45309; --amber-soft:#fef3c7; --green:#15803d; --green-soft:#dcfce7;
  --radius:12px; --tap:48px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header.top{background:var(--brand);color:#fff;padding:12px 16px}
header.top h1{margin:0;font-size:1.15rem}
header.top p{margin:2px 0 0;font-size:.85rem;opacity:.9}
nav.tabs{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;min-height:var(--tap);padding:0 16px;border:0;background:none;font:600 1rem system-ui,sans-serif;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:920px;margin:0 auto;padding:16px}
section.view{display:none}
section.view.active{display:block}
h2{font-size:1.35rem;margin:8px 0 12px}
h3{font-size:1.12rem;margin:20px 0 8px}
h4{font-size:1rem;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:var(--tap);padding:0 18px;border-radius:10px;border:2px solid var(--brand);background:var(--brand);color:#fff;font:600 1rem system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.good{background:var(--green);border-color:var(--green)}
.btn.bad{background:var(--red);border-color:var(--red)}
.btn.warn{background:#fff;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--line);background:#fff;font:600 .95rem system-ui,sans-serif;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:.95rem}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#eef2ff}
.tablewrap{overflow-x:auto}
.box{border-left:5px solid var(--brand);background:var(--brand-soft);padding:10px 12px;border-radius:8px;margin:10px 0}
.box.fix{border-color:var(--red);background:var(--red-soft)}
.box.fix::before{content:"Correction: ";font-weight:700;color:var(--red)}
.box.tip{border-color:var(--green);background:var(--green-soft)}
.box.ex{border-color:var(--amber);background:var(--amber-soft)}
.calc{background:#fff;border:2px dashed var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;font-variant-numeric:tabular-nums}
.calc b.ans{color:var(--green)}
ol.steps li,ul li{margin:3px 0}
figure.dia{margin:10px 0;text-align:center}
figure.dia svg{width:100%;max-width:380px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
figure.dia figcaption{font-size:.85rem;color:var(--muted)}
/* dashboard */
.countdown{display:flex;gap:10px;flex-wrap:wrap}
.countdown div{flex:1 1 70px;background:var(--brand-soft);border-radius:10px;padding:10px;text-align:center}
.countdown b{display:block;font-size:1.8rem;color:var(--brand);line-height:1.1}
.bar{height:14px;background:#e5e7eb;border-radius:7px;overflow:hidden}
.bar span{display:block;height:100%}
.r-red{background:var(--red)} .r-amber{background:#d97706} .r-green{background:var(--green)}
.t-red{color:var(--red)} .t-amber{color:var(--amber)} .t-green{color:var(--green)}
.ready-row{margin:10px 0}
.ready-row .lab{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;margin-bottom:3px}
.big{font-size:2.2rem;font-weight:800}
/* flashcards */
.flash{min-height:220px;border:2px solid var(--brand);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;font-size:1.15rem;user-select:none}
.flash.back{background:var(--brand-soft)}
.flash .term{font-size:1.5rem;font-weight:800}
/* quiz */
.opt{display:block;width:100%;text-align:left;min-height:var(--tap);padding:10px 14px;margin:8px 0;border:2px solid var(--line);border-radius:10px;background:#fff;font:1rem system-ui,sans-serif;color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.feedback{padding:10px 12px;border-radius:8px;margin-top:8px}
.feedback.ok{background:var(--green-soft)} .feedback.no{background:var(--red-soft)}
/* exams */
.timer{position:sticky;top:48px;z-index:15;background:#111827;color:#fff;border-radius:10px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.timer b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.timer.low b{color:#fca5a5}
.q{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:14px;margin:0 0 14px}
.q.off{opacity:.55}
.q .stem{background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.part{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.part .pq{font-weight:600}
.marks{float:right;font-weight:700;color:var(--brand);margin-left:8px}
textarea{width:100%;min-height:110px;font:1rem/1.5 system-ui,sans-serif;padding:10px;border:2px solid var(--line);border-radius:8px;margin:8px 0;resize:vertical}
textarea:focus,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.scheme{background:var(--green-soft);border-radius:8px;padding:10px 12px;margin:8px 0}
.scheme h5{margin:0 0 4px;font-size:.95rem}
.model{background:#f0f9ff;border-radius:8px;padding:10px 12px;margin:8px 0}
.markpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.markpick button{min-width:46px;min-height:46px;border:2px solid var(--line);border-radius:10px;background:#fff;font:700 1rem system-ui,sans-serif;cursor:pointer}
.markpick button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.pill{display:inline-block;padding:1px 9px;border-radius:12px;font-size:.8rem;font-weight:700;background:#e5e7eb;color:var(--ink)}
.hist td,.hist th{font-size:.9rem}
select{min-height:var(--tap);font:1rem system-ui,sans-serif;padding:0 10px;border:2px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
label.check{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:600}
label.check input{width:24px;height:24px}
.hide{display:none!important}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 16px 40px}
@media (min-width:700px){body{font-size:17.5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
@media print{nav.tabs,.timer,.btn{display:none}}
</style>

<script>
/* =====================================================================
   DATA SECTION: edit this part to add content.
   - THEMES: the 9 syllabus themes (id 1-9). Notes are HTML strings.
     Write [[dia:NAME]] to insert a diagram from DIAGRAMS.
   - FLASHCARDS, QUIZZES, EXAMS are defined further down.
   ===================================================================== */
const THEMES = [
{ id:1, name:"The basic economic problem", short:"Basic problem", notes:`
<h3>1. Scarcity and choice</h3>
<ul>
<li><b>Economic problem:</b> wants are unlimited but resources are limited (scarce).</li>
<li><b>Scarcity</b> forces <b>choice</b>. Every choice has an <b>opportunity cost</b>.</li>
<li><b>Opportunity cost:</b> the next best alternative given up when a choice is made.</li>
<li>Example: the Government of Namibia spends N$500 million on a new hospital. The opportunity cost is the next best use, e.g. building new schools.</li>
<li><b>Needs</b> = things required to survive (food, water, shelter). <b>Wants</b> = things we would like to have.</li>
<li><b>Economic goods</b> are scarce and have an opportunity cost. <b>Free goods</b> (e.g. air, sunlight) are not scarce and have no opportunity cost.</li>
</ul>
<h3>2. Factors of production and their rewards</h3>
<div class="tablewrap"><table>
<tr><th>Factor</th><th>Meaning</th><th>Namibian example</th><th>Reward</th></tr>
<tr><td>Land</td><td>Natural resources</td><td>Diamonds, uranium, fish, farmland</td><td>Rent</td></tr>
<tr><td>Labour</td><td>Human effort, physical and mental</td><td>Miners at Rössing, teachers</td><td>Wages / salaries</td></tr>
<tr><td>Capital</td><td>Man-made goods used to produce other goods</td><td>Fishing trawlers, machines, factories</td><td>Interest</td></tr>
<tr><td>Enterprise</td><td>Organising the other factors and taking risk</td><td>Owner of a guesthouse in Swakopmund</td><td>Profit</td></tr>
</table></div>
<ul>
<li><b>Mobility of labour:</b> <i>occupational</i> (moving between jobs) and <i>geographical</i> (moving between places).</li>
<li>Quality and quantity of factors can change, e.g. education and training improve labour; investment increases capital.</li>
</ul>
<h3>3. Production possibility curve (PPC)</h3>
[[dia:ppc]]
<ul>
<li>A PPC shows the maximum combinations of two goods that can be produced with all resources fully and efficiently used.</li>
<li>Point <b>on</b> the curve (A, B) = efficient. Point <b>inside</b> (C) = unemployed or wasted resources. Point <b>outside</b> (D) = unattainable now.</li>
<li>Moving from A to B: more of one good means less of the other. This is the opportunity cost.</li>
<li>The PPC <b>shifts outward</b> with more or better resources (e.g. new oil discovery, better education, new technology). It shifts inward after disasters or loss of resources.</li>
</ul>
<div class="calc"><b>Calculation: opportunity cost from a PPC</b><br>
Formula: opportunity cost = units of good X given up ÷ units of good Y gained<br>
Working: moving from A (Maize 100, Cattle 20) to B (Maize 70, Cattle 30). Maize given up = 30. Cattle gained = 10. 30 ÷ 10 = 3<br>
<b class="ans">Answer: opportunity cost of 1 unit of cattle = 3 units of maize.</b></div>
<h3>4. Economic systems</h3>
<div class="tablewrap"><table>
<tr><th></th><th>Market economy</th><th>Planned (command) economy</th><th>Mixed economy</th></tr>
<tr><td>Who decides?</td><td>Private sector, through prices</td><td>Government</td><td>Both</td></tr>
<tr><td>Ownership</td><td>Private</td><td>State</td><td>Private and public sectors</td></tr>
<tr><td>Advantages</td><td>Choice, efficiency, innovation, profit motive</td><td>Basic needs for all, less inequality, less unemployment</td><td>Combines benefits; government corrects market failure</td></tr>
<tr><td>Disadvantages</td><td>Inequality, merit goods under-provided, public goods not provided, external costs</td><td>Shortages, little choice, low incentive, slow decisions</td><td>Taxes may be high; government failure possible</td></tr>
</table></div>
<p>Namibia is a <b>mixed economy</b>: private firms (e.g. retail shops) and state-owned enterprises (e.g. NamPower, NamWater).</p>
<h3>5. Market failure</h3>
<ul>
<li><b>Market failure:</b> when the market does not allocate resources efficiently.</li>
<li>Causes: <b>public goods</b> not provided (street lights, national defence: non-excludable, non-rival); <b>merit goods</b> under-consumed (education, health care); <b>demerit goods</b> over-consumed (alcohol, cigarettes); <b>external costs</b> (pollution); <b>monopoly</b> power; immobility of factors.</li>
<li>Government responses: provide public goods, subsidise merit goods, tax demerit goods, regulations, fines, laws against monopoly.</li>
</ul>
<h3>6. Specialisation and division of labour</h3>
<ul>
<li><b>Specialisation:</b> when a person, firm, region or country concentrates on producing one good or service, or a narrow range.</li>
<li><b>Division of labour:</b> production is split into separate tasks, each done by a different worker.</li>
</ul>
<div class="tablewrap"><table>
<tr><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td>Higher output and productivity<br>Workers become skilled faster<br>Less time wasted moving between tasks<br>Use of machines is easier</td><td>Boring, repetitive work, low motivation<br>Workers lack other skills (less occupational mobility)<br>One stoppage can stop the whole line<br>Less variety of products</td></tr>
</table></div>
<p>Countries also specialise: Namibia specialises in mining (diamonds, uranium), fishing and tourism.</p>
`},
{ id:2, name:"Economic organisations and finance", short:"Organisations & finance", notes:`
<h3>1. Types of business organisation</h3>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Owners</th><th>Liability</th><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td>Sole trader</td><td>1 person</td><td>Unlimited</td><td>Easy to start, keeps all profit, quick decisions</td><td>Limited capital, long hours, unlimited liability</td></tr>
<tr><td>Partnership</td><td>2 to 20</td><td>Unlimited (usually)</td><td>More capital and skills, shared work</td><td>Disagreements, profit shared, unlimited liability</td></tr>
<tr><td>Private company (Pty) Ltd</td><td>Shareholders (shares not sold to public)</td><td>Limited</td><td>Limited liability, more capital, continuity</td><td>Cannot sell shares to the public, legal costs</td></tr>
<tr><td>Public company Ltd</td><td>Shareholders (shares sold to public, e.g. on the NSX)</td><td>Limited</td><td>Very large capital, economies of scale</td><td>Must publish accounts, risk of takeover, slow decisions</td></tr>
<tr><td>Co-operative</td><td>Members</td><td>Limited</td><td>Members share benefits, e.g. farmers buy inputs together</td><td>Slow decisions, limited capital</td></tr>
<tr><td>Public corporation / SOE</td><td>Government</td><td>-</td><td>Provides essential services (NamPower, NamWater, TransNamib)</td><td>May be inefficient, needs subsidies</td></tr>
</table></div>
<ul>
<li><b>Limited liability:</b> owners can only lose the money they invested. <b>Unlimited liability:</b> owners can lose personal assets to pay business debts.</li>
<li><b>Multinational company (MNC):</b> a firm with production in more than one country (e.g. a mining MNC in Namibia). Benefits: jobs, tax, investment, skills. Costs: profits sent abroad, may exploit resources, may close quickly.</li>
</ul>
<h3>2. Trade unions</h3>
<ul>
<li><b>Trade union:</b> an organisation of workers formed to protect and improve the pay and working conditions of its members. Example: Mineworkers Union of Namibia (MUN), Namibia National Teachers' Union (NANTU). Umbrella body: NUNW.</li>
<li>Functions: negotiate wages (<b>collective bargaining</b>), improve working conditions, protect jobs, give legal advice, training.</li>
<li>Actions: negotiation, overtime ban, work-to-rule, go-slow, strike.</li>
<li>Strong when: many members, skilled workers, support of public, firm is profitable, demand for the product is inelastic.</li>
<li>Possible bad effects: strikes cut output and exports, wage rises may cause firms to cut jobs or raise prices (cost-push inflation).</li>
</ul>
<h3>3. Money</h3>
<ul>
<li><b>Money:</b> anything generally accepted as a means of payment for goods and services.</li>
<li><b>Barter</b> = swapping goods without money. Problem: needs a <b>double coincidence of wants</b>.</li>
<li><b>Functions:</b> medium of exchange, measure (unit) of value, store of value, standard of deferred payment.</li>
<li><b>Characteristics:</b> acceptable, durable, portable, divisible, homogeneous (uniform), scarce (limited supply), hard to forge.</li>
<li>The Namibia Dollar (N$, code NAD) is pegged 1:1 to the South African rand (Common Monetary Area). The rand is also legal tender in Namibia.</li>
</ul>
<h3>4. Central bank: Bank of Namibia</h3>
<ul>
<li>Issues notes and coins (sole issuer of N$).</li>
<li>Banker to the government.</li>
<li>Banker to the commercial banks; lender of last resort.</li>
<li>Controls monetary policy: sets the <b>repo rate</b> (the rate it lends to commercial banks).</li>
<li>Supervises and regulates commercial banks.</li>
<li>Manages foreign exchange reserves and keeps the N$ peg.</li>
</ul>
<h3>5. Commercial banks</h3>
<p>Examples: Bank Windhoek, First National Bank Namibia, Standard Bank Namibia, Nedbank Namibia.</p>
<ul>
<li>Accept deposits (current, savings, fixed deposit accounts).</li>
<li>Lend money: loans, overdrafts, mortgages.</li>
<li>Payment services: debit cards, EFTs, mobile banking.</li>
<li>Foreign exchange, safe custody, financial advice.</li>
<li>Aim: <b>profit</b>. They earn the difference between interest charged on loans and interest paid on deposits.</li>
</ul>
<h3>6. Stock exchange: Namibian Stock Exchange (NSX)</h3>
<ul>
<li>A market where second-hand shares (and bonds) of public companies are bought and sold. Based in Windhoek.</li>
<li>Helps companies raise capital, gives savers a way to invest, shows confidence in the economy.</li>
<li>Shareholders earn a <b>dividend</b> (share of profit) and may gain if the share price rises (capital gain).</li>
</ul>
<h3>7. Exchange-rate calculations</h3>
<div class="calc"><b>Converting foreign currency to N$</b><br>
Formula: N$ = foreign amount × rate (N$ per 1 unit of foreign currency)<br>
Working: a US tourist changes US$400 when US$1 = N$18.50. 400 × 18.50 = 7 400<br>
<b class="ans">Answer: N$7 400</b></div>
<div class="calc"><b>Converting N$ to foreign currency</b><br>
Formula: foreign amount = N$ amount ÷ rate (N$ per 1 unit)<br>
Working: a Namibian buys a laptop costing N$13 000 from Germany. €1 = N$20.00. 13 000 ÷ 20 = 650<br>
<b class="ans">Answer: €650</b></div>
<div class="box tip">Check your answer: a dollar is worth more than a Namibia dollar, so you get <b>more</b> N$ than US$. If your N$ number is smaller, you divided when you should multiply.</div>
`},
{ id:3, name:"The market system", short:"The market", notes:`
<h3>1. Demand</h3>
<ul>
<li><b>Demand:</b> the quantity of a good that consumers are willing and able to buy at each price over a given period of time. (<b>Effective demand</b> = want + ability to pay.)</li>
<li><b>Law of demand:</b> when price rises, quantity demanded falls (and the other way). The demand curve slopes downward.</li>
</ul>
[[dia:movement]]
<div class="box fix">A change in the good's <b>own price</b> causes a <b>movement along</b> the curve. Call it an <b>extension</b> (price falls, more bought) or a <b>contraction</b> (price rises, less bought) = a <b>change in quantity demanded</b>. Only "an increase/decrease in <b>demand</b>" means the whole curve <b>shifts</b>.</div>
<p><b>Factors that SHIFT demand</b> (not the good's own price):</p>
<ul>
<li>Income (normal goods: income up → demand up; inferior goods: income up → demand down)</li>
<li>Prices of substitutes (price of beef up → demand for chicken up)</li>
<li>Prices of complements (price of cars up → demand for petrol down)</li>
<li>Tastes and fashion, advertising</li>
<li>Population size and age structure</li>
<li>Expectations of future prices, interest rates and credit, taxes on income</li>
</ul>
[[dia:dshift]]
<h3>2. Supply</h3>
<ul>
<li><b>Supply:</b> the quantity of a good that producers are willing and able to sell at each price over a given period of time.</li>
<li><b>Law of supply:</b> when price rises, quantity supplied rises. The supply curve slopes upward.</li>
</ul>
<p><b>Factors that SHIFT supply:</b></p>
<ul>
<li>Costs of production (wages, raw materials, fuel)</li>
<li>Technology and productivity</li>
<li>Weather and natural disasters (drought in Namibia reduces supply of maize and beef)</li>
<li>Indirect taxes (shift left) and subsidies (shift right)</li>
<li>Number of firms, prices of other goods the firm could make</li>
</ul>
<div class="box fix">The good's <b>own price is NOT a factor that shifts supply</b>. A change in price causes a <b>movement along</b> the supply curve (extension or contraction = change in quantity supplied).</div>
[[dia:sshift]]
<h3>3. Equilibrium</h3>
<ul>
<li><b>Equilibrium price:</b> the price where quantity demanded equals quantity supplied. The market "clears".</li>
<li>Price above equilibrium → <b>surplus</b> (excess supply) → price falls. Price below → <b>shortage</b> (excess demand) → price rises.</li>
</ul>
<div class="tablewrap"><table>
<tr><th>Change</th><th>Curve</th><th>Equilibrium price</th><th>Equilibrium quantity</th></tr>
<tr><td>Increase in demand</td><td>D shifts right</td><td>Rises</td><td>Rises</td></tr>
<tr><td>Decrease in demand</td><td>D shifts left</td><td>Falls</td><td>Falls</td></tr>
<tr><td>Increase in supply</td><td>S shifts right</td><td>Falls</td><td>Rises</td></tr>
<tr><td>Decrease in supply</td><td>S shifts left</td><td>Rises</td><td>Falls</td></tr>
</table></div>
<h3>4. Indirect tax and subsidy</h3>
<ul>
<li><b>Indirect tax</b> (e.g. VAT 15%, excise duty on alcohol) raises firms' costs → supply shifts <b>left</b> → price rises, quantity falls.</li>
<li><b>Subsidy:</b> money paid by government to producers to lower costs → supply shifts <b>right</b> → price falls, quantity rises.</li>
<li>The more <b>inelastic</b> the demand, the more of a tax the consumer pays.</li>
</ul>
[[dia:tax]]
<h3>5. Price controls</h3>
[[dia:maxprice]]
<ul>
<li><b>Maximum price</b> (price ceiling) is set <b>below</b> equilibrium to help consumers (e.g. on maize meal or bread). Result: <b>shortage</b>, queues, black markets.</li>
<li><b>Minimum price</b> (price floor) is set <b>above</b> equilibrium to help producers (e.g. a minimum price for farmers' crops; a minimum wage in labour markets). Result: <b>surplus</b>.</li>
</ul>
[[dia:minprice]]
<h3>6. Price elasticity of demand (PED)</h3>
<div class="calc"><b>PED</b><br>
Formula: PED = % change in quantity demanded ÷ % change in price<br>
% change = (new − old) ÷ old × 100<br>
Working: price rises from N$20 to N$25: (25 − 20) ÷ 20 × 100 = +25%. Quantity falls from 400 to 360: (360 − 400) ÷ 400 × 100 = −10%. PED = −10 ÷ 25 = −0.4<br>
<b class="ans">Answer: PED = −0.4 → inelastic (ignore the minus sign when you judge size: 0.4 &lt; 1)</b></div>
<div class="tablewrap"><table>
<tr><th>Value (ignore sign)</th><th>Name</th><th>Meaning</th></tr>
<tr><td>&gt; 1</td><td>Elastic</td><td>Qd changes by a bigger % than price</td></tr>
<tr><td>&lt; 1</td><td>Inelastic</td><td>Qd changes by a smaller % than price</td></tr>
<tr><td>= 1</td><td>Unitary</td><td>Same %</td></tr>
<tr><td>0</td><td>Perfectly inelastic</td><td>Qd does not change</td></tr>
</table></div>
<p><b>Determinants of PED:</b> number and closeness of substitutes; necessity or luxury; % of income spent; habit/addiction; time period; how widely the product is defined.</p>
<h4>Revenue rule (total revenue = price × quantity)</h4>
<div class="tablewrap"><table>
<tr><th>Demand</th><th>Price rises</th><th>Price falls</th></tr>
<tr><td>Elastic</td><td>TR falls</td><td>TR rises</td></tr>
<tr><td>Inelastic</td><td>TR rises</td><td>TR falls</td></tr>
<tr><td>Unitary</td><td>TR unchanged</td><td>TR unchanged</td></tr>
</table></div>
<div class="calc">Check with numbers: P N$20 × Q 400 = N$8 000. P N$25 × Q 360 = N$9 000. TR rose by N$1 000, as the rule predicts for inelastic demand.</div>
<h3>7. Price elasticity of supply (PES)</h3>
<div class="calc"><b>PES</b><br>
Formula: PES = % change in quantity supplied ÷ % change in price<br>
Working: price of fish rises 10%, quantity supplied rises 4%. 4 ÷ 10 = 0.4<br>
<b class="ans">Answer: PES = 0.4 → inelastic supply</b></div>
<p><b>Determinants of PES:</b> time period, spare capacity, stocks held, ease of moving factors, how perishable the good is. Example: fish supply is inelastic in the short run because of fishing quotas and boat capacity.</p>
<h3>8. Market structures</h3>
<div class="tablewrap"><table>
<tr><th>Feature</th><th>Perfect competition</th><th>Monopoly</th><th>Oligopoly</th></tr>
<tr><td>Number of firms</td><td>Very many</td><td>One (dominant)</td><td>A few large firms</td></tr>
<tr><td>Product</td><td>Identical (homogeneous)</td><td>Unique, no close substitutes</td><td>Similar or branded</td></tr>
<tr><td>Barriers to entry</td><td>None</td><td>Very high</td><td>High</td></tr>
<tr><td>Price</td><td><b>Price taker</b></td><td>Price maker</td><td>Prices often similar; non-price competition</td></tr>
<tr><td>Information</td><td>Perfect</td><td>Imperfect</td><td>Imperfect</td></tr>
<tr><td>Example (Namibia)</td><td>Close to it: open-air market vegetable sellers</td><td>NamPower (electricity transmission), NamWater</td><td>Mobile phone networks (e.g. MTC and a few rivals), commercial banks</td></tr>
</table></div>
<p><b>Monopoly</b> advantages: economies of scale, money for research. Disadvantages: higher prices, less choice, less incentive to be efficient.</p>
<h3>9. Advertising</h3>
<ul>
<li><b>Informative</b> advertising gives facts (price, features). <b>Persuasive</b> advertising tries to convince people to buy (brand image).</li>
<li>Aims: increase demand (shift D right) and make demand more <b>inelastic</b> (brand loyalty).</li>
<li>For: informs consumers, creates jobs, funds media. Against: raises costs and prices, can mislead, encourages demerit goods.</li>
</ul>
<h3>10. Pricing policies</h3>
<ul>
<li><b>Price skimming:</b> a high price for a new product, then lowered later (e.g. new phones).</li>
<li><b>Penetration pricing:</b> a low price to enter a market and win customers, then raised.</li>
<li><b>Price discrimination:</b> charging different prices to different groups for the same product (e.g. lower park fees for Namibian residents than for foreign tourists, student fares).</li>
<li><b>Competitive pricing:</b> setting a price close to rivals' prices. <b>Predatory pricing:</b> a very low price to force rivals out. <b>Cost-plus pricing:</b> average cost + a % mark-up.</li>
</ul>
<div class="box fix">Pricing policies such as skimming, penetration and price discrimination need <b>market power</b> (some control over price). They are used by monopolies, oligopolies and firms with branded products. They are <b>not</b> features of <b>perfect competition</b>, where every firm is a price taker and must accept the market price.</div>
`},
{ id:4, name:"Occupation, income and expenditure", short:"Income & spending", notes:`
<h3>1. Choosing an occupation</h3>
<div class="tablewrap"><table>
<tr><th>Wage (financial) factors</th><th>Non-wage factors</th></tr>
<tr><td>Basic pay<br>Overtime, bonuses, commission<br>Fringe benefits (housing, car, medical aid, pension)</td><td>Job satisfaction<br>Working conditions and hours<br>Training and promotion chances<br>Job security<br>Location and travel<br>Holidays, status</td></tr>
</table></div>
<h3>2. Wage determination</h3>
<ul>
<li>In a free market, the wage is set where <b>demand for labour</b> equals <b>supply of labour</b>.</li>
<li>Demand for labour is a <b>derived demand</b>: it comes from demand for the product the worker makes.</li>
<li><b>High wages</b> when demand for the skill is high and supply is low (doctors, engineers, pilots): long training, rare skills, high productivity.</li>
<li><b>Low wages</b> when supply is large and demand is low (unskilled jobs): little training needed, many workers available.</li>
<li>Other influences: trade unions, government minimum wage, discrimination, location, public vs private sector.</li>
<li><b>Minimum wage:</b> the lowest legal wage. Namibia has a national minimum wage and sector minimum wages (e.g. domestic workers, farm workers). It can raise living standards, but if set above equilibrium it may cause unemployment.</li>
</ul>
<h3>3. Why earnings differ</h3>
<p>Skill and qualifications, experience, gender or other discrimination, sector (mining pays more than agriculture), region (Windhoek vs rural), age, trade union strength.</p>
<h3>4. Spending, saving and borrowing</h3>
<ul>
<li><b>Disposable income</b> = income after direct taxes, used to spend or save.</li>
<li><b>Saving</b> = disposable income not spent.</li>
<li>Low-income households spend a <b>bigger %</b> of income on necessities (food, rent) and save little. High-income households save a bigger %.</li>
</ul>
<div class="tablewrap"><table>
<tr><th>Factor</th><th>Effect on spending</th><th>Effect on saving</th><th>Effect on borrowing</th></tr>
<tr><td>Income rises</td><td>Up</td><td>Up</td><td>Up (can repay)</td></tr>
<tr><td>Interest rate rises</td><td>Down</td><td>Up (better reward)</td><td>Down (more expensive)</td></tr>
<tr><td>Consumer confidence falls</td><td>Down</td><td>Up</td><td>Down</td></tr>
<tr><td>Inflation expected</td><td>Up (buy before prices rise)</td><td>Down</td><td>Up</td></tr>
</table></div>
<p>Other influences on saving: age, culture, availability of banks and pension schemes, social security. Other influences on borrowing: ease of credit, cards, confidence, age.</p>
<div class="calc"><b>Simple interest</b><br>
Formula: interest = principal × rate × time (years)<br>
Working: N$5 000 saved at 8% a year for 3 years: 5 000 × 0.08 × 3 = 1 200<br>
<b class="ans">Answer: interest = N$1 200; total = N$6 200</b></div>
<div class="calc"><b>Percentage of income spent</b><br>
Formula: % = spending on item ÷ total income × 100<br>
Working: a household earns N$8 000 a month and spends N$2 400 on food. 2 400 ÷ 8 000 × 100 = 30<br>
<b class="ans">Answer: 30%</b></div>
`},
{ id:5, name:"Production", short:"Production", notes:`
<h3>1. Production and productivity</h3>
<ul>
<li><b>Production:</b> using factors of production to make goods and services that satisfy wants.</li>
<li>Sectors: <b>primary</b> (extracting: mining, fishing, farming), <b>secondary</b> (manufacturing, construction, e.g. fish processing in Walvis Bay), <b>tertiary</b> (services: tourism, banking, transport).</li>
<li><b>Productivity:</b> output per unit of input per period. <b>Labour productivity</b> = total output ÷ number of workers.</li>
<li>Raise productivity by: training, better technology/capital, division of labour, motivation and incentives, better management.</li>
<li><b>Labour-intensive</b> (many workers, e.g. hand craft) vs <b>capital-intensive</b> (many machines, e.g. mining).</li>
</ul>
<div class="calc"><b>Labour productivity</b><br>
Formula: productivity = total output ÷ number of workers<br>
Working: a factory makes 12 000 cans with 40 workers. 12 000 ÷ 40 = 300<br>
<b class="ans">Answer: 300 cans per worker</b></div>
<h3>2. Costs of production</h3>
<ul>
<li><b>Fixed costs (FC):</b> do not change with output (rent, insurance, loan interest).</li>
<li><b>Variable costs (VC):</b> change with output (raw materials, fuel, piece-rate wages).</li>
<li>Total cost: <b>TC = TFC + TVC</b>. Average cost: <b>AC = TC ÷ Q</b>. Also AFC = TFC ÷ Q and AVC = TVC ÷ Q.</li>
</ul>
<h3>3. Revenue and profit</h3>
<ul>
<li>Total revenue: <b>TR = P × Q</b>. Average revenue: <b>AR = TR ÷ Q</b> (= price).</li>
<li>Profit = TR − TC. If TC &gt; TR, it is a <b>loss</b>.</li>
<li>Firms aim to maximise profit, but may also aim for growth, survival, market share or social goals.</li>
</ul>
<div class="calc"><b>Full cost and profit example</b><br>
Data: a bakery makes 500 loaves. TFC = N$2 000. TVC = N$3 000. Price = N$12 per loaf.<br>
1) TC = TFC + TVC = 2 000 + 3 000 = <b class="ans">N$5 000</b><br>
2) AC = TC ÷ Q = 5 000 ÷ 500 = <b class="ans">N$10 per loaf</b><br>
3) TR = P × Q = 12 × 500 = <b class="ans">N$6 000</b><br>
4) Profit = TR − TC = 6 000 − 5 000 = <b class="ans">N$1 000</b></div>
<h3>4. Economies and diseconomies of scale</h3>
<ul>
<li><b>Economies of scale:</b> average cost <b>falls</b> as a firm grows (increases output).</li>
<li><b>Diseconomies of scale:</b> average cost <b>rises</b> as a firm grows too big.</li>
</ul>
<div class="tablewrap"><table>
<tr><th>Internal economies (inside the firm)</th><th>External economies (whole industry in an area)</th></tr>
<tr><td><b>Purchasing (bulk buying)</b> discounts<br><b>Technical</b>: bigger, better machines<br><b>Financial</b>: cheaper loans<br><b>Marketing</b>: advertising cost spread<br><b>Managerial</b>: specialist managers<br><b>Risk-bearing</b>: many products/markets</td><td>Skilled labour pool nearby<br>Good infrastructure (Walvis Bay port, roads)<br>Supplier firms locate nearby<br>Shared research and training colleges</td></tr>
</table></div>
<p><b>Diseconomies of scale:</b> poor communication, slow decisions, low worker motivation, coordination problems. External diseconomies: traffic congestion, higher land prices, shortage of workers in the area.</p>
<h3>5. Mergers (integration)</h3>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Meaning</th><th>Example</th></tr>
<tr><td>Horizontal</td><td>Two firms at the <b>same stage</b> of the same industry</td><td>Two supermarkets join</td></tr>
<tr><td>Vertical backward</td><td>Firm joins a firm at an <b>earlier</b> stage (a supplier)</td><td>A fish processor buys a fishing fleet</td></tr>
<tr><td>Vertical forward</td><td>Firm joins a firm at a <b>later</b> stage (closer to the customer)</td><td>A fishing company buys a fish canning factory or shops</td></tr>
<tr><td>Conglomerate (lateral)</td><td>Firms in <b>unrelated</b> industries</td><td>A mining company buys a hotel group</td></tr>
</table></div>
<p>Reasons: economies of scale, bigger market share, secure supplies or outlets, spread risk. Possible problems: job losses, higher prices (less competition), diseconomies of scale. The Namibian Competition Commission (NaCC) checks mergers.</p>
<h3>6. Why small firms survive</h3>
<p>Personal service, serve small or local markets, flexible, government support (e.g. SME loans), supply larger firms.</p>
`},
{ id:6, name:"Role of government in the economy", short:"Government", notes:`
<h3>1. Aims (macroeconomic objectives)</h3>
<ul>
<li>Economic growth (rising real GDP)</li>
<li>Low unemployment (full employment)</li>
<li>Low and stable inflation (price stability)</li>
<li>Balance of payments stability</li>
<li>Fair (more equal) distribution of income; protection of the environment</li>
</ul>
<p>Aims can <b>conflict</b>: e.g. faster growth can raise inflation; cutting inflation with higher interest rates can raise unemployment.</p>
<h3>2. Fiscal policy</h3>
<ul>
<li><b>Fiscal policy:</b> changing government spending and taxation to influence the economy. Run by the Ministry of Finance.</li>
<li><b>Expansionary</b>: more spending, lower taxes → more aggregate demand → growth and jobs (but risk of inflation and debt).</li>
<li><b>Contractionary</b>: less spending, higher taxes → lower demand → lower inflation (but risk of unemployment).</li>
</ul>
<h3>3. The budget</h3>
<ul>
<li><b>Budget:</b> the government's plan of expected revenue and spending for the next financial year (Namibia: 1 April to 31 March), presented by the Minister of Finance.</li>
<li><b>Budget deficit:</b> spending &gt; revenue (financed by borrowing). <b>Budget surplus:</b> revenue &gt; spending. <b>Balanced budget:</b> equal.</li>
<li>Main revenue sources in Namibia: income tax, VAT, <b>SACU receipts</b> (customs and excise revenue shared by Botswana, Eswatini, Lesotho, Namibia and South Africa), mining royalties.</li>
<li>Main spending: education, health, defence, infrastructure, social grants (e.g. old-age pension), interest on debt.</li>
</ul>
<div class="calc"><b>Budget balance</b><br>
Formula: balance = total revenue − total spending<br>
Working: revenue N$80 billion, spending N$88 billion. 80 − 88 = −8<br>
<b class="ans">Answer: budget deficit of N$8 billion</b></div>
<h3>4. Taxes</h3>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Meaning</th><th>Namibian examples</th></tr>
<tr><td>Direct tax</td><td>Tax on income or wealth, paid directly to the government (Namibia Revenue Agency, NamRA)</td><td>Personal income tax (PAYE), company (corporate) tax</td></tr>
<tr><td>Indirect tax</td><td>Tax on spending; paid by the seller, passed on in the price</td><td>VAT (15%), excise duty (alcohol, tobacco, fuel), customs/import duty</td></tr>
<tr><td>Progressive</td><td>% paid <b>rises</b> as income rises</td><td>Personal income tax</td></tr>
<tr><td>Proportional</td><td>Same % at all incomes</td><td>A flat-rate tax</td></tr>
<tr><td>Regressive</td><td>% of income paid <b>falls</b> as income rises</td><td>VAT and excise take a bigger share of a poor person's income</td></tr>
</table></div>
<p><b>Canons (qualities) of a good tax:</b> equity (fair), certainty, convenience, economy (cheap to collect), efficiency (does not harm incentives).</p>
<p>Reasons for taxes: raise revenue, reduce inequality, discourage demerit goods, correct external costs, protect local industries (tariffs), manage demand.</p>
<div class="calc"><b>Tax as a % of income</b><br>
Formula: average tax rate = tax paid ÷ income × 100<br>
Working: income N$20 000, tax N$3 000. 3 000 ÷ 20 000 × 100 = 15<br>
<b class="ans">Answer: 15%</b></div>
<div class="calc"><b>VAT</b><br>
Formula: VAT = price before VAT × 15 ÷ 100<br>
Working: a shirt costs N$200 before VAT. 200 × 0.15 = 30. Price with VAT = 230<br>
<b class="ans">Answer: VAT = N$30; selling price = N$230</b></div>
<h3>5. Monetary policy and interest rates</h3>
<ul>
<li><b>Monetary policy:</b> changing interest rates and the money supply to influence the economy. Run by the <b>Bank of Namibia</b> (Monetary Policy Committee). Because the N$ is pegged to the rand, the Bank of Namibia usually follows the South African Reserve Bank's repo rate closely.</li>
<li><b>Interest rate:</b> the price of borrowing money / the reward for saving.</li>
<li><b>Higher repo rate</b> → commercial banks raise lending rates → borrowing costs more, saving pays more → spending and investment fall → demand falls → <b>inflation falls</b> (but growth slows and unemployment may rise).</li>
<li><b>Lower repo rate</b> → cheaper loans → more spending and investment → growth and jobs (risk: inflation).</li>
</ul>
<h3>6. Supply-side policies</h3>
<p>Policies to increase the economy's productive capacity: education and training (e.g. vocational training centres), infrastructure, lower company tax, privatisation, deregulation, support for SMEs. They shift the PPC outward.</p>
`},
{ id:7, name:"Economic indicators", short:"Indicators", notes:`
<h3>1. Inflation</h3>
<ul>
<li><b>Inflation:</b> a sustained rise in the general price level over time. <b>Deflation:</b> a fall in the general price level.</li>
<li>Measured by the <b>Consumer Price Index (CPI)</b>, calculated in Namibia by the Namibia Statistics Agency (NSA).</li>
<li><b>Demand-pull inflation:</b> aggregate demand grows faster than supply ("too much money chasing too few goods").</li>
<li><b>Cost-push inflation:</b> higher production costs (wages, oil and fuel prices, imported inputs, weaker N$) are passed on as higher prices.</li>
<li><b>Effects:</b> lower purchasing power (fixed incomes hurt), savers lose if interest &lt; inflation, borrowers gain, exports less competitive, uncertainty, menu and shoe-leather costs.</li>
<li><b>Control:</b> higher interest rates, less government spending, higher taxes, supply-side policies.</li>
</ul>
<div class="calc"><b>Building a CPI (price index)</b><br>
Formula: index = cost of basket in current year ÷ cost in base year × 100<br>
Working: basket costs N$1 200 in 2024 (base) and N$1 290 in 2025. 1 290 ÷ 1 200 × 100 = 107.5<br>
<b class="ans">Answer: CPI 2025 = 107.5 (base year 2024 = 100)</b></div>
<div class="calc"><b>Inflation rate from a CPI</b><br>
Formula: inflation rate = (CPI this year − CPI last year) ÷ CPI last year × 100<br>
Working: CPI rises from 107.5 to 112.0. (112.0 − 107.5) ÷ 107.5 × 100 = 4.5 ÷ 107.5 × 100 = 4.19<br>
<b class="ans">Answer: inflation ≈ 4.2%</b></div>
<div class="calc"><b>Weighted price index</b> (each item's price index × its weight, add, ÷ total weight)<br>
Working: Food index 110 × weight 5 = 550; Transport 120 × 3 = 360; Clothing 100 × 2 = 200. Total = 1 110. 1 110 ÷ 10 = 111<br>
<b class="ans">Answer: weighted CPI = 111 → prices rose 11% since the base year</b></div>
<h3>2. Unemployment</h3>
<ul>
<li><b>Unemployed:</b> people of working age who are willing and able to work and actively looking for work, but have no job.</li>
<li><b>Labour force</b> = employed + unemployed.</li>
</ul>
<div class="calc"><b>Unemployment rate</b><br>
Formula: unemployment rate = number unemployed ÷ labour force × 100<br>
Working: labour force 1 000 000, unemployed 330 000. 330 000 ÷ 1 000 000 × 100 = 33<br>
<b class="ans">Answer: 33%</b></div>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Cause</th><th>Example</th></tr>
<tr><td>Frictional</td><td>Short time between jobs</td><td>A graduate looking for a first job</td></tr>
<tr><td>Structural</td><td>Decline of an industry; skills no longer needed</td><td>Workers after a mine closes (e.g. a copper mine)</td></tr>
<tr><td>Cyclical (demand-deficient)</td><td>Low demand in a recession</td><td>Construction workers laid off in a downturn</td></tr>
<tr><td>Seasonal</td><td>Demand changes with seasons</td><td>Tourism workers in the low season; harvest workers</td></tr>
<tr><td>Technological</td><td>Machines replace workers</td><td>Self-service tills replace cashiers</td></tr>
</table></div>
<p><b>Effects:</b> lost output, lower income and living standards, less tax and more spending on support, crime and social problems, skills lost. Youth unemployment is a major problem in Namibia.</p>
<p><b>Policies:</b> expansionary fiscal and monetary policy (cyclical), education and training (structural), job centres and information (frictional), support for SMEs and labour-intensive projects.</p>
<h3>3. GDP and national income</h3>
<ul>
<li><b>GDP (Gross Domestic Product):</b> the total value of all final goods and services produced in a country in one year.</li>
<li>Measured by output, income or expenditure method. Expenditure: <b>GDP = C + I + G + (X − M)</b>.</li>
<li><b>Real GDP</b> is adjusted for inflation. <b>Nominal GDP</b> is at current prices.</li>
<li><b>GDP per capita</b> = GDP ÷ population. Used to compare living standards.</li>
<li><b>Economic growth:</b> an increase in real GDP over time.</li>
</ul>
<div class="calc"><b>GDP per capita</b><br>
Formula: GDP per capita = GDP ÷ population<br>
Working: GDP N$250 000 million, population 3 million. 250 000 000 000 ÷ 3 000 000 = 83 333.33<br>
<b class="ans">Answer: about N$83 333 per person</b></div>
<div class="calc"><b>Economic growth rate</b><br>
Formula: growth rate = (real GDP this year − last year) ÷ last year × 100<br>
Working: real GDP rises from N$200 bn to N$206 bn. 6 ÷ 200 × 100 = 3<br>
<b class="ans">Answer: 3%</b></div>
<p>Limits of GDP per capita: ignores inequality, informal sector, quality of life, environment, leisure; prices differ between countries.</p>
<h3>4. The business cycle</h3>
[[dia:cycle]]
<ul>
<li><b>Boom</b> (peak): high output, low unemployment, rising inflation.</li>
<li><b>Recession</b> (downturn): real GDP falls for two quarters in a row, unemployment rises.</li>
<li><b>Slump</b> (trough): lowest output, high unemployment.</li>
<li><b>Recovery</b> (upturn): output and jobs rise again.</li>
</ul>
<h3>5. International trade</h3>
<ul>
<li><b>Exports:</b> goods/services sold to other countries (diamonds, uranium, fish, beef, grapes, tourism). <b>Imports:</b> bought from other countries (fuel, vehicles, machinery, food).</li>
<li>Benefits: wider choice, lower prices, bigger markets and economies of scale, access to resources not available locally, foreign currency.</li>
<li>Risks: dependence on a few exports (commodity prices change), job losses in import-competing industries.</li>
<li>Namibia trades in <b>SACU</b> (customs union: free trade and a common external tariff) and <b>SADC</b>, and has the AfCFTA.</li>
</ul>
<h3>6. Comparative advantage</h3>
<ul>
<li><b>Absolute advantage:</b> a country can produce more of a good than another with the same resources.</li>
<li><b>Comparative advantage:</b> a country can produce a good at a <b>lower opportunity cost</b> than another country. Trade benefits both if each specialises in its comparative advantage.</li>
</ul>
<div class="calc"><b>Comparative advantage</b><br>
Data (one worker, one day): Namibia: 6 tonnes fish or 2 tonnes maize. Zambia: 2 tonnes fish or 4 tonnes maize.<br>
Namibia: 1 fish costs 2 ÷ 6 = 0.33 maize. Zambia: 1 fish costs 4 ÷ 2 = 2 maize.<br>
Zambia: 1 maize costs 2 ÷ 4 = 0.5 fish. Namibia: 1 maize costs 6 ÷ 2 = 3 fish.<br>
<b class="ans">Answer: Namibia has comparative advantage in fish (0.33 &lt; 2); Zambia in maize (0.5 &lt; 3).</b></div>
<h3>7. Balance of payments</h3>
<ul>
<li><b>Balance of payments:</b> a record of all financial transactions between one country and the rest of the world over a year.</li>
<li><b>Current account</b>: trade in goods (visible trade), trade in services (invisible trade, e.g. tourism, transport), primary income (wages, interest, profits, dividends), secondary income (transfers, e.g. SACU receipts are recorded here, aid, remittances).</li>
<li><b>Financial/capital account</b>: investment flows (FDI, shares, loans).</li>
<li><b>Current account deficit:</b> more money flows out than in on the current account.</li>
<li>Fix a deficit: raise competitiveness (supply-side), reduce demand for imports (contractionary policy), tariffs/quotas, devaluation (not used in Namibia because of the peg).</li>
</ul>
<div class="calc"><b>Balance of trade in goods</b><br>
Formula: visible balance = exports of goods − imports of goods<br>
Working: exports N$60 bn, imports N$75 bn. 60 − 75 = −15<br>
<b class="ans">Answer: trade deficit of N$15 billion</b></div>
<h3>8. Exchange rates</h3>
<ul>
<li><b>Exchange rate:</b> the price of one currency in terms of another (e.g. US$1 = N$18.50).</li>
<li><b>Floating</b>: set by demand and supply. <b>Fixed / pegged</b>: set by government/central bank. N$ is pegged 1:1 to the rand, so the N$ floats against the US$ when the rand floats.</li>
<li><b>Appreciation</b> (N$ stronger): imports cheaper, exports dearer → lower inflation but exports fall.</li>
<li><b>Depreciation</b> (N$ weaker): exports cheaper (good for mining, fishing, tourism), imports dearer (fuel) → risk of cost-push inflation.</li>
</ul>
<div class="box tip">Memory aid: <b>SPICED</b>: Strong Pound/currency, Imports Cheaper, Exports Dearer.</div>
<h3>9. Protection</h3>
<ul>
<li>Methods: <b>tariffs</b> (taxes on imports), <b>quotas</b> (limit on quantity), <b>subsidies</b> to local firms, <b>embargo</b> (ban), red tape and standards.</li>
<li>Namibian example: infant industry protection for local products under SACU rules (e.g. on poultry, pasta, UHT milk).</li>
<li>Reasons: protect <b>infant industries</b>, protect jobs, stop <b>dumping</b>, improve the balance of payments, raise revenue, protect strategic industries, health and safety.</li>
<li>Against: higher prices and less choice for consumers, local firms become inefficient, other countries <b>retaliate</b>, breaks trade agreements.</li>
</ul>
`},
{ id:8, name:"Developed and developing economies", short:"Development", notes:`
<h3>1. Developed vs developing</h3>
<div class="tablewrap"><table>
<tr><th>Feature</th><th>Developed (e.g. Germany, Japan)</th><th>Developing (e.g. Namibia, Angola)</th></tr>
<tr><td>GDP per capita</td><td>High</td><td>Low or middle (Namibia: upper-middle income, but very unequal)</td></tr>
<tr><td>Main sector</td><td>Tertiary (services)</td><td>Primary (farming, mining) is important</td></tr>
<tr><td>Population growth</td><td>Low</td><td>High</td></tr>
<tr><td>Age structure</td><td>Ageing population</td><td>Young population</td></tr>
<tr><td>Life expectancy / literacy</td><td>High</td><td>Lower</td></tr>
<tr><td>Infrastructure</td><td>Good</td><td>Weaker, especially in rural areas</td></tr>
<tr><td>Inequality</td><td>Usually lower</td><td>Often high (Namibia has one of the highest Gini coefficients in the world)</td></tr>
</table></div>
<h3>2. Living standards and HDI</h3>
<ul>
<li><b>Standard of living:</b> the level of welfare/material comfort of people (income, goods and services, health, education).</li>
<li><b>Human Development Index (HDI)</b> (United Nations) combines three measures: <b>health</b> (life expectancy at birth), <b>education</b> (mean and expected years of schooling), <b>income</b> (GNI per capita).</li>
<li>HDI is between 0 and 1. Closer to 1 = more developed. Namibia is in the <b>medium</b> human development group.</li>
<li>HDI is better than GDP per capita alone because it includes health and education. Limits: ignores inequality, environment, freedom, informal sector.</li>
</ul>
<h3>3. Poverty</h3>
<ul>
<li><b>Absolute poverty:</b> cannot afford basic needs (food, shelter, clothing). <b>Relative poverty:</b> poor compared to others in the same society.</li>
<li>Causes: unemployment, low skills, large families, illness, drought, unequal land and income distribution.</li>
<li>Policies: education and training, job creation, social grants, progressive taxes, minimum wage, land reform, rural development, foreign aid.</li>
</ul>
<h3>4. Population</h3>
<ul>
<li>Population growth depends on <b>birth rate</b>, <b>death rate</b> and <b>net migration</b>.</li>
<li><b>Natural increase</b> = birth rate − death rate.</li>
<li><b>Dependency ratio</b> = dependants (young + old) ÷ working population. A young population means many dependants on few workers.</li>
<li>Effects of rapid population growth: pressure on schools, clinics, water and jobs; urban migration and informal settlements; but also a larger future labour force and market.</li>
<li>Optimum population: the size that gives the highest output per head.</li>
</ul>
<div class="calc"><b>Rate of natural increase</b><br>
Formula: natural increase (per 1 000) = birth rate − death rate; as % = ÷ 10<br>
Working: birth rate 28 per 1 000, death rate 8 per 1 000. 28 − 8 = 20 per 1 000 = 2.0%<br>
<b class="ans">Answer: 2.0% per year</b></div>
<div class="calc"><b>Dependency ratio</b><br>
Formula: dependants ÷ working-age population × 100<br>
Working: 0-14 years: 1.0 m, 65+: 0.1 m, 15-64: 1.9 m. (1.0 + 0.1) ÷ 1.9 × 100 = 57.9<br>
<b class="ans">Answer: ≈ 57.9 dependants per 100 workers</b></div>
<h3>5. Why some countries stay less developed</h3>
<p>Low savings and investment, low skills, poor infrastructure, dependence on a few primary exports, debt, corruption, climate and drought, rapid population growth.</p>
`},
{ id:9, name:"Conflicts of interest and sustainability", short:"Conflicts & environment", notes:`
<h3>1. Private, external and social costs and benefits</h3>
<div class="tablewrap"><table>
<tr><th>Term</th><th>Meaning</th><th>Example: a new uranium mine near Arandis</th></tr>
<tr><td>Private cost</td><td>Cost paid by the producer or consumer who makes the decision</td><td>Machines, wages, fuel</td></tr>
<tr><td>External cost (negative externality)</td><td>Cost paid by a <b>third party</b> who is not involved</td><td>Dust, radiation risk, water use from aquifers, damage to the desert</td></tr>
<tr><td>Social cost</td><td><b>Private cost + external cost</b></td><td>The full cost to society</td></tr>
<tr><td>Private benefit</td><td>Benefit to the decision maker</td><td>Mine's profit; workers' wages</td></tr>
<tr><td>External benefit (positive externality)</td><td>Benefit to a third party</td><td>New roads, local shops gain customers, clinics built</td></tr>
<tr><td>Social benefit</td><td><b>Private benefit + external benefit</b></td><td>The full benefit to society</td></tr>
</table></div>
<div class="calc"><b>Social cost and net social benefit</b><br>
Formula: social cost = private cost + external cost; net social benefit = social benefit − social cost<br>
Working: private cost N$40 m, external cost N$15 m → social cost = 55 m. Private benefit N$50 m, external benefit N$10 m → social benefit = 60 m. 60 − 55 = 5<br>
<b class="ans">Answer: net social benefit = +N$5 million → the project benefits society overall.</b></div>
<ul>
<li>Market failure: firms ignore external costs, so they over-produce goods that pollute. Merit goods with external benefits are under-produced.</li>
<li>Government responses: taxes or fines on polluters ("polluter pays"), regulations and laws, environmental impact assessments (EIA), permits and quotas, subsidies for clean technology.</li>
</ul>
<h3>2. Renewable and non-renewable resources</h3>
<div class="tablewrap"><table>
<tr><th>Renewable</th><th>Non-renewable</th></tr>
<tr><td>Can be replaced naturally (if not overused). Solar, wind, fish stocks, forests, water, wildlife. Namibia has huge solar and wind potential and green hydrogen plans.</td><td>Finite: once used they cannot be replaced. Diamonds, uranium, gold, zinc, oil and gas.</td></tr>
</table></div>
<p>Fish are renewable but can be <b>depleted by over-fishing</b>. Namibia uses <b>fishing quotas</b> (Total Allowable Catch) to protect stocks.</p>
<h3>3. Sustainability</h3>
<ul>
<li><b>Sustainable development:</b> meeting the needs of the present without reducing the ability of future generations to meet their needs.</li>
<li>Examples: community conservancies (local people benefit from wildlife and tourism), fishing quotas, solar energy, recycling, planting trees, water recycling in Windhoek.</li>
</ul>
<h3>4. Conflicts of interest</h3>
<div class="tablewrap"><table>
<tr><th>Group</th><th>What they want</th></tr>
<tr><td>Owners/shareholders</td><td>High profit</td></tr>
<tr><td>Workers</td><td>High wages, safe jobs</td></tr>
<tr><td>Consumers</td><td>Low prices, good quality</td></tr>
<tr><td>Local community</td><td>Jobs but a clean, safe environment</td></tr>
<tr><td>Government</td><td>Tax revenue, growth, jobs, protection of the environment</td></tr>
</table></div>
<p>Example: a new mine brings jobs and exports (growth) but may damage tourism, farming land and water. The government must weigh the costs and benefits (cost-benefit analysis).</p>
`}
];

<p>Namibia exports beef to Europe and China. In 2024 a drought hit the northern and central regions. Many farmers sold cattle early because there was no grazing. Later the number of cattle fell and beef prices in local butcheries rose from N$110 to N$132 per kg. At the same time, more Namibians were buying chicken. The Meat Board said that a government subsidy for animal feed would help farmers.</p>`,parts:[
